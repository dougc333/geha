<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">DSPy dental chatbot architecture</title>
  <desc id="desc">Two block diagrams. The enrollment tab uses DSPy language normalization followed by a deterministic LangGraph state machine and structured policy lookup. Dental Policy Q and A uses input and output guardrails. D7140 passes the output guard without repair, while only the Walmart unsupported claim enters a one-pass DSPy repair loop and a second guard check.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#e8edf2"/>
    </marker>
    <marker id="orange-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#f59e42"/>
    </marker>
    <style>
      .bg { fill: #111315; }
      .panel { fill: #191c20; stroke: #3a4048; stroke-width: 2; rx: 20; }
      .title { fill: #f4f6f8; font: 700 42px 'Chalkboard SE', 'Comic Sans MS', sans-serif; }
      .panel-title { fill: #f4f6f8; font: 700 29px 'Chalkboard SE', 'Comic Sans MS', sans-serif; }
      .panel-sub { fill: #aeb7c2; font: 400 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .node-title { fill: #ffffff; font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; text-anchor: middle; }
      .node-copy { fill: #e8edf2; font: 400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; text-anchor: middle; }
      .small { fill: #b8c0ca; font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; text-anchor: middle; }
      .label { fill: #f4f6f8; font: 700 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .bot { fill: #573f7f; stroke: #b99ae7; stroke-width: 2; }
      .model { fill: #174d69; stroke: #50b7df; stroke-width: 2; }
      .state { fill: #14563d; stroke: #55d69a; stroke-width: 2; }
      .data { fill: #5a4b16; stroke: #e3c04c; stroke-width: 2; }
      .gate { fill: #653d18; stroke: #f59e42; stroke-width: 3; }
      .danger { fill: #65272d; stroke: #f16d78; stroke-width: 2; }
      .good { fill: #15543d; stroke: #55d69a; stroke-width: 2; }
      .flow { fill: none; stroke: #e8edf2; stroke-width: 3; marker-end: url(#arrow); }
      .flow-orange { fill: none; stroke: #f59e42; stroke-width: 4; marker-end: url(#orange-arrow); }
      .flow-dashed { fill: none; stroke: #f59e42; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#orange-arrow); }
      .source-flow { fill: none; stroke: #e3c04c; stroke-width: 2; marker-end: url(#arrow); }
      .pill { fill: #352516; stroke: #f59e42; stroke-width: 1.5; rx: 14; }
      .pill-text { fill: #ffbd73; font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1180"/>
  <text class="title" x="70" y="65">DSPy Dental Chatbot — Application-Driven RAG</text>

  <!-- Enrollment panel -->
  <rect class="panel" x="50" y="95" width="1700" height="390"/>
  <text class="panel-title" x="85" y="140">1. Enrollment tab — state-machine RAG</text>
  <text class="panel-sub" x="85" y="169">DSPy interprets language; deterministic Python rules, LangGraph state and authoritative tables make the decisions.</text>

  <!-- Chatbot icon/node -->
  <rect class="bot" x="82" y="220" width="210" height="125" rx="16"/>
  <rect x="145" y="240" width="84" height="55" rx="12" fill="none" stroke="#ffffff" stroke-width="4"/>
  <circle cx="170" cy="267" r="5" fill="#ffffff"/><circle cx="204" cy="267" r="5" fill="#ffffff"/>
  <path d="M175 283 Q187 292 199 283" fill="none" stroke="#ffffff" stroke-width="3"/>
  <path d="M187 227 L187 240 M179 225 L195 225" stroke="#ffffff" stroke-width="3"/>
  <text class="node-title" x="187" y="321">Chatbot UI</text>
  <text class="small" x="187" y="339">member answer</text>

  <rect class="model" x="365" y="220" width="245" height="125" rx="16"/>
  <text class="node-title" x="488" y="258">DSPy normalizer</text>
  <text class="node-copy" x="488" y="285">free text → one allowed label</text>
  <text class="small" x="488" y="313">exact menu answers bypass LLM</text>

  <rect class="state" x="685" y="205" width="300" height="155" rx="16"/>
  <text class="node-title" x="835" y="244">LangGraph state machine</text>
  <text class="node-copy" x="835" y="273">stage + thread state</text>
  <text class="node-copy" x="835" y="298">eligibility + QLE transitions</text>
  <text class="small" x="835" y="326">new-hire precedence is enforced here</text>

  <rect class="data" x="1060" y="220" width="290" height="125" rx="16"/>
  <text class="node-title" x="1205" y="258">Structured policy lookup</text>
  <text class="node-copy" x="1205" y="286">QLE, rate-code and premium tables</text>
  <text class="small" x="1205" y="313">authoritative values + provenance</text>

  <rect class="bot" x="1425" y="220" width="240" height="125" rx="16"/>
  <text class="node-title" x="1545" y="258">Chatbot response</text>
  <text class="node-copy" x="1545" y="285">next question, estimate</text>
  <text class="small" x="1545" y="313">or BENEFEDS handoff</text>

  <path class="flow" d="M292 282 H355"/>
  <path class="flow" d="M610 282 H675"/>
  <path class="flow" d="M985 282 H1050"/>
  <path class="flow" d="M1350 282 H1415"/>

  <rect class="data" x="825" y="398" width="195" height="52" rx="12"/>
  <rect class="data" x="1045" y="398" width="195" height="52" rx="12"/>
  <rect class="data" x="1265" y="398" width="195" height="52" rx="12"/>
  <text class="node-copy" x="922" y="430">QLE matrix</text>
  <text class="node-copy" x="1142" y="430">State/ZIP rate codes</text>
  <text class="node-copy" x="1362" y="430">Premium table</text>
  <path class="source-flow" d="M922 398 C930 365 1075 365 1150 348"/>
  <path class="source-flow" d="M1142 398 V355"/>
  <path class="source-flow" d="M1362 398 C1350 365 1260 365 1230 348"/>
  <text class="panel-sub" x="85" y="442">The model normalizes member language; it cannot override the state machine or structured policy records.</text>

  <!-- Policy Q&A panel -->
  <rect class="panel" x="50" y="515" width="1700" height="615"/>
  <text class="panel-title" x="85" y="560">2. Dental Policy Q&amp;A — guardrails plus one conditional self-corrective loop</text>
  <text class="panel-sub" x="85" y="589">Only an unsupported generated claim enters repair. Other unsafe categories fail closed.</text>

  <rect class="bot" x="82" y="635" width="200" height="110" rx="16"/>
  <text class="node-title" x="182" y="674">Chatbot query</text>
  <text class="node-copy" x="182" y="701">Walmart or D7140</text>

  <rect class="gate" x="335" y="625" width="230" height="130" rx="16"/>
  <text class="node-title" x="450" y="659">GATE 1</text>
  <text class="node-title" x="450" y="685">Input guard</text>
  <text class="small" x="450" y="713">JEV or DSPy fallback</text>
  <text class="small" x="450" y="735">unsafe/error → refuse</text>

  <rect class="model" x="620" y="615" width="310" height="150" rx="16"/>
  <text class="node-title" x="775" y="649">Evidence assembly</text>
  <text class="node-copy" x="775" y="677">Docling BM25 + BGE vector + hybrid</text>
  <text class="node-copy" x="775" y="704">SQLite exact benefit lookup</text>
  <text class="small" x="775" y="732">page-aware chunks + citations</text>

  <rect class="model" x="985" y="635" width="240" height="110" rx="16"/>
  <text class="node-title" x="1105" y="674">DSPy generator</text>
  <text class="node-copy" x="1105" y="701">cited draft answer</text>

  <rect class="gate" x="1280" y="615" width="300" height="150" rx="16"/>
  <text class="node-title" x="1430" y="649">GATE 2</text>
  <text class="node-title" x="1430" y="676">Output evidence guard</text>
  <text class="small" x="1430" y="705">checks claims against retrieved pages</text>
  <text class="small" x="1430" y="730">safe / unsupported / other unsafe</text>

  <path class="flow" d="M282 690 H325"/>
  <path class="flow" d="M565 690 H610"/>
  <path class="flow" d="M930 690 H975"/>
  <path class="flow" d="M1225 690 H1270"/>

  <!-- D7140 branch -->
  <text class="label" x="110" y="826">D7140: guardrail/gate path — no correction needed</text>
  <rect class="model" x="110" y="848" width="330" height="105" rx="15"/>
  <text class="node-title" x="275" y="879">Grounded draft</text>
  <text class="node-copy" x="275" y="906">simple extraction [p. 26]</text>
  <text class="small" x="275" y="930">High 20%; Standard 45% [p. 23]</text>

  <rect class="gate" x="510" y="848" width="235" height="105" rx="15"/>
  <text class="node-title" x="627" y="882">GATE 2: safe</text>
  <text class="small" x="627" y="913">plan terms ≠ payment promise</text>

  <rect class="good" x="815" y="848" width="270" height="105" rx="15"/>
  <text class="node-title" x="950" y="882">Return original answer</text>
  <text class="small" x="950" y="913">no rewrite; no repair loop</text>

  <path class="flow" d="M440 900 H500"/>
  <path class="flow" d="M745 900 H805"/>
  <path class="flow" d="M1430 765 C1430 805 790 790 745 850"/>
  <text class="small" x="1190" y="804">safe D7140 branch</text>

  <!-- Walmart branch -->
  <text class="label" x="110" y="1007">Walmart glasses: DSPy self-corrective loop — one bounded repair</text>
  <rect class="danger" x="110" y="1027" width="330" height="78" rx="15"/>
  <text class="node-title" x="275" y="1057">Draft adds unsupported claim</text>
  <text class="small" x="275" y="1083">“Walmart may not participate”</text>

  <rect class="gate" x="500" y="1027" width="235" height="78" rx="15"/>
  <text class="node-title" x="617" y="1057">GATE 2</text>
  <text class="small" x="617" y="1083">unsupported_claim</text>

  <rect class="model" x="795" y="1027" width="300" height="78" rx="15"/>
  <text class="node-title" x="945" y="1057">DSPy repair once</text>
  <text class="small" x="945" y="1083">same evidence + draft + critique</text>

  <rect class="gate" x="1155" y="1027" width="245" height="78" rx="15"/>
  <text class="node-title" x="1277" y="1057">GATE 2 recheck</text>
  <text class="small" x="1277" y="1083">safe → release</text>

  <rect class="good" x="1460" y="1027" width="235" height="78" rx="15"/>
  <text class="node-title" x="1577" y="1057">Chatbot answer</text>
  <text class="small" x="1577" y="1083">else refuse</text>

  <path class="flow-orange" d="M440 1066 H490"/>
  <path class="flow-orange" d="M735 1066 H785"/>
  <path class="flow-orange" d="M1095 1066 H1145"/>
  <path class="flow-orange" d="M1400 1066 H1450"/>
  <path class="flow-dashed" d="M1430 765 C1430 970 400 950 420 1025"/>
  <rect class="pill" x="1210" y="940" width="190" height="30"/>
  <text class="pill-text" x="1305" y="960">WALMART ONLY</text>
  <text class="small" x="1275" y="1120">If the revised answer is still unsafe or the guard errors, the system refuses.</text>
</svg>
