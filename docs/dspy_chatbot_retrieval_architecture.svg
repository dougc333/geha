<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">DSPy dental chatbot retrieval architecture</title>
  <desc id="desc">The Dental Policy Q and A chatbot passes a query through a JEV input gate and query routing. Docling page Markdown is indexed by an in-memory BM25 index and a local BGE vector index cached as NumPy arrays. Retrieval can use BM25, vector search, or hybrid reciprocal rank fusion. The current chatbot has no learned or Cohere reranker; an optional inactive reranker slot is shown after fusion. Top ranked page evidence is enriched with exact SQLite benefit records, sent to the DSPy generator, and checked by the DSPy output evidence guard.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#e8edf2"/>
    </marker>
    <style>
      .bg{fill:#111315}.panel{fill:#191c20;stroke:#3a4048;stroke-width:2}.title{fill:#f4f6f8;font:700 42px 'Chalkboard SE','Comic Sans MS',sans-serif}.head{fill:#f4f6f8;font:700 28px 'Chalkboard SE','Comic Sans MS',sans-serif}.sub{fill:#aeb7c2;font:400 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.nt{fill:#fff;font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-anchor:middle}.copy{fill:#e8edf2;font:400 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-anchor:middle}.small{fill:#b8c0ca;font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-anchor:middle}.left{fill:#e8edf2;font:400 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.bot{fill:#573f7f;stroke:#b99ae7;stroke-width:2}.guard{fill:#743e12;stroke:#f59e42;stroke-width:3}.route{fill:#174d69;stroke:#50b7df;stroke-width:2}.bm25{fill:#5a4b16;stroke:#e3c04c;stroke-width:2}.vector{fill:#174d69;stroke:#50b7df;stroke-width:2}.fusion{fill:#4f3569;stroke:#b99ae7;stroke-width:2}.data{fill:#14563d;stroke:#55d69a;stroke-width:2}.off{fill:#343941;stroke:#8b96a3;stroke-width:2;stroke-dasharray:9 7}.danger{fill:#65272d;stroke:#f16d78;stroke-width:2}.flow{fill:none;stroke:#e8edf2;stroke-width:3;marker-end:url(#arrow)}.thin{fill:none;stroke:#aeb7c2;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#8b96a3;stroke-width:2;stroke-dasharray:9 7;marker-end:url(#arrow)}.caption{fill:#91efbe;font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;text-anchor:middle}.badge{fill:#153f31;stroke:#55d69a;stroke-width:1.5}.warn{fill:#4b241d;stroke:#f59e42;stroke-width:1.5}.warntext{fill:#ffbd73;font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace;text-anchor:middle}
    </style>
  </defs>

  <rect class="bg" width="1800" height="1080"/>
  <text class="title" x="65" y="62">DSPy Dental Chatbot — Retrieval Architecture</text>

  <!-- Index construction -->
  <rect class="panel" x="45" y="92" width="1710" height="265" rx="20"/>
  <text class="head" x="80" y="136">Offline / cached index construction</text>
  <text class="sub" x="80" y="165">The searchable evidence unit returned to the chatbot is a complete Docling page, preserving table context and provenance.</text>

  <rect class="data" x="90" y="205" width="270" height="105" rx="16"/>
  <text class="nt" x="225" y="240">Docling page Markdown</text>
  <text class="copy" x="225" y="267">one document page per unit</text>
  <text class="small" x="225" y="291">document · page · source · section</text>

  <rect class="bm25" x="500" y="195" width="360" height="125" rx="16"/>
  <text class="nt" x="680" y="231">BM25 lexical index</text>
  <text class="copy" x="680" y="258">rank_bm25.BM25Okapi in memory</text>
  <text class="small" x="680" y="284">tokenized full-page Markdown</text>
  <text class="small" x="680" y="306">best for exact CDT codes and terms</text>

  <rect class="vector" x="1030" y="185" width="430" height="145" rx="16"/>
  <text class="nt" x="1245" y="221">BGE vector retrieval index</text>
  <text class="copy" x="1245" y="249">BAAI/bge-large-en-v1.5 embeddings</text>
  <text class="small" x="1245" y="275">440-token windows · 360-token stride</text>
  <text class="small" x="1245" y="298">max window similarity aggregated to page</text>
  <text class="small" x="1245" y="319">cached NumPy .npy — not a vector database</text>

  <path class="flow" d="M360 257 H490"/>
  <path class="flow" d="M360 257 C650 145 900 145 1020 240"/>
  <rect class="badge" x="1510" y="215" width="190" height="50" rx="16"/>
  <text class="caption" x="1605" y="246">WARMED + CACHED</text>

  <!-- Online retrieval -->
  <rect class="panel" x="45" y="385" width="1710" height="645" rx="20"/>
  <text class="head" x="80" y="430">Online Dental Policy Q&amp;A request</text>
  <text class="sub" x="80" y="459">The UI can select BM25, vector, hybrid or auto. Hybrid uses reciprocal-rank fusion; no learned reranker is currently wired into this chatbot.</text>

  <rect class="bot" x="75" y="510" width="185" height="105" rx="16"/>
  <text class="nt" x="167" y="548">Chatbot query</text>
  <text class="copy" x="167" y="576">member question</text>

  <rect class="guard" x="310" y="500" width="220" height="125" rx="16"/>
  <text class="nt" x="420" y="536">Gate 1 — JEV</text>
  <text class="copy" x="420" y="564">input safety</text>
  <text class="small" x="420" y="591">safe → continue</text>
  <text class="small" x="420" y="611">unsafe/error → refuse</text>

  <rect class="route" x="580" y="490" width="290" height="145" rx="16"/>
  <text class="nt" x="725" y="524">Query preparation</text>
  <text class="copy" x="725" y="552">retailer vocabulary expansion</text>
  <text class="small" x="725" y="579">D#### → exact-code BM25 path</text>
  <text class="small" x="725" y="602">ordinary language → selected mode</text>
  <text class="small" x="725" y="624">auto: code=BM25, otherwise=vector</text>

  <path class="flow" d="M260 562 H300"/>
  <path class="flow" d="M530 562 H570"/>

  <!-- Retrieval units -->
  <text class="head" x="925" y="500">Retrieval units</text>
  <rect class="bm25" x="920" y="525" width="245" height="105" rx="15"/>
  <text class="nt" x="1042" y="559">BM25 retrieval</text>
  <text class="small" x="1042" y="584">lexical page ranking</text>
  <text class="small" x="1042" y="607">exact code reservation</text>

  <rect class="vector" x="920" y="660" width="245" height="105" rx="15"/>
  <text class="nt" x="1042" y="694">Vector retrieval</text>
  <text class="small" x="1042" y="719">query embedding + cosine</text>
  <text class="small" x="1042" y="742">semantic page ranking</text>

  <rect class="fusion" x="1220" y="575" width="260" height="125" rx="15"/>
  <text class="nt" x="1350" y="610">RRF rank fusion</text>
  <text class="copy" x="1350" y="638">hybrid mode only</text>
  <text class="small" x="1350" y="664">BM25 top 30 + vector top 30</text>
  <text class="small" x="1350" y="686">Σ 1 / (60 + rank)</text>

  <path class="thin" d="M870 550 H910"/>
  <path class="thin" d="M870 590 C890 590 890 710 910 710"/>
  <path class="thin" d="M1165 577 C1190 577 1190 615 1210 615"/>
  <path class="thin" d="M1165 712 C1190 712 1190 660 1210 660"/>
  <path class="thin" d="M680 490 C680 420 680 352 680 322"/>
  <path class="thin" d="M760 490 C860 400 1140 395 1230 332"/>

  <!-- Rerank and context assembly -->
  <rect class="off" x="1525" y="575" width="190" height="125" rx="15"/>
  <text class="nt" x="1620" y="608">Learned reranker</text>
  <text class="copy" x="1620" y="637">Cohere / cross-encoder</text>
  <text class="small" x="1620" y="663">optional insertion point</text>
  <text class="small" x="1620" y="687">NOT ACTIVE</text>
  <path class="dash" d="M1480 638 H1515"/>

  <rect class="warn" x="1220" y="725" width="495" height="57" rx="15"/>
  <text class="warntext" x="1467" y="750">CURRENT “RERANKING” = RRF FUSION, NOT AN LLM</text>
  <text class="small" x="1467" y="772">EvidenceReranker exists elsewhere but is not called by the DSPy chatbot.</text>

  <rect class="data" x="80" y="845" width="260" height="125" rx="16"/>
  <text class="nt" x="210" y="881">Top-k page evidence</text>
  <text class="copy" x="210" y="908">4 pages normally</text>
  <text class="small" x="210" y="933">6 for exact CDT questions</text>
  <text class="small" x="210" y="955">page provenance retained</text>

  <rect class="data" x="395" y="845" width="260" height="125" rx="16"/>
  <text class="nt" x="525" y="881">SQLite enrichment</text>
  <text class="copy" x="525" y="908">exact benefit row</text>
  <text class="small" x="525" y="933">authoritative costs + limits</text>
  <text class="small" x="525" y="955">when a supported alias/code resolves</text>

  <rect class="route" x="710" y="845" width="250" height="125" rx="16"/>
  <text class="nt" x="835" y="881">Context assembly</text>
  <text class="copy" x="835" y="908">query + cited evidence</text>
  <text class="small" x="835" y="933">structured row replaces raw</text>
  <text class="small" x="835" y="955">page-5 table when applicable</text>

  <rect class="route" x="1015" y="845" width="235" height="125" rx="16"/>
  <text class="nt" x="1132" y="889">DSPy generator</text>
  <text class="copy" x="1132" y="918">cited answer draft</text>
  <text class="small" x="1132" y="945">evidence only</text>

  <rect class="guard" x="1305" y="845" width="235" height="125" rx="16"/>
  <text class="nt" x="1422" y="881">Gate 2 — DSPy</text>
  <text class="copy" x="1422" y="908">output evidence guard</text>
  <text class="small" x="1422" y="933">safe → return</text>
  <text class="small" x="1422" y="955">unsupported → repair once</text>

  <rect class="bot" x="1590" y="845" width="125" height="125" rx="16"/>
  <text class="nt" x="1652" y="895">Chatbot</text>
  <text class="copy" x="1652" y="923">answer</text>
  <text class="small" x="1652" y="948">or refusal</text>

  <path class="flow" d="M1350 700 C1350 820 390 800 340 900"/>
  <path class="flow" d="M340 907 H385"/>
  <path class="flow" d="M655 907 H700"/>
  <path class="flow" d="M960 907 H1005"/>
  <path class="flow" d="M1250 907 H1295"/>
  <path class="flow" d="M1540 907 H1580"/>
</svg>
