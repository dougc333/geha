<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Subagents and compaction</title>
  <desc>Center: the main agent's context window 40 turns in, near its limit. Left: the main agent delegates a task to a subagent with its own fresh context window and gets a short result back. Right: compaction replaces turns 1 to 35 with a summary, freeing space, but it is lossy: exact values, raw tool output, and early details are dropped.</desc>
  <style>
    .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .cap { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .red { fill: #A32D2D; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .label { font-size: 24px; font-weight: 700; fill: #2C2C2A; }
    .frame { fill: none; stroke: #888780; stroke-width: 1; }
    .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    .lost { fill: none; stroke: #E24B4A; stroke-width: 1; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <pattern id="hA" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FAEEDA"/><line x1="0" y1="0" x2="0" y2="8" stroke="#EF9F27" stroke-width="2.5"/></pattern>
    <pattern id="hR" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FCEBEB"/><line x1="0" y1="0" x2="0" y2="8" stroke="#E24B4A" stroke-width="2.5"/></pattern>
    <pattern id="hG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#F1EFE8"/><line x1="0" y1="0" x2="0" y2="8" stroke="#B4B2A9" stroke-width="2.5"/></pattern>
    <pattern id="hP" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#EEEDFE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#AFA9EC" stroke-width="2.5"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
  <text class="label" x="40" y="48">Subagents and compaction</text>

  <!-- Subagent (left) -->
  <rect class="frame" x="90" y="180" width="140" height="240"/>
  <line x1="90" y1="194" x2="230" y2="194" stroke="#E24B4A" stroke-width="2"/>
  <text class="ts red" x="160" y="168" text-anchor="middle" dominant-baseline="central">context limit</text>
  <rect x="100" y="376" width="120" height="32" rx="3" fill="url(#hG)" stroke="#5F5E5A" stroke-width="1"/><text class="th halo" x="160" y="392" text-anchor="middle" dominant-baseline="central">task brief</text>
  <rect x="100" y="338" width="120" height="32" rx="3" fill="url(#hA)" stroke="#854F0B" stroke-width="1"/><text class="th halo" x="160" y="354" text-anchor="middle" dominant-baseline="central">search</text>
  <rect x="100" y="300" width="120" height="32" rx="3" fill="url(#hA)" stroke="#854F0B" stroke-width="1"/><text class="th halo" x="160" y="316" text-anchor="middle" dominant-baseline="central">read pages</text>
  <text class="cap" x="160" y="444" text-anchor="middle" dominant-baseline="central">subagent</text>
  <text class="ts" x="160" y="464" text-anchor="middle" dominant-baseline="central">fresh context, own window</text>

  <!-- Main agent, 40 turns (center) -->
  <rect class="frame" x="390" y="104" width="180" height="366"/>
  <line x1="390" y1="118" x2="570" y2="118" stroke="#E24B4A" stroke-width="2"/>
  <text class="ts red" x="480" y="92" text-anchor="middle" dominant-baseline="central">context limit</text>
  <rect x="402" y="422" width="156" height="38" rx="3" fill="url(#hA)" stroke="#854F0B" stroke-width="1"/><text class="th halo" x="480" y="441" text-anchor="middle" dominant-baseline="central">turns 1–6</text>
  <rect x="402" y="378" width="156" height="38" rx="3" fill="url(#hA)" stroke="#854F0B" stroke-width="1"/><text class="th halo" x="480" y="397" text-anchor="middle" dominant-baseline="central">turns 7–12</text>
  <rect x="402" y="334" width="156" height="38" rx="3" fill="url(#hA)" stroke="#854F0B" stroke-width="1"/><text class="th halo" x="480" y="353" text-anchor="middle" dominant-baseline="central">turns 13–18</text>
  <rect x="402" y="290" width="156" height="38" rx="3" fill="url(#hA)" stroke="#854F0B" stroke-width="1"/><text class="th halo" x="480" y="309" text-anchor="middle" dominant-baseline="central">turns 19–24</text>
  <rect x="402" y="246" width="156" height="38" rx="3" fill="url(#hA)" stroke="#854F0B" stroke-width="1"/><text class="th halo" x="480" y="265" text-anchor="middle" dominant-baseline="central">turns 25–30</text>
  <rect x="402" y="202" width="156" height="38" rx="3" fill="url(#hR)" stroke="#A32D2D" stroke-width="1"/><text class="th halo" x="480" y="221" text-anchor="middle" dominant-baseline="central">turns 31–35</text>
  <rect x="402" y="158" width="156" height="38" rx="3" fill="url(#hR)" stroke="#A32D2D" stroke-width="1"/><text class="th halo" x="480" y="177" text-anchor="middle" dominant-baseline="central">turns 36–40</text>
  <text class="cap" x="480" y="494" text-anchor="middle" dominant-baseline="central">main agent, 40 turns in</text>
  <text class="ts red" x="480" y="514" text-anchor="middle" dominant-baseline="central">almost at the limit</text>

  <!-- Delegate to subagent -->
  <line x1="236" y1="290" x2="384" y2="290" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="ts" x="310" y="276" text-anchor="middle" dominant-baseline="central">delegate task</text>
  <text class="ts" x="310" y="306" text-anchor="middle" dominant-baseline="central">short result back</text>

  <!-- Compaction (right) -->
  <line x1="576" y1="290" x2="734" y2="290" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="ts" x="655" y="276" text-anchor="middle" dominant-baseline="central">compact</text>
  <text class="ts" x="655" y="306" text-anchor="middle" dominant-baseline="central">summary replaces turns</text>
  <rect class="frame" x="740" y="104" width="160" height="366"/>
  <line x1="740" y1="118" x2="900" y2="118" stroke="#E24B4A" stroke-width="2"/>
  <text class="ts red" x="820" y="92" text-anchor="middle" dominant-baseline="central">context limit</text>
  <rect x="750" y="428" width="140" height="32" rx="3" fill="url(#hG)" stroke="#5F5E5A" stroke-width="1"/><text class="th halo" x="820" y="444" text-anchor="middle" dominant-baseline="central">tool schemas</text>
  <rect x="750" y="360" width="140" height="60" rx="3" fill="url(#hP)" stroke="#534AB7" stroke-width="1"/><text class="th halo" x="820" y="381" text-anchor="middle" dominant-baseline="central">summary of</text><text class="th halo" x="820" y="399" text-anchor="middle" dominant-baseline="central">turns 1–35</text>
  <rect x="750" y="314" width="140" height="38" rx="3" fill="url(#hA)" stroke="#854F0B" stroke-width="1"/><text class="th halo" x="820" y="333" text-anchor="middle" dominant-baseline="central">turns 36–40</text>
  <rect class="lost" x="750" y="150" width="140" height="150" rx="6"/>
  <text class="th red" x="820" y="170" text-anchor="middle" dominant-baseline="central">lost in summary</text>
  <text class="ts red" x="820" y="200" text-anchor="middle" dominant-baseline="central" text-decoration="line-through">exact table values</text>
  <text class="ts red" x="820" y="224" text-anchor="middle" dominant-baseline="central" text-decoration="line-through">raw OCR output</text>
  <text class="ts red" x="820" y="248" text-anchor="middle" dominant-baseline="central" text-decoration="line-through">early decisions</text>
  <text class="ts red" x="820" y="272" text-anchor="middle" dominant-baseline="central" text-decoration="line-through">why a fix failed</text>
  <text class="cap" x="820" y="494" text-anchor="middle" dominant-baseline="central">after compaction</text>
  <text class="ts red" x="820" y="514" text-anchor="middle" dominant-baseline="central">more room, but lossy</text>
</svg>
