<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Where JEV is active in the DSPy dental chatbot</title>
  <desc id="desc">JEV is active as Gate 1, the input safety classifier for Dental Policy Q and A, because the TypeSafe API key and SDK are configured. The output evidence guard is DSPy. In the active Enrollment tab, JEV is explicitly disabled; DSPy normalizes language before the LangGraph state machine and QLE matrix.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#e8edf2"/>
    </marker>
    <style>
      .bg{fill:#111315}.panel{fill:#191c20;stroke:#3a4048;stroke-width:2}.title{fill:#f4f6f8;font:700 42px 'Chalkboard SE','Comic Sans MS',sans-serif}.head{fill:#f4f6f8;font:700 28px 'Chalkboard SE','Comic Sans MS',sans-serif}.sub{fill:#aeb7c2;font:400 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.nt{fill:#fff;font:700 19px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-anchor:middle}.copy{fill:#e8edf2;font:400 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-anchor:middle}.small{fill:#b8c0ca;font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-anchor:middle}.bot{fill:#573f7f;stroke:#b99ae7;stroke-width:2}.jev{fill:#743e12;stroke:#f59e42;stroke-width:4}.model{fill:#174d69;stroke:#50b7df;stroke-width:2}.state{fill:#14563d;stroke:#55d69a;stroke-width:2}.off{fill:#343941;stroke:#7d8794;stroke-width:2;stroke-dasharray:8 6}.bad{fill:#65272d;stroke:#f16d78;stroke-width:2}.flow{fill:none;stroke:#e8edf2;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#7d8794;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}.active{fill:#15543d;stroke:#55d69a;stroke-width:2}.pill{fill:#153f31;stroke:#55d69a;stroke-width:2}.pilltext{fill:#91efbe;font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;text-anchor:middle}.label{fill:#f4f6f8;font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1600" height="820"/>
  <text class="title" x="60" y="62">Where JEV Is in the Dental Chatbot</text>
  <rect class="pill" x="1180" y="27" width="355" height="47" rx="18"/>
  <text class="pilltext" x="1357" y="56">ACTIVE: KEY + SDK CONFIGURED</text>

  <rect class="panel" x="45" y="95" width="1510" height="430" rx="20"/>
  <text class="head" x="80" y="138">Dental Policy Q&amp;A — JEV is active here</text>
  <text class="sub" x="80" y="168">JEV classifies the member’s question before any generated answer may be released.</text>

  <rect class="bot" x="75" y="245" width="190" height="115" rx="16"/>
  <rect x="133" y="261" width="74" height="45" rx="10" fill="none" stroke="#fff" stroke-width="4"/>
  <circle cx="155" cy="283" r="4" fill="#fff"/><circle cx="185" cy="283" r="4" fill="#fff"/>
  <path d="M158 295 Q170 303 182 295 M170 250 V261 M162 249 H178" fill="none" stroke="#fff" stroke-width="3"/>
  <text class="nt" x="170" y="332">Chatbot query</text>
  <text class="small" x="170" y="351">member message</text>

  <rect class="jev" x="330" y="220" width="290" height="165" rx="18"/>
  <text class="nt" x="475" y="254">GATE 1 — TypeSafe JEV</text>
  <text class="copy" x="475" y="284">Input safety classification</text>
  <text class="small" x="475" y="312">safe · prompt injection · member data</text>
  <text class="small" x="475" y="335">self-harm · abuse · harmful request</text>
  <text class="small" x="475" y="360">unsafe, uncertain or error → refuse</text>

  <rect class="model" x="695" y="220" width="310" height="165" rx="18"/>
  <text class="nt" x="850" y="254">Retrieval + DSPy draft</text>
  <text class="copy" x="850" y="284">BM25 / BGE / hybrid</text>
  <text class="copy" x="850" y="309">SQLite exact lookup</text>
  <text class="small" x="850" y="337">runs in parallel with Gate 1</text>
  <text class="small" x="850" y="360">draft is held until input is safe</text>

  <rect class="model" x="1080" y="220" width="285" height="165" rx="18"/>
  <text class="nt" x="1222" y="254">GATE 2 — DSPy</text>
  <text class="copy" x="1222" y="284">Output evidence guard</text>
  <text class="small" x="1222" y="312">checks answer against retrieved pages</text>
  <text class="small" x="1222" y="337">safe → return</text>
  <text class="small" x="1222" y="360">unsupported → repair once</text>

  <rect class="bot" x="1420" y="245" width="105" height="115" rx="16"/>
  <text class="nt" x="1472" y="289">Chatbot</text>
  <text class="copy" x="1472" y="316">answer</text>
  <text class="small" x="1472" y="340">or refusal</text>

  <path class="flow" d="M265 302 H320"/>
  <path class="flow" d="M620 302 H685"/>
  <path class="flow" d="M1005 302 H1070"/>
  <path class="flow" d="M1365 302 H1410"/>

  <rect class="active" x="330" y="422" width="1035" height="65" rx="14"/>
  <text class="copy" x="847" y="449">Current runtime selection: TYPESAFE_API_KEY present → JevInputGuard</text>
  <text class="small" x="847" y="474">If the key is absent, Gate 1 falls back to a DSPy input classifier. Gate 2 remains DSPy in either case.</text>

  <rect class="panel" x="45" y="555" width="1510" height="220" rx="20"/>
  <text class="head" x="80" y="598">Enrollment tab — JEV is not active; state-machine RAG is used instead</text>
  <text class="sub" x="80" y="628">The Enrollment tab explicitly passes <tspan font-family="ui-monospace,monospace">jev=lambda *_: None</tspan>; DSPy normalizes language before deterministic routing.</text>

  <rect class="bot" x="90" y="660" width="190" height="80" rx="15"/>
  <text class="nt" x="185" y="693">Chatbot UI</text>
  <text class="small" x="185" y="718">member response</text>
  <rect class="model" x="350" y="660" width="240" height="80" rx="15"/>
  <text class="nt" x="470" y="693">DSPy normalizer</text>
  <text class="small" x="470" y="718">free text → label</text>
  <rect class="state" x="660" y="660" width="265" height="80" rx="15"/>
  <text class="nt" x="792" y="693">LangGraph state</text>
  <text class="small" x="792" y="718">deterministic routing</text>
  <rect class="state" x="995" y="660" width="245" height="80" rx="15"/>
  <text class="nt" x="1117" y="693">QLE matrix</text>
  <text class="small" x="1117" y="718">authoritative rules</text>
  <rect class="off" x="1310" y="660" width="200" height="80" rx="15"/>
  <text class="nt" x="1410" y="693">JEV disabled</text>
  <text class="small" x="1410" y="718">optional hooks remain</text>

  <path class="flow" d="M280 700 H340"/>
  <path class="flow" d="M590 700 H650"/>
  <path class="flow" d="M925 700 H985"/>
  <path class="dash" d="M1310 700 H1250"/>
</svg>
