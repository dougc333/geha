<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Context fills up in a long harness run</title>
  <desc>What fills the harness context window (tool schemas, tool results, and a large OCR output of the full PDF), all re-sent on every call, and a chart showing the error rate rising as more of the context is used.</desc>
  <style>
    .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .cap { font-size: 14px; fill: #444441; }
    .red { fill: #A32D2D; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .label { font-size: 24px; font-weight: 700; fill: #2C2C2A; }
    .frame { fill: none; stroke: #888780; stroke-width: 1; }
    .axis { stroke: #888780; stroke-width: 1; fill: none; }
  </style>
  <defs>
    <pattern id="hA" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FAEEDA"/><line x1="0" y1="0" x2="0" y2="8" stroke="#EF9F27" stroke-width="2.5"/></pattern>
    <pattern id="hR" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FCEBEB"/><line x1="0" y1="0" x2="0" y2="8" stroke="#E24B4A" stroke-width="2.5"/></pattern>
    <pattern id="hG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#F1EFE8"/><line x1="0" y1="0" x2="0" y2="8" stroke="#B4B2A9" stroke-width="2.5"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
  <text class="label" x="40" y="48">Context fills up in a long harness run</text>

  <g transform="translate(-200,0)">
  <!-- Right: what fills the window -->
  <text class="ts red" x="430" y="92" text-anchor="middle" dominant-baseline="central">context limit</text>
  <rect class="frame" x="350" y="104" width="160" height="366"/>
  <line x1="350" y1="118" x2="510" y2="118" stroke="#E24B4A" stroke-width="2"/>
  <rect x="360" y="424" width="140" height="36" rx="3" fill="url(#hG)" stroke="#5F5E5A" stroke-width="1"/><text class="th halo" x="430" y="442" text-anchor="middle" dominant-baseline="central">tool schemas</text>
  <rect x="360" y="380" width="140" height="38" rx="3" fill="url(#hA)" stroke="#854F0B" stroke-width="1"/><text class="th halo" x="430" y="399" text-anchor="middle" dominant-baseline="central">result 1</text>
  <rect x="360" y="336" width="140" height="38" rx="3" fill="url(#hA)" stroke="#854F0B" stroke-width="1"/><text class="th halo" x="430" y="355" text-anchor="middle" dominant-baseline="central">result 2</text>
  <rect x="360" y="292" width="140" height="38" rx="3" fill="url(#hA)" stroke="#854F0B" stroke-width="1"/><text class="th halo" x="430" y="311" text-anchor="middle" dominant-baseline="central">result 3</text>
  <rect x="360" y="152" width="140" height="134" rx="3" fill="url(#hR)" stroke="#A32D2D" stroke-width="1"/><text class="th halo" x="430" y="209" text-anchor="middle" dominant-baseline="central">OCR full.pdf</text><text class="th halo" x="430" y="229" text-anchor="middle" dominant-baseline="central">29,694 chars</text>
  <text class="cap" x="430" y="494" text-anchor="middle" dominant-baseline="central">the context window</text>
  <text class="ts" x="430" y="514" text-anchor="middle" dominant-baseline="central">re-sent in full on every call</text>

  </g>

  <g transform="translate(-120,0)">
  <!-- Chart: error rate vs context used -->
  <path class="axis" d="M590 130 L590 440 L920 440"/>
  <text class="ts" x="590" y="116" text-anchor="middle" dominant-baseline="central">error rate</text>
  <text class="ts" x="590" y="456" text-anchor="middle" dominant-baseline="central">0%</text>
  <text class="ts" x="905" y="456" text-anchor="middle" dominant-baseline="central">100%</text>
  <text class="cap" x="755" y="494" text-anchor="middle" dominant-baseline="central">context used</text>
  <line x1="905" y1="130" x2="905" y2="440" stroke="#E24B4A" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="ts red" x="898" y="140" text-anchor="end" dominant-baseline="central">context limit</text>
  <path d="M592 422 C 720 418, 820 380, 900 168" fill="none" stroke="#E24B4A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="872" cy="233" r="5" fill="#A32D2D"/>
  <text class="ts" x="862" y="219" text-anchor="end" dominant-baseline="central">40 turns</text>
  <text class="th red" x="700" y="340" text-anchor="middle" dominant-baseline="central">errors rise as it fills</text>
  </g>
</svg>
