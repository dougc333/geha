<svg xmlns="http://www.w3.org/2000/svg" width="940" height="450" viewBox="0 0 940 450" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>State machine RAG</title>
  <desc>Each member message is turned into slot values by rules or an LLM with a schema. The slot state goes to a router: if information is missing, the bot asks the next question; when a lookup is ready, it reads an exact row from tables parsed from the PDF (rate codes on page 10, premiums on page 11, benefits on page 5) and replies with a template filled with those values. There are no embeddings or similarity search, and the LLM never writes a number.</desc>
  <style>
    .bg { fill: #ffffff; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .teal text { fill: #085041; }
    .coral rect { fill: #FAECE7; stroke: #993C1D; }
    .coral text { fill: #712B13; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .gray text { fill: #444441; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .purple text { fill: #3C3489; }
    .purple .ts2 { font-size: 12px; fill: #534AB7; }
    .amber rect { fill: #FAEEDA; stroke: #854F0B; }
    .amber text { fill: #633806; }
    .blue rect { fill: #E6F1FB; stroke: #185FA5; }
    .blue text { fill: #0C447C; }
    .it { font-size: 12px; font-style: italic; }
    .tq { font-size: 13px; font-weight: 500; }
    .sn { font-size: 12px; }
    .blue polygon { fill: #E6F1FB; stroke: #185FA5; }
    .fig { stroke: #2C2C2A; stroke-width: 1.5; fill: none; stroke-linecap: round; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .arr, .fig { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    .fig { stroke: #2C2C2A; stroke-linecap: round; }
    .group { stroke: #888780; stroke-width: 0.75; fill: none; stroke-dasharray: 4 3; }
    .label { font-size: 24px; font-weight: 700; fill: #2C2C2A; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1e1c; }
      .teal rect { fill: #085041; stroke: #5DCAA5; }
      .teal text { fill: #E1F5EE; }
      .coral rect { fill: #712B13; stroke: #F0997B; }
      .coral text { fill: #FAECE7; }
      .gray rect { fill: #444441; stroke: #B4B2A9; }
      .gray text { fill: #F1EFE8; }
      .purple rect { fill: #3C3489; stroke: #AFA9EC; }
      .purple text { fill: #EEEDFE; }
      .purple .ts2 { fill: #CECBF6; }
      .amber rect { fill: #633806; stroke: #EF9F27; }
      .amber text { fill: #FAEEDA; }
      .blue rect { fill: #0C447C; stroke: #85B7EB; }
      .blue text { fill: #E6F1FB; }
      .blue polygon { fill: #0C447C; stroke: #85B7EB; }
      .fig { stroke: #F1EFE8; }
      .ts { fill: #B4B2A9; }
      .arr { stroke: #B4B2A9; }
      .fig { stroke: #F1EFE8; }
      .label { fill: #F1EFE8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="940" height="450"/>
  <g class="fig"><circle cx="40" cy="104" r="9"/><line x1="40" y1="113" x2="40" y2="140"/><line x1="24" y1="124" x2="56" y2="124"/><line x1="40" y1="140" x2="28" y2="160"/><line x1="40" y1="140" x2="52" y2="160"/></g>
  <g class="gray"><rect x="80" y="118" width="100" height="44" rx="8" stroke-width="0.5"/><text class="th" x="130" y="140" text-anchor="middle" dominant-baseline="central">Message</text></g>
  <path d="M58 140 L76 140" class="arr" marker-end="url(#arrow)"/>
  <g class="purple"><rect x="210" y="112" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="280" y="131" text-anchor="middle" dominant-baseline="central">Extract slots</text><text class="ts" x="280" y="150" text-anchor="middle" dominant-baseline="central">rules or LLM + schema</text></g>
  <path d="M182 140 L206 140" class="arr" marker-end="url(#arrow)"/>
  <g class="gray"><rect x="380" y="88" width="138" height="104" rx="8" stroke-width="0.5"/><text class="th" x="449" y="104" text-anchor="middle" dominant-baseline="central">Slot state</text><text class="ts" x="392" y="126" dominant-baseline="central" style="font-family: ui-monospace, Menlo, monospace">zip = 20500</text><text class="ts" x="392" y="144" dominant-baseline="central" style="font-family: ui-monospace, Menlo, monospace">status = RETIRED</text><text class="ts" x="392" y="162" dominant-baseline="central" style="font-family: ui-monospace, Menlo, monospace">enrollment = ?</text><text class="ts" x="392" y="180" dominant-baseline="central" style="font-family: ui-monospace, Menlo, monospace">plan = ?</text></g>
  <path d="M352 140 L376 140" class="arr" marker-end="url(#arrow)"/>
  <g class="blue"><polygon points="534,140 580,98 626,140 580,182" stroke-width="0.5"/><text class="th" x="580" y="140" text-anchor="middle" dominant-baseline="central">route</text></g>
  <path d="M520 140 L530 140" class="arr" marker-end="url(#arrow)"/>
  <g class="gray"><rect x="650" y="40" width="150" height="44" rx="8" stroke-width="0.5"/><text class="th" x="725" y="62" text-anchor="middle" dominant-baseline="central">Ask next question</text></g>
  <path d="M580 96 L580 62 L646 62" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="574" y="80" text-anchor="end" dominant-baseline="central">missing info</text>
  <g class="teal"><rect x="650" y="112" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="725" y="131" text-anchor="middle" dominant-baseline="central">Structured lookup</text><text class="ts" x="725" y="150" text-anchor="middle" dominant-baseline="central">exact row by key</text></g>
  <path d="M628 140 L646 140" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="646" y="124" text-anchor="end" dominant-baseline="central">ready</text>
  <g class="coral"><rect x="822" y="112" width="112" height="56" rx="8" stroke-width="0.5"/><text class="th" x="878" y="131" text-anchor="middle" dominant-baseline="central">Reply</text><text class="ts" x="878" y="150" text-anchor="middle" dominant-baseline="central">template + values</text></g>
  <path d="M802 140 L818 140" class="arr" marker-end="url(#arrow)"/>
  <path d="M876 110 L876 20 L40 20 L40 90" class="arr" marker-end="url(#arrow)"/>
  <path d="M725 38 L725 20" class="arr"/>
  <text class="ts" x="460" y="10" text-anchor="middle" dominant-baseline="central">reply or next question back to the member</text>
  <g class="gray"><rect x="210" y="276" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="275" y="295" text-anchor="middle" dominant-baseline="central">Benefits guide</text><text class="ts" x="275" y="314" text-anchor="middle" dominant-baseline="central">PDF</text></g>
  <g class="gray"><rect x="380" y="276" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="445" y="295" text-anchor="middle" dominant-baseline="central">Parse tables</text><text class="ts" x="445" y="314" text-anchor="middle" dominant-baseline="central">at start-up</text></g>
  <path d="M342 304 L376 304" class="arr" marker-end="url(#arrow)"/>
  <g class="teal"><rect x="650" y="240" width="150" height="34" rx="8" stroke-width="0.5"/><text class="th" x="725" y="257" text-anchor="middle" dominant-baseline="central">rate codes (page 10)</text></g>
  <path d="M512 304 L646 257" class="arr" marker-end="url(#arrow)"/>
  <g class="teal"><rect x="650" y="284" width="150" height="34" rx="8" stroke-width="0.5"/><text class="th" x="725" y="301" text-anchor="middle" dominant-baseline="central">premiums (page 11)</text></g>
  <path d="M512 304 L646 301" class="arr" marker-end="url(#arrow)"/>
  <g class="teal"><rect x="650" y="328" width="150" height="34" rx="8" stroke-width="0.5"/><text class="th" x="725" y="345" text-anchor="middle" dominant-baseline="central">benefits (page 5)</text></g>
  <path d="M512 304 L646 345" class="arr" marker-end="url(#arrow)"/>
  <path d="M725 238 L725 172" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="733" y="205" text-anchor="start" dominant-baseline="central">read</text>
  <text class="ts" x="470" y="390" text-anchor="middle" dominant-baseline="central">no embeddings or similarity search · the LLM only fills slots, it never writes a number</text>
  <text class="label" x="20" y="432">State machine RAG</text>
</svg>
