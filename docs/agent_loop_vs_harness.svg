<svg xmlns="http://www.w3.org/2000/svg" width="940" height="530" viewBox="0 0 940 530" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Agent Loop vs Harness</title>
  <desc>An agent loop lets the model call tools several times: it asks for a tool call, the tool runs, the result is appended to the context, and the loop repeats. A harness wraps that loop: a context manager trims and compacts the context window, and tool calls are streamed to a sandbox that runs them in isolation and streams output back.</desc>
  <style>
    .bg { fill: #ffffff; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .teal text { fill: #085041; }
    .coral rect { fill: #FAECE7; stroke: #993C1D; }
    .coral text { fill: #712B13; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .gray text { fill: #444441; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .purple text { fill: #3C3489; }
    .purple .ts2 { font-size: 12px; fill: #534AB7; }
    .amber rect { fill: #FAEEDA; stroke: #854F0B; }
    .amber text { fill: #633806; }
    .blue rect { fill: #E6F1FB; stroke: #185FA5; }
    .blue text { fill: #0C447C; }
    .it { font-size: 12px; font-style: italic; }
    .tq { font-size: 13px; font-weight: 500; }
    .sn { font-size: 12px; }
    .mono { font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .arr, .fig { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    .fig { stroke: #2C2C2A; stroke-linecap: round; }
    .group { stroke: #888780; stroke-width: 0.75; fill: none; stroke-dasharray: 4 3; }
    .label { font-size: 24px; font-weight: 700; fill: #2C2C2A; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1e1c; }
      .teal rect { fill: #085041; stroke: #5DCAA5; }
      .teal text { fill: #E1F5EE; }
      .coral rect { fill: #712B13; stroke: #F0997B; }
      .coral text { fill: #FAECE7; }
      .gray rect { fill: #444441; stroke: #B4B2A9; }
      .gray text { fill: #F1EFE8; }
      .purple rect { fill: #3C3489; stroke: #AFA9EC; }
      .purple text { fill: #EEEDFE; }
      .purple .ts2 { fill: #CECBF6; }
      .amber rect { fill: #633806; stroke: #EF9F27; }
      .amber text { fill: #FAEEDA; }
      .blue rect { fill: #0C447C; stroke: #85B7EB; }
      .blue text { fill: #E6F1FB; }
      .ts { fill: #B4B2A9; }
      .arr { stroke: #B4B2A9; }
      .fig { stroke: #F1EFE8; }
      .label { fill: #F1EFE8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="940" height="530"/>
  <text class="label" x="16" y="36">Agent Loop vs Harness</text>

  <!-- Agent loop -->
  <text class="th" x="235" y="76" text-anchor="middle" dominant-baseline="central">Agent loop</text>
  <g class="gray"><rect x="30" y="100" width="110" height="56" rx="8" stroke-width="0.5"/><text class="th" x="85" y="119" text-anchor="middle" dominant-baseline="central">Model</text><text class="ts" x="85" y="138" text-anchor="middle" dominant-baseline="central">LLM</text></g>
  <g class="coral"><rect x="190" y="110" width="110" height="36" rx="8" stroke-width="0.5"/><text class="mono" x="245" y="128" text-anchor="middle" dominant-baseline="central">get_logs(...)</text></g>
  <g class="amber"><rect x="334" y="90" width="114" height="80" rx="8" stroke-width="0.5"/><text class="mono" x="344" y="106" dominant-baseline="central">get_logs</text><text class="mono" x="344" y="130" dominant-baseline="central">get_metrics</text><text class="mono" x="344" y="154" dominant-baseline="central">update_config</text></g>
  <text class="ts" x="390" y="184" text-anchor="middle" dominant-baseline="central">your tools</text>
  <path d="M142 128 L186 128" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="165" y="110" text-anchor="middle" dominant-baseline="central">1. asks</text>
  <path d="M302 128 L330 128" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="320" y="110" text-anchor="middle" dominant-baseline="central">2. run</text>
  <text class="ts" x="135" y="258" text-anchor="middle" dominant-baseline="central">context</text>
  <g class="gray"><rect x="40" y="270" width="190" height="28" rx="4" stroke-width="0.5"/><text class="mono" x="50" y="284" text-anchor="start" dominant-baseline="central">user: why is it slow?</text></g>
  <g class="gray"><rect x="40" y="298" width="190" height="28" rx="4" stroke-width="0.5"/><text class="mono" x="50" y="312" text-anchor="start" dominant-baseline="central">assistant: tool_call</text></g>
  <g class="gray"><rect x="40" y="326" width="190" height="28" rx="4" stroke-width="0.5"/><text class="mono" x="50" y="340" text-anchor="start" dominant-baseline="central">tool: &lt;result&gt;</text></g>
  <path d="M390 198 L390 312 L234 312" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="312" y="300" text-anchor="middle" dominant-baseline="central">3. result appended</text>
  <path d="M100 268 L100 160" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="92" y="214" text-anchor="end" dominant-baseline="central">4. loop</text>
  <g class="gray"><rect x="30" y="380" width="410" height="110" rx="8" stroke-width="0.5"/><text class="mono" x="46" y="400" dominant-baseline="central" xml:space="preserve">while True:</text><text class="mono" x="46" y="420" dominant-baseline="central" xml:space="preserve">    r = model(messages)</text><text class="mono" x="46" y="440" dominant-baseline="central" xml:space="preserve">    if not r.tool_calls: return r.text</text><text class="mono" x="46" y="460" dominant-baseline="central" xml:space="preserve">    out = run(r.tool_calls)</text><text class="mono" x="46" y="480" dominant-baseline="central" xml:space="preserve">    messages += [r, out]</text></g>
  <text class="ts" x="235" y="506" text-anchor="middle" dominant-baseline="central">about 15 lines, fine for 2–3 turns</text>

  <!-- Harness -->
  <text class="th" x="702" y="76" text-anchor="middle" dominant-baseline="central">Harness</text>
  <rect class="group" x="480" y="90" width="444" height="410" rx="12"/>
  <g class="gray"><rect x="622" y="106" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="702" y="125" text-anchor="middle" dominant-baseline="central">Agent loop</text><text class="ts" x="702" y="144" text-anchor="middle" dominant-baseline="central">model ↔ tools</text></g>
  <g class="purple"><rect x="496" y="206" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="571" y="225" text-anchor="middle" dominant-baseline="central">Context manager</text><text class="ts" x="571" y="244" text-anchor="middle" dominant-baseline="central">window budget</text></g>
  <g class="teal"><rect x="758" y="206" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="833" y="225" text-anchor="middle" dominant-baseline="central">Sandbox</text><text class="ts" x="833" y="244" text-anchor="middle" dominant-baseline="central">isolated tool runs</text></g>
  <path d="M662 164 L662 184 L571 184 L571 202" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M742 164 L742 184 L833 184 L833 202" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="ts" x="606" y="174" text-anchor="middle" dominant-baseline="central">trim / compact</text>
  <text class="ts" x="800" y="174" text-anchor="middle" dominant-baseline="central">streaming</text>
  <g class="gray"><rect x="496" y="290" width="150" height="26" rx="4" stroke-width="0.5"/><text class="sn" x="571" y="303" text-anchor="middle" dominant-baseline="central">system + tools</text></g>
  <g class="purple"><rect x="496" y="320" width="150" height="26" rx="4" stroke-width="0.5"/><text class="sn" x="571" y="333" text-anchor="middle" dominant-baseline="central">summary of old turns</text></g>
  <g class="gray"><rect x="496" y="350" width="150" height="26" rx="4" stroke-width="0.5"/><text class="sn" x="571" y="363" text-anchor="middle" dominant-baseline="central">recent turns</text></g>
  <g class="purple"><rect x="496" y="380" width="150" height="26" rx="4" stroke-width="0.5"/><text class="sn" x="571" y="393" text-anchor="middle" dominant-baseline="central">trimmed tool output</text></g>
  <path d="M571 264 L571 286" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="571" y="420" text-anchor="middle" dominant-baseline="central">context window</text>
  <g class="teal"><rect x="758" y="290" width="150" height="26" rx="4" stroke-width="0.5"/><text class="sn" x="833" y="303" text-anchor="middle" dominant-baseline="central">runs tool calls</text></g>
  <g class="teal"><rect x="758" y="320" width="150" height="26" rx="4" stroke-width="0.5"/><text class="sn" x="833" y="333" text-anchor="middle" dominant-baseline="central">streams stdout back</text></g>
  <g class="teal"><rect x="758" y="350" width="150" height="26" rx="4" stroke-width="0.5"/><text class="sn" x="833" y="363" text-anchor="middle" dominant-baseline="central">isolated files / network</text></g>
  <g class="teal"><rect x="758" y="380" width="150" height="26" rx="4" stroke-width="0.5"/><text class="sn" x="833" y="393" text-anchor="middle" dominant-baseline="central">persists across turns</text></g>
  <path d="M833 264 L833 286" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="833" y="420" text-anchor="middle" dominant-baseline="central">sandbox</text>
  <text class="ts" x="702" y="466" text-anchor="middle" dominant-baseline="central">keeps a long-running loop healthy across many turns</text>
</svg>
