<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Large tool results: context or sandbox</title>
  <desc>A tool_call (OCR on full.pdf) returns 29,694 characters. If the result is not bigger than the threshold, all of it goes into the context window and is re-sent on every call for the rest of the run. If it is bigger, the full result is written to the sandbox as tool-results/*.txt instead, and the agent greps sections of it from the context window when needed.</desc>
  <style>
    .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .big { font-size: 28px; font-weight: 700; fill: #2C2C2A; }
    .mono { font-size: 13px; font-family: ui-monospace, Menlo, monospace; fill: #2C2C2A; }
    .red { fill: #A32D2D; }
    .grn { fill: #085041; }
    .amb { fill: #633806; }
    .blu { fill: #0C447C; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .label { font-size: 24px; font-weight: 700; fill: #2C2C2A; }
    .frame { fill: none; stroke: #888780; stroke-width: 1; }
    .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <pattern id="hR" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FCEBEB"/><line x1="0" y1="0" x2="0" y2="8" stroke="#E24B4A" stroke-width="2.5"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
  <text class="label" x="40" y="48">Large tool results: context or sandbox</text>

  <!-- Tool call and its result -->
  <rect x="60" y="150" width="170" height="70" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
  <text class="mono amb" x="145" y="176" text-anchor="middle" dominant-baseline="central">tool_call</text>
  <text class="ts amb" x="145" y="198" text-anchor="middle" dominant-baseline="central">OCR(full.pdf)</text>
  <line x1="232" y1="185" x2="274" y2="185" class="arr" marker-end="url(#arrow)"/>
  <rect x="280" y="140" width="160" height="90" rx="3" fill="url(#hR)" stroke="#A32D2D" stroke-width="1"/>
  <text class="big halo" x="360" y="172" text-anchor="middle" dominant-baseline="central">29,694</text>
  <text class="th halo" x="360" y="204" text-anchor="middle" dominant-baseline="central">characters</text>
  <line x1="360" y1="232" x2="360" y2="266" class="arr" marker-end="url(#arrow)"/>

  <!-- Threshold check -->
  <polygon points="250,330 360,270 470,330 360,390" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
  <text class="th blu" x="360" y="320" text-anchor="middle" dominant-baseline="central">bigger than</text>
  <text class="th blu" x="360" y="340" text-anchor="middle" dominant-baseline="central">the threshold?</text>

  <!-- No: all of it into the context window -->
  <path d="M472 330 L580 330 L580 217 L614 217" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="520" y="318" text-anchor="middle" dominant-baseline="central">no</text>
  <text class="th" x="760" y="96" text-anchor="middle" dominant-baseline="central">context window</text>
  <rect class="frame" x="620" y="110" width="280" height="180"/>
  <rect x="636" y="160" width="248" height="114" rx="3" fill="url(#hR)" stroke="#A32D2D" stroke-width="1"/>
  <text class="th halo" x="760" y="217" text-anchor="middle" dominant-baseline="central">all of it</text>
  <text class="ts red" x="760" y="314" text-anchor="middle" dominant-baseline="central">and it is re-sent on every call</text>
  <text class="ts red" x="760" y="332" text-anchor="middle" dominant-baseline="central">for the rest of the run</text>

  <!-- Yes: full result goes to the sandbox -->
  <path d="M360 392 L360 450 L266 450" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="372" y="420" text-anchor="start" dominant-baseline="central">yes</text>
  <rect x="60" y="410" width="200" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text class="th grn" x="160" y="432" text-anchor="middle" dominant-baseline="central">Sandbox</text>
  <text class="mono grn" x="160" y="454" text-anchor="middle" dominant-baseline="central">tool-results/*.txt</text>
  <text class="ts grn" x="160" y="474" text-anchor="middle" dominant-baseline="central">full 29,694 chars</text>

  <!-- Context window reads sections back from the sandbox -->
  <path d="M870 292 L870 476 L264 476" class="arr" stroke="#0F6E56" marker-end="url(#arrow)"/>
  <text class="mono grn" x="600" y="462" text-anchor="middle" dominant-baseline="central">grep -n "Treanda" tool-results/ocr.txt</text>
  <text class="ts" x="600" y="492" text-anchor="middle" dominant-baseline="central">search sections of the 29,694 chars instead of loading all of it</text>
</svg>
