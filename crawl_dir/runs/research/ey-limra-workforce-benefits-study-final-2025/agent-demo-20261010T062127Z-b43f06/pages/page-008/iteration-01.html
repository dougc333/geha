<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Employers see a need for total wellbeing</title>
<style>
  body {
    font-family: Arial, sans-serif;
    line-height: 1.4;
    margin: 2rem;
    color: #000;
  }
  h1, h2, h3, h4, h5, h6 {
    margin-top: 0;
  }
  .bar-chart {
    max-width: 600px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    margin-bottom: 0.2rem;
  }
  .label {
    flex: 1 0 150px;
    font-size: 0.875rem;
    white-space: nowrap;
  }
  .bar {
    height: 16px;
    margin-right: 0.5rem;
  }
  .bar-green {
    background-color: #2c9c2c;
  }
  .bar-grey {
    background-color: #bcbcbc;
  }
  .bar-red {
    background-color: #d5413e;
  }
  .percent {
    width: 30px;
    text-align: right;
    font-size: 0.875rem;
  }
  .legend {
    border: 1px solid #ccc;
    margin-top: 1rem;
    padding: 0.5rem;
    width: 280px;
    font-size: 0.875rem;
  }
  .legend-item {
    display: flex;
    align-items: center;
    margin-bottom: 0.25rem;
  }
  .color-box {
    width: 16px;
    height: 16px;
    margin-right: 0.5rem;
  }
  .note {
    font-style: italic;
    font-size: 0.875rem;
    margin-top: 1rem;
    max-width: 280px;
  }
</style>
</head>
<body>
<figure>
  <figcaption>
    <p><strong>Figure 4</strong></p>
    <h2>Employers see a need for total wellbeing.</h2>
    <p><strong>QUESTION:</strong> Five years from now, how interested do you think your employees will be in the following types of benefits?</p>
  </figcaption>
  <section class="bar-chart" aria-label="Employer interest in different employee benefits in five years">
    <div class="bar-row">
      <div class="label">Medical insurance</div>
      <div class="bar bar-green" style="width: 89%;"></div>
      <div class="percent">89%</div>
    </div>
    <div class="bar-row">
      <div class="label">Dental insurance</div>
      <div class="bar bar-green" style="width: 79%;"></div>
      <div class="percent">79%</div>
    </div>
    <div class="bar-row">
      <div class="label">Vision insurance</div>
      <div class="bar bar-green" style="width: 74%;"></div>
      <div class="percent">74%</div>
    </div>
    <div class="bar-row">
      <div class="label">Paid family or medical leave</div>
      <div class="bar bar-grey" style="width: 71%;"></div>
      <div class="percent">71%</div>
    </div>
    <div class="bar-row">
      <div class="label">Life insurance</div>
      <div class="bar bar-grey" style="width: 67%;"></div>
      <div class="percent">67%</div>
    </div>
    <div class="bar-row">
      <div class="label">Short-term disability insurance</div>
      <div class="bar bar-grey" style="width: 63%;"></div>
      <div class="percent">63%</div>
    </div>
    <div class="bar-row">
      <div class="label">Mental health/substance abuse treatment benefits</div>
      <div class="bar bar-green" style="width: 60%;"></div>
      <div class="percent">60%</div>
    </div>
    <div class="bar-row">
      <div class="label">Career development</div>
      <div class="bar bar-grey" style="width: 59%;"></div>
      <div class="percent">59%</div>
    </div>
    <div class="bar-row">
      <div class="label">Physical health wellness programs</div>
      <div class="bar bar-grey" style="width: 58%;"></div>
      <div class="percent">58%</div>
    </div>
    <div class="bar-row">
      <div class="label">Long-term disability insurance</div>
      <div class="bar bar-grey" style="width: 58%;"></div>
      <div class="percent">58%</div>
    </div>
    <div class="bar-row">
      <div class="label">Accident insurance</div>
      <div class="bar bar-grey" style="width: 58%;"></div>
      <div class="percent">58%</div>
    </div>
    <div class="bar-row">
      <div class="label">Telemedicine benefits</div>
      <div class="bar bar-grey" style="width: 57%;"></div>
      <div class="percent">57%</div>
    </div>
    <div class="bar-row">
      <div class="label">Long-term care insurance</div>
      <div class="bar bar-red" style="width: 54%;"></div>
      <div class="percent">54%</div>
    </div>
    <div class="bar-row">
      <div class="label">Critical illness insurance</div>
      <div class="bar bar-grey" style="width: 54%;"></div>
      <div class="percent">54%</div>
    </div>
    <div class="bar-row">
      <div class="label">Employee assistance programs</div>
      <div class="bar bar-grey" style="width: 54%;"></div>
      <div class="percent">54%</div>
    </div>
    <div class="bar-row">
      <div class="label">Financial wellness programs</div>
      <div class="bar bar-red" style="width: 54%;"></div>
      <div class="percent">54%</div>
    </div>
    <div class="bar-row">
      <div class="label">Emergency savings benefit</div>
      <div class="bar bar-grey" style="width: 52%;"></div>
      <div class="percent">52%</div>
    </div>
    <div class="bar-row">
      <div class="label">Hospital indemnity insurance</div>
      <div class="bar bar-red" style="width: 45%;"></div>
      <div class="percent">45%</div>
    </div>
    <div class="bar-row">
      <div class="label">Caregiving benefits</div>
      <div class="bar bar-grey" style="width: 45%;"></div>
      <div class="percent">45%</div>
    </div>
    <div class="bar-row">
      <div class="label">Identity theft protection</div>
      <div class="bar bar-red" style="width: 44%;"></div>
      <div class="percent">44%</div>
    </div>
    <div class="bar-row">
      <div class="label">Tuition assistance</div>
      <div class="bar bar-red" style="width: 40%;"></div>
      <div class="percent">40%</div>
    </div>
    <div class="bar-row">
      <div class="label">Debt management counseling</div>
      <div class="bar bar-red" style="width: 38%;"></div>
      <div class="percent">38%</div>
    </div>
    <div class="bar-row">
      <div class="label">Student loan assistance/repayment</div>
      <div class="bar bar-red" style="width: 36%;"></div>
      <div class="percent">36%</div>
    </div>
    <div class="bar-row">
      <div class="label">Legal services plan</div>
      <div class="bar bar-red" style="width: 35%;"></div>
      <div class="percent">35%</div>
    </div>
    <div class="bar-row">
      <div class="label">Societal benefits</div>
      <div class="bar bar-red" style="width: 34%;"></div>
      <div class="percent">34%</div>
    </div>
    <div class="bar-row">
      <div class="label">Pet insurance</div>
      <div class="bar bar-red" style="width: 22%;"></div>
      <div class="percent">22%</div>
    </div>
  </section>
  <aside class="legend" aria-label="Legend for bar chart colors">
    <div class="legend-item">
      <div class="color-box" style="background-color:#2c9c2c;"></div>
      <div>Up 5 percentage points or more vs. 2023 study</div>
    </div>
    <div class="legend-item">
      <div class="color-box" style="background-color:#d5413e;"></div>
      <div>Down 5 percentage points or more vs. 2023 study</div>
    </div>
  </aside>
  <p class="note">Note: Percent of employers that believe their company’s employees will be “very” or “extremely” interested in the benefit in the future.</p>
</figure>
</body>
</html>
