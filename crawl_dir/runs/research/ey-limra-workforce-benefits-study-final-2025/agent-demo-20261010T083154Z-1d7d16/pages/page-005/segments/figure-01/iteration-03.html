<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Work Arrangement Question</title>
</head>
<body>
  <p><strong>trending downward.</strong></p>
  <p><strong>QUESTION:</strong> Instead of (or in addition to) working for a traditional employer (also known as being a W-2 employee), some workers pursue freelance or “gig” work. Which of the following best describes your current work arrangement?</p>

  <figure>
    <svg width="320" height="160" role="img" aria-labelledby="chartTitle chartDesc">
      <title id="chartTitle">Current Work Arrangement Distribution</title>
      <desc id="chartDesc">Bar chart showing three percentages: 66%, 34%, and 77%. Specific work arrangement categories are not provided in the source.</desc>
      <!-- Scale factor for bar heights (max height 150 for 77%) -->
      <!-- bar height = percentage * 150 / 77 -->
      <!-- 66% => 128.57 approx -->
      <!-- 34% => 66.23 approx -->
      <!-- 77% => 150 -->
      <rect x="10" y="31.4" width="80" height="128.6" fill="#78787f"></rect>
      <text x="50" y="120" fill="#fff" font-size="16" text-anchor="middle" dominant-baseline="middle">66%</text>
      <rect x="110" y="83.8" width="80" height="66.2" fill="#fdda0d"></rect>
      <text x="150" y="120" fill="#000" font-size="16" text-anchor="middle" dominant-baseline="middle">34%</text>
      <rect x="210" y="10" width="80" height="150" fill="#78787f"></rect>
      <text x="250" y="75" fill="#fff" font-size="16" text-anchor="middle" dominant-baseline="middle">77%</text>
    </svg>
    <figcaption>Distribution of Work Arrangements (categories not specified)</figcaption>
  </figure>

  <table border="1" summary="Percentage distribution of current work arrangements based on survey question.">
    <thead>
      <tr>
        <th scope="col">Percentage</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>66%</td>
      </tr>
      <tr>
        <td>34%</td>
      </tr>
      <tr>
        <td>77%</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
