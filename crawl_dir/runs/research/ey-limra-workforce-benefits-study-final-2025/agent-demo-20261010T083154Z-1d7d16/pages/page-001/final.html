<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Harnessing growth in workforce benefits: the next horizon</title>
<style>
  body {
    font-family: Arial, sans-serif;
    color: white;
    margin: 0;
    padding: 0;
    background: #3a6545; /* fallback background color */
  }
  .container {
    max-width: 800px;
    padding: 2rem;
  }
  .highlight-box {
    border-style: solid;
    border-width: 6px 6px 6px 6px;
    border-image: linear-gradient(to right, yellow, #95d6e2) 1;
    padding: 1rem 1.5rem;
    max-width: 400px;
    margin-bottom: 1.5rem;
  }
  h1 {
    font-size: 2.25rem;
    font-weight: 700;
    line-height: 1.2;
    margin-top: 0;
    margin-bottom: 0.5rem;
  }
  p.subtitle {
    font-weight: 600;
    font-size: 1rem;
    margin-top: 0;
    margin-bottom: 3rem;
  }
  footer {
    font-size: 0.85rem;
    font-weight: 600;
    margin-top: 4rem;
    max-width: 400px;
  }
  .logos {
    display: flex;
    gap: 3rem;
    align-items: center;
    margin-top: 3rem;
  }
  .logo {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .logo .tagline {
    font-weight: 600;
    font-size: 1rem;
  }
  .ey-logo {
    font-weight: 800;
    font-size: 3rem;
    position: relative;
    color: white;
  }
  .ey-swoosh {
    position: absolute;
    top: -1rem;
    right: -2.5rem;
    width: 40px;
    height: 10px;
    background: linear-gradient(45deg, #ffd700, #ffc800);
    clip-path: polygon(0 100%, 100% 0, 100% 100%);
  }
  .limra-logo {
    font-weight: 800;
    font-size: 2rem;
    color: white;
    position: relative;
  }
  .limra-logo span {
    font-weight: 800;
  }
  .limra-logo .globe {
    color: #2c9ab7;
    font-style: normal;
  }
  .limra-tagline {
    font-style: italic;
    font-weight: 600;
    color: white;
  }
</style>
</head>
<body>
<main class="container" lang="en">
  <section class="highlight-box" aria-label="Report title and subtitle">
    <h1>Harnessing growth in workforce benefits: the next horizon</h1>
    <p class="subtitle">2025 Workforce Benefits Study</p>
  </section>

  <footer role="contentinfo">
    <p>The better the question. The better the answer.<br />The better the world works.</p>
  </footer>

  <section class="logos" aria-label="Logos and taglines">
    <div class="logo limra-logo" aria-label="LIMRA logo and tagline">
      <span>LIMRA</span><span class="globe" aria-hidden="true">🌐</span><br />
      <p class="limra-tagline">Navigate With Confidence</p>
    </div>

    <div class="logo ey-logo" aria-label="EY logo and tagline">
      <div>EY<span class="ey-swoosh" aria-hidden="true"></span></div>
      <p class="tagline">Shape the future<br />with confidence</p>
    </div>
  </section>
</main>
</body>
</html>
