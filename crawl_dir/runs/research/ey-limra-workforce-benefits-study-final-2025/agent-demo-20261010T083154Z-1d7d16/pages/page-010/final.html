<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Employee interest in benefits varies across generations | 2025 Workforce Benefits Study</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    line-height: 1.5;
    color: #1c1c1c;
  }
  header {
    width: 100%;
    max-height: 320px;
    overflow: hidden;
  }
  header img {
    width: 100%;
    height: auto;
    display: block;
  }
  main {
    max-width: 720px;
    margin: 2rem auto 4rem auto;
    padding: 0 16px;
  }
  h2 {
    font-weight: 700;
    font-size: 1.5rem;
    margin: 0.25rem 0 1rem 0;
  }
  strong {
    font-weight: 700;
  }
  p {
    margin: 0 0 1.5rem 0;
    font-size: 1rem;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-family: Arial, sans-serif;
    font-size: 0.9rem;
  }
  caption {
    caption-side: top;
    font-weight: 900;
    font-size: 1.2rem;
    margin-bottom: 0.75rem;
    text-align: left;
  }
  thead th {
    background-color: #f9f9f9;
    font-weight: 700;
    border: 1px solid #ccc;
    padding: 8px 10px;
  }
  tbody th {
    border: 1px solid #ccc;
    padding: 6px 10px;
    text-align: left;
    font-weight: 600;
    white-space: nowrap;
  }
  tbody td {
    border: 1px solid #ccc;
    padding: 6px 10px;
    text-align: center;
  }
  /* Heatmap coloring for data cells */
  .heat-least {background-color: #f9d1d3;} /* Light red */
  .heat-mid-low {background-color: #fceae8;} /* Very light red */
  .heat-mid {background-color: #f0faf0;} /* Very light greenish */
  .heat-mid-high {background-color: #d4ebd3;} /* Light green */
  .heat-high {background-color: #a7d69d;} /* Medium green */
  .heat-very-high {background-color: #6ab665;} /* Dark green */

  .legend-container {
    display: flex;
    align-items: center;
    max-width: 720px;
    margin-top: 2rem;
    font-family: Arial, sans-serif;
    font-size: 0.85rem;
  }
  .legend-label {
    margin: 0 10px;
  }
  .legend-bar {
    flex-grow: 1;
    height: 16px;
    background: linear-gradient(to right, #d94f52, #f6e5e4, #d4ebd3, #6ab665);
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .notes {
    max-width: 720px;
    margin-top: 1rem;
    font-family: Arial, sans-serif;
    font-size: 0.9rem;
    font-style: italic;
  }
  footer {
    max-width: 720px;
    margin: 3rem auto 2rem auto;
    font-family: Arial, sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    color: #222;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
<header>
  <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD..." alt="People working in an office place with plants around" />
</header>
<main>
  <figure>
    <figcaption>
      <p><strong>Figure 6</strong></p>
      <h2>Employee interest in benefits varies across generations.</h2>
      <p><strong>QUESTION:</strong> Regardless of whether the benefit is currently available to you at work, how interested would you be in having your employer offer it in the future?</p>
    </figcaption>

    <table summary="Percent of employees who are very or extremely interested in future employer offering of these benefits, by generation segments, shown with heat map colors from least to most interest.">
      <caption>Employee Interest in Future Employer Offering of Benefits (Percent Very or Extremely Interested)</caption>
      <thead>
        <tr>
          <th>Benefit</th>
          <th>Gen Z</th>
          <th>Millennials</th>
          <th>Gen X</th>
          <th>Baby Boomers</th>
        </tr>
      </thead>
      <tbody>
        <tr><th scope="row">Medical insurance</th><td class="heat-high">67%</td><td class="heat-very-high">75%</td><td class="heat-very-high">86%</td><td class="heat-high">80%</td></tr>
        <tr><th scope="row">Dental insurance</th><td class="heat-mid-high">61%</td><td class="heat-high">72%</td><td class="heat-very-high">76%</td><td class="heat-high">74%</td></tr>
        <tr><th scope="row">Vision insurance</th><td class="heat-mid">50%</td><td class="heat-mid-high">61%</td><td class="heat-high">69%</td><td class="heat-mid-high">63%</td></tr>
        <tr><th scope="row">Paid family or medical leave</th><td class="heat-mid-high">54%</td><td class="heat-mid-high">57%</td><td class="heat-mid-high">54%</td><td class="heat-mid-low">43%</td></tr>
        <tr><th scope="row">Life insurance</th><td class="heat-mid">48%</td><td class="heat-mid">52%</td><td class="heat-mid-high">53%</td><td class="heat-mid-low">40%</td></tr>
        <tr><th scope="row">Career development</th><td class="heat-mid">40%</td><td class="heat-mid-high">46%</td><td class="heat-mid-low">37%</td><td class="heat-least">25%</td></tr>
        <tr><th scope="row">Physical health wellness programs</th><td class="heat-least">39%</td><td class="heat-least">39%</td><td class="heat-mid-low">34%</td><td class="heat-mid-low">32%</td></tr>
        <tr><th scope="row">Short-term disability insurance</th><td class="heat-least">24%</td><td class="heat-mid-low">35%</td><td class="heat-mid-high">41%</td><td class="heat-mid-high">37%</td></tr>
        <tr><th scope="row">Long-term disability insurance</th><td class="heat-least">22%</td><td class="heat-mid-low">35%</td><td class="heat-mid-high">40%</td><td class="heat-mid-high">41%</td></tr>
        <tr><th scope="row">Long-term care insurance</th><td class="heat-mid-low">30%</td><td class="heat-mid-low">31%</td><td class="heat-mid">36%</td><td class="heat-mid-high">42%</td></tr>
        <tr><th scope="row">Accident insurance</th><td class="heat-mid-low">39%</td><td class="heat-mid-low">34%</td><td class="heat-mid-low">33%</td><td class="heat-mid-low">32%</td></tr>
        <tr><th scope="row">Critical illness insurance</th><td class="heat-mid-low">29%</td><td class="heat-mid-low">33%</td><td class="heat-mid-low">34%</td><td class="heat-mid-low">33%</td></tr>
        <tr><th scope="row">Emergency savings benefit</th><td class="heat-mid-high">41%</td><td class="heat-mid-low">34%</td><td class="heat-least">30%</td><td class="heat-least">18%</td></tr>
        <tr><th scope="row">Identity theft protection</th><td class="heat-mid-low">37%</td><td class="heat-mid-low">31%</td><td class="heat-least">27%</td><td class="heat-mid-low">32%</td></tr>
        <tr><th scope="row">Mental health or substance abuse treatment benefits</th><td class="heat-mid-high">45%</td><td class="heat-mid-low">33%</td><td class="heat-least">24%</td><td class="heat-least">19%</td></tr>
        <tr><th scope="row">Employee assistance programs</th><td class="heat-least">28%</td><td class="heat-mid-low">36%</td><td class="heat-least">28%</td><td class="heat-least">19%</td></tr>
        <tr><th scope="row">Financial wellness programs</th><td class="heat-mid-low">36%</td><td class="heat-mid-low">33%</td><td class="heat-least">26%</td><td class="heat-least">17%</td></tr>
        <tr><th scope="row">Telemedicine benefits</th><td class="heat-mid-low">31%</td><td class="heat-least">29%</td><td class="heat-least">30%</td><td class="heat-least">20%</td></tr>
        <tr><th scope="row">Tuition assistance</th><td class="heat-mid">40%</td><td class="heat-mid-low">32%</td><td class="heat-least">24%</td><td class="heat-least">11%</td></tr>
        <tr><th scope="row">Student loan assistance/repayment</th><td class="heat-mid-high">41%</td><td class="heat-mid-low">32%</td><td class="heat-least">19%</td><td class="heat-least">7%</td></tr>
        <tr><th scope="row">Hospital indemnity insurance</th><td class="heat-mid-low">30%</td><td class="heat-least">24%</td><td class="heat-least">27%</td><td class="heat-least">24%</td></tr>
        <tr><th scope="row">Caregiving benefits</th><td class="heat-mid-low">30%</td><td class="heat-least">27%</td><td class="heat-least">20%</td><td class="heat-least">22%</td></tr>
        <tr><th scope="row">Legal services plan</th><td class="heat-least">24%</td><td class="heat-least">26%</td><td class="heat-least">21%</td><td class="heat-least">19%</td></tr>
        <tr><th scope="row">Debt management counseling</th><td class="heat-mid-low">34%</td><td class="heat-least">24%</td><td class="heat-least">17%</td><td class="heat-least">9%</td></tr>
        <tr><th scope="row">Pet insurance</th><td class="heat-least">23%</td><td class="heat-least">19%</td><td class="heat-least">12%</td><td class="heat-least">9%</td></tr>
        <tr><th scope="row">Societal benefits</th><td class="heat-least">22%</td><td class="heat-least">15%</td><td class="heat-least">9%</td><td class="heat-least">4%</td></tr>
      </tbody>
    </table>
  </figure>

  <div class="legend-container" aria-label="Heat map legend">
    <strong>Heat map:</strong>
    <span class="legend-label">Least interest</span>
    <div class="legend-bar" aria-hidden="true"></div>
    <span class="legend-label">Most interest</span>
  </div>

  <section class="notes" aria-label="Note about data">
    <p>Note: Percent of employees who are “very” or “extremely” interested in having their employer offer the benefit in the future.</p>
  </section>
</main>
