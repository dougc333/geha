<h1>The LIMRA-EY Wheel of Wellness</h1>
<p>Focused on five key dimensions of health, the LIMRA-EY Wheel of Wellness can help organizations build a happier, healthier, more productive and financially secure workforce.</p>

<figcaption>The LIMRA-EY Wheel of Wellness: a circular diagram divided into five segments, encircled by a yellow clockwise arrow. Each segment carries a label over a faded photograph.</figcaption>

<li>Financial</li>
<li>Societal</li>
<li>Professional</li>
<li>Physical</li>
</ol>

</thead>

<tr><td>1 (top right)</td><td>Mental</td></tr>
