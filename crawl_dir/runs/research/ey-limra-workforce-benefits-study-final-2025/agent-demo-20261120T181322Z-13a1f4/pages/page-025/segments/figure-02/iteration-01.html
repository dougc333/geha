<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Majority of brokers believe AI will drive disruption, but in targeted areas</title>
</head>
<body>
<figure>
<h1>Majority of brokers believe AI will drive disruption, but in targeted areas</h1>

<ol>
<li>Sales and distribution</li>
<li>Underwriting</li>
<li>Implementation</li>
<li>Enrollment</li>
<li>Eligibility</li>
<li>Service</li>
<li>Billing and payments</li>
<li>Claims</li>
</ol>

<p>Legend: <strong>None/less relevant</strong> (icon with a mostly empty circle); <strong>Highly relevant</strong> (fully filled circle).</p>

<table>
<caption>Relevance of AI disruption by area, shown as the fill level of each circle icon (no numeric values are printed in the graphic)</caption>
<thead>
<tr><th scope="col">Area</th><th scope="col">Icon fill shown</th></tr>
</thead>
<tbody>
<tr><th scope="row">Sales and distribution</th><td>One quarter filled (top-right quadrant), outlined circle</td></tr>
<tr><th scope="row">Underwriting</th><td>Three quarters filled (bottom-right quadrant empty)</td></tr>
<tr><th scope="row">Implementation</th><td>One quarter filled (top-right quadrant), outlined circle</td></tr>
<tr><th scope="row">Enrollment</th><td>Fully filled circle (Highly relevant)</td></tr>
<tr><th scope="row">Eligibility</th><td>One quarter filled (top-right quadrant), outlined circle</td></tr>
<tr><th scope="row">Service</th><td>Half filled (left half filled, right half empty)</td></tr>
<tr><th scope="row">Billing and payments</th><td>One quarter filled (top-right quadrant), outlined circle</td></tr>
<tr><th scope="row">Claims</th><td>Three quarters filled (bottom-right quadrant empty)</td></tr>
</tbody>
</table>
