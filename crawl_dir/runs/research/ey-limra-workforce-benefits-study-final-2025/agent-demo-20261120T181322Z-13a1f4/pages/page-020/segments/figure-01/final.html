<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What matters to employers when selecting an outsourcing provider</title>
<style>
body{margin:0;background:#2b2d33;color:#fff;font-family:Arial,Helvetica,sans-serif}
figure{margin:0;padding:32px 24px;max-width:1530px}
h1{text-align:center;font-size:2rem;margin:0 0 48px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;text-align:center}
.stat strong{display:block;color:#ffe600;font-size:5rem;line-height:1}
.stat p{margin:8px 0 24px;font-size:1.4rem}
table{margin:32px auto;border-collapse:collapse}
th,td{border:1px solid #888;padding:6px 12px;text-align:left}
</style>
</head>
<body>
<main>
<figure>
<h1>What matters to employers when selecting an outsourcing provider</h1>
<div class="grid">
<div class="stat"><strong>38%</strong><p>Supports compliance and regulatory changes</p></div>
<div class="stat"><strong>38%</strong><p>Integrates with current HR systems</p></div>
<div class="stat"><strong>37%</strong><p>Issues payments directly to employees</p></div>
<div class="stat"><strong>35%</strong><p>Offers employees multichannel communications</p></div>
<div class="stat"><strong>35%</strong><p>Coordinates different leaves and benefits and tracks intermittent leaves</p></div>

</div>
<table>

<thead><tr><th scope="col">Factor</th><th scope="col">Share</th></tr></thead>
<tbody>
<tr><th scope="row">Supports compliance and regulatory changes</th><td>38%</td></tr>
<tr><th scope="row">Integrates with current HR systems</th><td>38%</td></tr>

<tr><th scope="row">Offers employees multichannel communications</th><td>35%</td></tr>

<tr><th scope="row">Offers an integrated single portal</th><td>31%</td></tr>

</table>
</figure>
</main>
