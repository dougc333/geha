<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Figure 2: Worker participation in the gig economy is trending downward.</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #f6f5f9; color: #2e2e38; margin: 0; padding: 16px; }
  figure { margin: 0; max-width: 1000px; }
  .fig-label { margin: 0 0 4px; font-weight: bold; font-size: 14px; }
  h1 { font-size: 26px; line-height: 1.15; margin: 0 0 14px; max-width: 520px; }
  .question { font-size: 16px; line-height: 1.3; margin: 0 0 24px; max-width: 540px; }
  .content { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
  .chart { width: 580px; max-width: 100%; }
  .chart svg { display: block; width: 100%; height: auto; }
  .legend { list-style: none; margin: 12px 0 0; padding: 12px 16px; border: 1px solid #c9c8d0; display: flex; flex-wrap: wrap; gap: 12px 40px; font-size: 14px; }
  .legend li { display: flex; align-items: center; gap: 8px; }
  .swatch { display: inline-block; width: 12px; height: 12px; }
  .swatch.gray { background: #747480; }
  .swatch.yellow { background: #ffe600; }
  table { border-collapse: collapse; font-size: 14px; background: #fff; }
  caption { text-align: left; font-weight: bold; padding-bottom: 6px; }
  th, td { border: 1px solid #c9c8d0; padding: 6px 10px; text-align: left; }
  thead th { background: #e8e7ee; }
</style>
</head>
<body>
<figure>
<p class="fig-label">Figure 2</p>
<h1>Worker participation in the gig economy is trending downward.</h1>
<p class="question"><strong>QUESTION:</strong> Instead of (or in addition to) working for a traditional employer (also known as being a W-2 employee), some workers pursue freelance or “gig” work. Which of the following best describes your current work arrangement?</p>

<div class="content">
<div class="chart">
<svg viewBox="0 0 580 366" role="img" aria-label="Stacked bar chart with two bars, 2023 and 2025. 2023: 66% do not freelance or have a gig job(s), 34% freelance (full or part time). 2025: 77% do not freelance or have a gig job(s), 23% freelance (full or part time).">
  <!-- 2023 bar -->
  <rect x="16" y="8" width="210" height="212" fill="#747480"></rect>
  <rect x="16" y="220" width="210" height="110" fill="#ffe600"></rect>
  <!-- 2025 bar -->
  <rect x="350" y="8" width="208" height="249" fill="#747480"></rect>
  <rect x="350" y="257" width="208" height="73" fill="#ffe600"></rect>
  <!-- connector -->
  <line x1="226" y1="220" x2="350" y2="257" stroke="#747480" stroke-width="1"></line>
  <!-- baseline -->
  <line x1="0" y1="330.5" x2="580" y2="330.5" stroke="#747480" stroke-width="1"></line>
  <!-- values -->
  <text x="121" y="121" text-anchor="middle" font-size="15" fill="#ffffff" font-family="Arial, Helvetica, sans-serif">66%</text>
  <text x="454" y="140" text-anchor="middle" font-size="15" fill="#ffffff" font-family="Arial, Helvetica, sans-serif">77%</text>
  <text x="121" y="281" text-anchor="middle" font-size="15" fill="#2e2e38" font-family="Arial, Helvetica, sans-serif">34%</text>
  <text x="454" y="300" text-anchor="middle" font-size="15" fill="#2e2e38" font-family="Arial, Helvetica, sans-serif">23%</text>
  <!-- categories -->
  <text x="121" y="361" text-anchor="middle" font-size="16" fill="#2e2e38" font-family="Arial, Helvetica, sans-serif">2023</text>
  <text x="454" y="361" text-anchor="middle" font-size="16" fill="#2e2e38" font-family="Arial, Helvetica, sans-serif">2025</text>
</svg>
<ul class="legend" aria-label="Legend">
<li><span class="swatch gray"></span>Do not freelance or have a gig job(s)</li>
<li><span class="swatch yellow"></span>Freelance (full or part time)</li>
</ul>
</div>

<table>
<caption>Worker participation in the gig economy</caption>
<thead>
<tr>
<th scope="col">Year</th>
<th scope="col">Do not freelance or have a gig job(s)</th>
<th scope="col">Freelance (full or part time)</th>
</tr>
</thead>
<tbody>
<tr>
<th scope="row">2023</th>
<td>66%</td>
<td>34%</td>
</tr>
<tr>
<th scope="row">2025</th>
<td>77%</td>
<td>23%</td>
</tr>
</tbody>
</table>
</div>
</figure>
</body>
</html>
