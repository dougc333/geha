<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Importance of digital experience matching other companies</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; color: #2e2e38; margin: 16px; }
  figure { margin: 0; max-width: 560px; }
  figcaption p { font-size: 18px; line-height: 1.25; margin: 0 0 10px; }
  hr { border: 0; border-top: 1px solid #747480; margin: 0 0 18px; }
  .legend { border: 1px solid #c8c8d0; padding: 10px 14px; margin: 0 0 18px; list-style: none; }
  .legend li { display: flex; align-items: center; font-size: 16px; margin: 4px 0; }
  .sw { display: inline-block; width: 11px; height: 11px; margin-right: 10px; flex: none; }
  .gray { background: #c8c8d0; }
  .yellow { background: #ffe600; }
  .dark { background: #747480; }
  svg { display: block; margin: 0 0 18px 0; max-width: 100%; height: auto; }
  table { border-collapse: collapse; font-size: 14px; }
  th, td { border: 1px solid #c8c8d0; padding: 4px 10px; text-align: left; }
  caption { text-align: left; font-weight: bold; padding-bottom: 4px; }
  td .sw, th .sw { vertical-align: middle; }
</style>
</head>
<body>
<main>
<figure>
<figcaption>
<p><strong>QUESTION:</strong> How important is it for the digital experience you have with administering your company’s insurance benefits to match your experience with other companies?</p>
</figcaption>
<hr>
<ul class="legend" aria-label="Legend">
<li><span class="sw gray"></span>Not at all/not very important</li>
<li><span class="sw yellow"></span>Slightly/somewhat/moderately important</li>
<li><span class="sw dark"></span>Very/extremely important</li>
</ul>
<svg width="340" height="340" viewBox="0 0 340 340" role="img" aria-label="Pie chart: 3% Not at all/not very important, 39% Slightly/somewhat/moderately important, 58% Very/extremely important">
<path d="M170,170 L170,10 A160,160 0 0 1 199.98,12.83 Z" fill="#c8c8d0"></path>
<path d="M170,170 L199.98,12.83 A160,160 0 0 1 247.08,310.21 Z" fill="#ffe600"></path>
<path d="M170,170 L247.08,310.21 A160,160 0 1 1 170,10 Z" fill="#747480"></path>
<text x="183" y="46" text-anchor="middle" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#2e2e38">3%</text>
<text x="269" y="159" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#2e2e38">39%</text>
<text x="73" y="200" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#ffffff">58%</text>
</svg>
<table>
<caption>Pie chart data: importance of digital experience matching other companies</caption>
<thead>
<tr><th scope="col">Response category</th><th scope="col">Share</th></tr>
</thead>
<tbody>
<tr><th scope="row"><span class="sw gray"></span>Not at all/not very important</th><td>3%</td></tr>
<tr><th scope="row"><span class="sw yellow"></span>Slightly/somewhat/moderately important</th><td>39%</td></tr>
<tr><th scope="row"><span class="sw dark"></span>Very/extremely important</th><td>58%</td></tr>
</tbody>
</table>
</figure>
</main>
</body>
</html>
