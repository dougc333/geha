<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Digital experience with administering insurance benefits</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 16px; color: #222; }
  figure { margin: 0; max-width: 680px; }
  figcaption { font-size: 20px; line-height: 1.25; padding-bottom: 14px; border-bottom: 1px solid #555; margin-bottom: 8px; }
  svg { display: block; width: 100%; height: auto; max-width: 667px; }
  table { border-collapse: collapse; margin-top: 16px; font-size: 15px; }
  caption { text-align: left; font-weight: bold; padding-bottom: 4px; }
  th, td { border: 1px solid #bbb; padding: 4px 10px; text-align: left; }
</style>
</head>
<body>
<main>
<figure>
<figcaption>
<strong>QUESTION:</strong> How does the digital experience with administering your company’s insurance benefits compare to your experience with other companies?
</figcaption>
<svg viewBox="0 120 667 490" role="img" aria-label="Pie chart: Worse 6% light gray, About the same 28% yellow, Better 66% dark gray." font-family="Arial, Helvetica, sans-serif">
  <rect x="3" y="125" width="417" height="68" fill="#ffffff" stroke="#c8c8c8" stroke-width="2"/>
  <rect x="28" y="153" width="14" height="14" fill="#c6c6cd"/>
  <text x="46" y="167" font-size="21" fill="#333">Worse</text>
  <rect x="131" y="153" width="14" height="14" fill="#ffe600"/>
  <text x="149" y="167" font-size="21" fill="#333">About the same</text>
  <rect x="326" y="153" width="14" height="14" fill="#747480"/>
  <text x="343" y="167" font-size="21" fill="#333">Better</text>

  <path d="M333,440 L333,278 A162,162 0 0 1 392.6,289.4 Z" fill="#c6c6cd"/>
  <path d="M333,440 L392.6,289.4 A162,162 0 0 1 469.6,527 Z" fill="#ffe600"/>
  <path d="M333,440 L469.6,527 A162,162 0 1 1 333,278 Z" fill="#747480"/>

  <text x="358" y="310" font-size="21" text-anchor="middle" fill="#222">6%</text>
  <text x="456" y="409" font-size="21" text-anchor="middle" fill="#222">28%</text>
  <text x="222" y="508" font-size="21" text-anchor="middle" fill="#ffffff">66%</text>
</svg>
<table>
<caption>Digital experience compared with other companies</caption>
<thead>
<tr><th scope="col">Response</th><th scope="col">Share</th></tr>
</thead>
<tbody>
<tr><th scope="row">Worse</th><td>6%</td></tr>
<tr><th scope="row">About the same</th><td>28%</td></tr>
<tr><th scope="row">Better</th><td>66%</td></tr>
</tbody>
</table>
</figure>
</main>
</body>
</html>
