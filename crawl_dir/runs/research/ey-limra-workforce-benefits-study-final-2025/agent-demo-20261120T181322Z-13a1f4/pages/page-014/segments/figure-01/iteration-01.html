<figure>
<p class="fig">Figure 8</p>
<h1>Employers choose brokers based on quality service, enhanced strategies and access to benefits.</h1>
<p><strong>QUESTION:</strong> What are the most important factors your company considers when choosing a broker/benefits advisor to work with for insurance benefits?</p>

<div role="img" aria-label="Horizontal bar chart of factors employers consider when choosing a broker">
<div class="bar"><span class="label">Quality of service</span><span class="track"><span class="fill" style="width:45%"></span><span class="val">45%</span></span></div>
<div class="bar"><span class="label">Can provide all the insurance benefits my company needs</span><span class="track"><span class="fill" style="width:39%"></span><span class="val">39%</span></span></div>
<div class="bar"><span class="label">Helps our company evaluate/enhance its benefits strategy</span><span class="track"><span class="fill" style="width:35%"></span><span class="val">35%</span></span></div>
<div class="bar"><span class="label">Reputation or experience</span><span class="track"><span class="fill" style="width:31%"></span><span class="val">31%</span></span></div>
<div class="bar"><span class="label">Helps communicate benefits options to employees/provides education</span><span class="track"><span class="fill" style="width:30%"></span><span class="val">30%</span></span></div>
<div class="bar"><span class="label">Range of products/services supported</span><span class="track"><span class="fill" style="width:27%"></span><span class="val">27%</span></span></div>
<div class="bar"><span class="label">Provides recommendations and guidance on benefits technology</span><span class="track"><span class="fill" style="width:22%"></span><span class="val">22%</span></span></div>
<div class="bar"><span class="label">Helps our company understand/address legal and regulatory issues</span><span class="track"><span class="fill" style="width:20%"></span><span class="val">20%</span></span></div>
<div class="bar"><span class="label">Familiarity with our company</span><span class="track"><span class="fill" style="width:15%"></span><span class="val">15%</span></span></div>
<div class="bar"><span class="label">Carriers represented</span><span class="track"><span class="fill" style="width:14%"></span><span class="val">14%</span></span></div>
<div class="bar"><span class="label">Has access to a team of specialists to address more complex needs</span><span class="track"><span class="fill" style="width:12%"></span><span class="val">12%</span></span></div>
<div class="bar"><span class="label">Able to provide benefits technology</span><span class="track"><span class="fill" style="width:8%"></span><span class="val">8%</span></span></div>
<div class="bar"><span class="label">Other</span><span class="track"><span class="fill" style="width:1%"></span><span class="val">1%</span></span></div>
</div>
