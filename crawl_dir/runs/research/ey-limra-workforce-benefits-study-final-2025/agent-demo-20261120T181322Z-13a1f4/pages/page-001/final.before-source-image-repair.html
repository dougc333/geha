<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harnessing growth in workforce benefits: the next horizon</title>
<style>
  html, body { margin: 0; padding: 0; background: #1f2f1b; }
  body { font-family: Arial, Helvetica, sans-serif; color: #fff; }
  .page {
    position: relative; width: 765px; height: 990px; overflow: hidden; margin: 0 auto;
    background:
      radial-gradient(ellipse 200px 260px at 80% 20%, rgba(190,220,150,.55), rgba(190,220,150,0) 70%),
      radial-gradient(ellipse 260px 300px at 20% 60%, rgba(150,190,110,.6), rgba(150,190,110,0) 70%),
      radial-gradient(ellipse 220px 240px at 55% 35%, rgba(170,205,130,.5), rgba(170,205,130,0) 70%),
      radial-gradient(ellipse 300px 200px at 30% 15%, rgba(120,160,90,.6), rgba(120,160,90,0) 70%),
      linear-gradient(180deg, #7fa05e 0%, #5d8044 50%, #3f5c32 100%);
  }
  .photo-art { position: absolute; left: 0; top: 0; width: 765px; height: 990px; }
  .hair { position: absolute; left: 520px; top: 285px; width: 170px; height: 380px; background: #2a1b17; border-radius: 85px 85px 60px 60px; }
  .face { position: absolute; left: 530px; top: 310px; width: 70px; height: 125px; background: #e3b793; border-radius: 35px 35px 40px 40px; }
  .top { position: absolute; left: 540px; top: 490px; width: 100px; height: 170px; background: #efe9e0; border-radius: 30px; }
  .jacket { position: absolute; left: 430px; top: 520px; width: 330px; height: 330px; background: #121c2e; border-radius: 120px 120px 0 0; opacity: .95; }
  .skirt { position: absolute; left: 400px; top: 830px; width: 320px; height: 160px; background: #7a6552; border-radius: 120px 120px 0 0; }
  .laptop { position: absolute; left: 328px; top: 650px; width: 270px; height: 185px; background: #b9bbbc; border-radius: 6px; transform: skewY(-3deg) skewX(-4deg); }
  .phone { position: absolute; left: 244px; top: 962px; width: 100px; height: 14px; background: #5a6264; border-radius: 4px; transform: rotate(-4deg); }
  .bench { position: absolute; left: 0; top: 952px; width: 765px; height: 38px; background: #7f958b; opacity: .8; z-index: 0; }
  .frame-a, .frame-b { position: absolute; left: 39px; top: 39px; width: 395px; height: 399px; }
  .frame-a {
    background: linear-gradient(90deg, #ffe600 0%, #ffe600 6%, #a6d63a 40%, #5cc6e0 100%);
    clip-path: polygon(0 69px, 395px 0, 388px 8.2px, 7px 74.8px, 7px 399px, 0 399px);
  }
  .frame-b {
    background: linear-gradient(180deg, #5cc6e0 0%, #9fd86a 35%, #ffe600 85%);
    clip-path: polygon(388px 0, 395px 0, 395px 399px, 52px 399px, 52px 392px, 388px 392px);
  }
  .dots { position: absolute; display: flex; gap: 10px; }
  .dots i { display: block; width: 8px; height: 8px; background: #ffe600; }
  .dots.frame-dots { left: 39px; top: 429px; }
  .dots.tag-dots { left: 39px; top: 911px; }
  h1 { position: absolute; left: 75px; top: 150px; width: 340px; margin: 0; font-size: 33px; line-height: 42px; font-weight: bold; }
  .subtitle { position: absolute; left: 74px; top: 374px; margin: 0; font-size: 16px; font-weight: bold; white-space: nowrap; }
  .tagline { position: absolute; left: 39px; top: 925px; margin: 0; font-size: 11.5px; line-height: 15px; white-space: nowrap; }
  .limra { position: absolute; left: 407px; top: 884px; width: 175px; }
  .limra .mark { display: block; font-size: 40px; line-height: 40px; font-weight: 900; letter-spacing: -1px; }
  .limra .sub { display: block; margin-top: 2px; font-style: italic; font-size: 14.5px; white-space: nowrap; }
  .ey { position: absolute; left: 610px; top: 828px; width: 125px; }
  .ey .swoosh { position: absolute; left: 26px; top: 0; width: 76px; height: 30px; background: #ffe600; clip-path: polygon(0 100%, 100% 0, 100% 16%, 0 100%); }
  .ey .mark { position: absolute; left: 26px; top: 38px; font-size: 44px; line-height: 44px; font-weight: 900; }
  .ey .sub { position: absolute; left: 0; top: 92px; font-size: 13.5px; line-height: 17px; font-weight: bold; white-space: nowrap; }
</style>
</head>
<body>
<article class="page">
  <div class="photo-art" role="img" aria-label="Woman with long dark hair seated outdoors, looking aside and holding a laptop on her lap, surrounded by lush green foliage">
    <div class="bench"></div>
    <div class="skirt"></div>
    <div class="jacket"></div>
    <div class="top"></div>
    <div class="hair"></div>
    <div class="face"></div>
    <div class="laptop"></div>
    <div class="phone"></div>
  </div>

  <div class="frame-a" aria-hidden="true"></div>
  <div class="frame-b" aria-hidden="true"></div>
  <div class="dots frame-dots" aria-hidden="true"><i></i><i></i><i></i></div>

  <h1>Harnessing growth in workforce benefits: the next horizon</h1>
  <p class="subtitle">2025 Workforce Benefits Study</p>

  <div class="dots tag-dots" aria-hidden="true"><i></i><i></i><i></i></div>
  <p class="tagline">The better the question. The better the answer.<br>The better the world works.</p>

  <div class="limra" role="img" aria-label="LIMRA logo: Navigate With Confidence">
    <span class="mark">LIMRA</span>
    <span class="sub">Navigate With Confidence</span>
  </div>

  <div class="ey" role="img" aria-label="EY logo with yellow swoosh: Shape the future with confidence">
    <span class="swoosh"></span>
    <span class="mark">EY</span>
    <span class="sub">Shape the future<br>with confidence</span>
  </div>
</article>
</body>
</html>
