<!DOCTYPE html>
<html lang="en">
<head>

<title>Figure 7: Employers are seeking a wide array of data as input into their decision-making.</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; background: #fff; color: #222; }

.stat strong { display: block; color: #ffe600; font-size: 72px; line-height: 1; margin-bottom: 14px; }

<body>
<header>
<p><strong>Figure 7</strong></p>
<h1>Employers are seeking a wide array of data as input into their decision-making.</h1>
<p><strong>QUESTION:</strong> What are the top three most important types of data considered when making decisions about the design of your benefits program?</p>
</header>
<figure>
<div class="panel">
<h2>Percent of employers and the data they seek</h2>
<div class="stats">
<div class="stat"><strong>71%</strong>Information on what employees want</div>
<div class="stat"><strong>61%</strong>Cost trends</div>
<div class="stat"><strong>59%</strong>Participation rates</div>
<div class="stat"><strong>43%</strong>Utilization rates</div>
<div class="stat"><strong>36%</strong>Employee demographics</div>
<div class="stat"><strong>30%</strong>What similar companies offer</div>
</div>
<figcaption>Represents the percent of employers ranking items among their top three most important types of data considered when making decisions about the design of benefits programs.</figcaption>
</div>

<thead>
<tr><th scope="col">Type of data</th><th scope="col">Percent of employers</th></tr>

<tr><th scope="row">Cost trends</th><td>61%</td></tr>

<tr><th scope="row">Utilization rates</th><td>43%</td></tr>

</tbody>
</table>
