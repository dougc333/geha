<p><strong>Figure 15</strong></p>
<h1>Employees want claims and enrollment processes to be further digitized.</h1>
<p><strong>QUESTION:</strong> How important is it to have the following digital/online capabilities available to you?</p>

<p>Legend: <span>2023</span> (yellow); <span>2025</span> (gray)</p>

<ul>
<li>Ability to submit claims online: 2023 57%, 2025 65%</li>
<li>Ability to enroll in benefits online: 2023 59%, 2025 65%</li>
<li>A mobile app to access benefits information: 2023 44%, 2025 50%</li>
<li>Ability to receive digital/online communications on additional benefits available to me: 2023 43%, 2025 45%</li>
<li>Ability to receive text message notifications and status alerts regarding my benefits (claims status, etc.): 2023 39%, 2025 45%</li>
<li>Interactive tool to recommend which benefits are right for me: 2023 41%, 2025 45%</li>
<li>Live chat/chatbot to answer questions: 2023 33%, 2025 32%</li>
</ul>

</tbody>
