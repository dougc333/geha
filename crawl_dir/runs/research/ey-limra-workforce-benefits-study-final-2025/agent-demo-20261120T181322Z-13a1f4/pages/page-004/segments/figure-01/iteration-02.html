<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Figure 1: Companies plan to offer more benefits in five years.</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; color: #2e2e38; margin: 0; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 26px; line-height: 1.15; margin: 4px 0 14px; }
  .fig-label { font-weight: bold; margin: 0; }
  .question { font-size: 16px; margin: 0 0 24px; }
  .chart { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #2e2e38; padding-bottom: 0; }
  .col { flex: 1; display: flex; flex-direction: column; align-items: stretch; }
  .plot { height: 380px; position: relative; }
  .bar { position: absolute; left: 10px; top: 0; bottom: 0; width: 88px; display: flex; flex-direction: column; }
  .seg { display: flex; align-items: center; justify-content: center; font-size: 13px; box-sizing: border-box; }
  .more { background: #ffe600; color: #2e2e38; }
  .same { background: #747480; color: #fff; }
  .fewer { background: #c4c4cd; }
  .small-label { position: absolute; left: 108px; bottom: 0; font-size: 14px; border-left: 1px solid #747480; border-bottom: 0; padding-left: 4px; height: 24px; line-height: 18px; }
  .callout { position: absolute; left: 108px; top: 0; font-size: 17px; line-height: 1.2; color: #747480; }
  .callout strong { display: block; font-size: 28px; line-height: 1.05; }
  .cat { text-align: center; font-size: 13px; padding: 8px 0 0; }
  .legend { display: flex; justify-content: center; gap: 22px; border: 1px solid #c4c4cd; padding: 8px 12px; margin: 22px 0 24px; font-size: 15px; }
  .legend span.sw { display: inline-block; width: 11px; height: 11px; margin-right: 5px; vertical-align: -1px; }
  table { border-collapse: collapse; font-size: 14px; width: 100%; }
  caption { text-align: left; font-weight: bold; padding-bottom: 6px; }
  th, td { border: 1px solid #c4c4cd; padding: 5px 8px; text-align: left; }
  thead th { background: #f0f0f2; }
</style>
</head>
<body>
<main>
<figure style="margin:0">
<p class="fig-label">Figure 1</p>
<h1>Companies plan to offer more benefits in five years.</h1>
<p class="question"><strong>QUESTION:</strong> In five years, do you think your company will be offering fewer, the same or more benefits than it does now?</p>

<div class="chart" aria-hidden="true">
  <div class="col">
    <div class="plot">
      <div class="bar">
        <div class="seg more" style="height:57%">57%</div>
        <div class="seg same" style="height:40%">40%</div>
        <div class="seg fewer" style="height:3%"></div>
      </div>
      <div class="callout"><strong>+7%</strong>change<br>from<br>2023</div>
      <div class="small-label">3%</div>
    </div>
    <div class="cat">Small<br>(10–99 employees)</div>
  </div>
  <div class="col">
    <div class="plot">
      <div class="bar">
        <div class="seg more" style="height:64%">64%</div>
        <div class="seg same" style="height:35%">35%</div>
        <div class="seg fewer" style="height:1%"></div>
      </div>
      <div class="callout"><strong>+6%</strong>change<br>from<br>2023</div>
      <div class="small-label">1%</div>
    </div>
    <div class="cat">Midsize<br>(100–999 employees)</div>
  </div>
  <div class="col">
    <div class="plot">
      <div class="bar">
        <div class="seg more" style="height:67%">67%</div>
        <div class="seg same" style="height:30%">30%</div>
        <div class="seg fewer" style="height:3%"></div>
      </div>
      <div class="callout"><strong>+5%</strong>change<br>from<br>2023</div>
      <div class="small-label">3%</div>
    </div>
    <div class="cat">Large<br>(1,000 or more employees)</div>
  </div>
</div>

<div class="legend">
  <div><span class="sw" style="background:#c4c4cd"></span>Fewer benefits</div>
  <div><span class="sw" style="background:#747480"></span>About the same</div>
  <div><span class="sw" style="background:#ffe600"></span>More benefits</div>
</div>

<table>
<caption>Share of companies expecting to offer fewer, the same or more benefits in five years, by company size</caption>
<thead>
<tr>
<th scope="col">Company size</th>
<th scope="col">Fewer benefits</th>
<th scope="col">About the same</th>
<th scope="col">More benefits</th>
<th scope="col">More benefits change from 2023</th>
</tr>
</thead>
<tbody>
<tr>
<th scope="row">Small (10–99 employees)</th>
<td>3%</td>
<td>40%</td>
<td>57%</td>
<td>+7%</td>
</tr>
<tr>
<th scope="row">Midsize (100–999 employees)</th>
<td>1%</td>
<td>35%</td>
<td>64%</td>
<td>+6%</td>
</tr>
<tr>
<th scope="row">Large (1,000 or more employees)</th>
<td>3%</td>
<td>30%</td>
<td>67%</td>
<td>+5%</td>
</tr>
</tbody>
</table>
</figure>
</main>
</body>
</html>
