<figure class="chart" id="fig8" data-figure="Figure 8"><figcaption><p class="kicker">Figure 8</p><p class="title">Employers choose brokers based on quality service, enhanced strategies and access to benefits.</p><p class="question"><strong>QUESTION:</strong> What are the most important factors your company considers when choosing a broker/benefits advisor to work with for insurance benefits?</p></figcaption><div class="hbars" aria-hidden="true"><div class="lab">Quality of service</div><div class="track multi"><div class="bar-line"><span class="seg" style="width:81.82%;background:#FFE600;color:#2e2e38" title="Employers: 45%"></span><span>45%</span></div></div><div class="lab">Can provide all the insurance benefits my company needs</div><div class="track multi"><div class="bar-line"><span class="seg" style="width:70.91%;background:#FFE600;color:#2e2e38" title="Employers: 39%"></span><span>39%</span></div></div><div class="lab">Helps our company evaluate/enhance its benefits strategy</div><div class="track multi"><div class="bar-line"><span class="seg" style="width:63.64%;background:#FFE600;color:#2e2e38" title="Employers: 35%"></span><span>35%</span></div></div><div class="lab">Reputation or experience</div><div class="track multi"><div class="bar-line"><span class="seg" style="width:56.36%;background:#FFE600;color:#2e2e38" title="Employers: 31%"></span><span>31%</span></div></div><div class="lab">Helps communicate benefits options to employees/provides education</div><div class="track multi"><div class="bar-line"><span class="seg" style="width:54.55%;background:#FFE600;color:#2e2e38" title="Employers: 30%"></span><span>30%</span></div></div><div class="lab">Range of products/services supported</div><div class="track multi"><div class="bar-line"><span class="seg" style="width:49.09%;background:#FFE600;color:#2e2e38" title="Employers: 27%"></span><span>27%</span></div></div><div class="lab">Provides recommendations and guidance on benefits technology</div><div class="track multi"><div class="bar-line"><span class="seg" style="width:40.00%;background:#FFE600;color:#2e2e38" title="Employers: 22%"></span><span>22%</span></div></div><div class="lab">Helps our company understand/address legal and regulatory issues</div><div class="track multi"><div class="bar-line"><span class="seg" style="width:36.36%;background:#FFE600;color:#2e2e38" title="Employers: 20%"></span><span>20%</span></div></div><div class="lab">Familiarity with our company</div><div class="track multi"><div class="bar-line"><span class="seg" style="width:27.27%;background:#FFE600;color:#2e2e38" title="Employers: 15%"></span><span>15%</span></div></div><div class="lab">Carriers represented</div><div class="track multi"><div class="bar-line"><span class="seg" style="width:25.45%;background:#FFE600;color:#2e2e38" title="Employers: 14%"></span><span>14%</span></div></div><div class="lab">Has access to a team of specialists to address more complex needs</div><div class="track multi"><div class="bar-line"><span class="seg" style="width:21.82%;background:#FFE600;color:#2e2e38" title="Employers: 12%"></span><span>12%</span></div></div><div class="lab">Able to provide benefits technology</div><div class="track multi"><div class="bar-line"><span class="seg" style="width:14.55%;background:#FFE600;color:#2e2e38" title="Employers: 8%"></span><span>8%</span></div></div><div class="lab">Other</div><div class="track multi"><div class="bar-line"><span class="seg" style="width:1.82%;background:#FFE600;color:#2e2e38" title="Employers: 1%"></span><span>1%</span></div></div></div><table class="data"><caption>Figure 8 data</caption><thead><tr><th scope="col">Factor</th><th scope="col">Employers</th></tr></thead><tbody><tr><th scope="row">Quality of service</th><td>45%</td></tr><tr><th scope="row">Can provide all the insurance benefits my company needs</th><td>39%</td></tr><tr><th scope="row">Helps our company evaluate/enhance its benefits strategy</th><td>35%</td></tr><tr><th scope="row">Reputation or experience</th><td>31%</td></tr><tr><th scope="row">Helps communicate benefits options to employees/provides education</th><td>30%</td></tr><tr><th scope="row">Range of products/services supported</th><td>27%</td></tr><tr><th scope="row">Provides recommendations and guidance on benefits technology</th><td>22%</td></tr><tr><th scope="row">Helps our company understand/address legal and regulatory issues</th><td>20%</td></tr><tr><th scope="row">Familiarity with our company</th><td>15%</td></tr><tr><th scope="row">Carriers represented</th><td>14%</td></tr><tr><th scope="row">Has access to a team of specialists to address more complex needs</th><td>12%</td></tr><tr><th scope="row">Able to provide benefits technology</th><td>8%</td></tr><tr><th scope="row">Other</th><td>1%</td></tr></tbody></table></figure>
