ight:11.00%;background:#F95D54;color:#ffffff" title="25% to 49%: 11%">11%</span><span class="seg" style="height:6.00%;background:#FF810A;color:#2e2e38" title="50% or more: 6%">6%</span><span class="bracket right" style="bottom:23.0%;height:79.0%"><span>77%</span></span></div><div class="cat">In five years</div></div></div><table class="data"><caption>Figure 3 data</caption><thead><tr><th scope="col">Timeframe</th><th scope="col">None</th><th scope="col">Less than 10%</th><th scope="col">10% to 24%</th><th scope="col">25% to 49%</th><th scope="col">50% or more</th></tr></thead><tbody><tr><th scope="row">Today</th><td>35%</td><td>37%</td><td>16%</td><td>8%</td><td>4%</td></tr><tr><th scope="row">In five years</th><td>23%</td><td>39%</td><td>23%</td><td>11%</td><td>6%</td></tr></tbody></table><ul class="notes"><li>Today: 65% — employers using any contract/freelance workers</li><li>In five years: 77% — employers using any contract/freelance workers</li></ul></figure>
