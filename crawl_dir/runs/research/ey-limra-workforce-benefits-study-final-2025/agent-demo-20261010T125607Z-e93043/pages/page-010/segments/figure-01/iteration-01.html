<figure class="chart" id="fig6" data-figure="Figure 6"><figcaption><p class="kicker">Figure 6</p><p class="title">Employee interest in benefits varies across generations.</p><p class="question"><strong>QUESTION:</strong> Regardless of whether the benefit is currently available to you at work, how interested would you be in having your employer offer it in the future?</p></figcaption><table class="data heat"><caption>Figure 6 (heat map: Least interest → Most interest)</caption><thead><tr><th scope="col">Benefit</th><th scope="col">Gen Z</th><th scope="col">Millennials</th><th scope="col">Gen X</th><th scope="col">Baby boomers</th></tr></thead><tbody><tr><th scope="row">Medical insurance</th><td style="background:#A1DCB7">67%</td><td style="background:#7FCF9C">75%</td><td style="background:#50BE78">86%</td><td style="background:#6AC88C">80%</td></tr><tr><th scope="row">Dental insurance</th><td style="background:#BBE6CA">61%</td><td style="background:#8CD4A6">72%</td><td style="background:#7BCE99">76%</td><td style="background:#83D1A0">74%</td></tr><tr><th scope="row">Vision insurance</th><td style="background:#EAF7EF">50%</td><td style="background:#BBE6CA">61%</td><td style="background:#99D9B0">69%</td><td style="background:#B2E2C4">63%</td></tr><tr><th scope="row">Paid family or medical leave</th><td style="background:#D9F1E1">54%</td><td style="background:#CCECD7">57%</td><td style="background:#D9F1E1">54%</td><td style="background:#FEF8F8">43%</td></tr><tr><th scope="row">Life insurance</th><td style="background:#F2FAF5">48%</td><td style="background:#E1F4E8">52%</td><td style="background:#DDF2E5">53%</td><td style="background:#FDEDED">40%</td></tr><tr><th scope="row">Career development</th><td style="background:#FDEDED">40%</td><td style="background:#FBFDFC">46%</td><td style="background:#FCE3E3">37%</td><td style="background:#F8B8B8">25%</td></tr><tr><th scope="row">Physical health wellness programs</th><td style="background:#FDEAEA">39%</td><td style="background
