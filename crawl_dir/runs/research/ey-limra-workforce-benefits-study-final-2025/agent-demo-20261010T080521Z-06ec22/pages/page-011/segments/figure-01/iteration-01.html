<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The LIMRA-EY Wheel of Wellness</title>
<style>
  .wheel-container {
    display: flex;
    justify-content: center;
    margin-top: 1em;
  }
  .wheel-text {
    font-size: 1.2em;
    font-weight: 600;
    text-align: center;
    margin-top: -5em;
    color: #222;
    position: relative;
  }
  .wheel-segment {
    width: 6em;
    height: 6em;
  }
  footer {
    margin-top: 4em;
    font-weight: 700;
    font-size: 0.9em;
  }
</style>
</head>
<body>
<main>
  <h2>The LIMRA-EY Wheel of Wellness</h2>
  <p>Focused on five key dimensions of health, the LIMRA-EY Wheel of Wellness can help organizations build a happier, healthier, more productive and financially secure workforce.</p>
  <div class="wheel-container" aria-label="The LIMRA-EY Wheel of Wellness focused on five key dimensions">
    <svg role="img" aria-labelledby="wheelTitle" width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" >
      <title id="wheelTitle">The LIMRA-EY Wheel of Wellness showing five dimensions: Physical, Mental, Financial, Societal, Professional</title>
      <!-- Yellow circular arrow ring -->
      <circle cx="160" cy="160" r="140" stroke="gold" stroke-width="20" fill="none" />
      <!-- Arrows approximated by polygon shapes (simplified) -->
      <polygon points="160,20 180,40 160,60" fill="gold" />
      <polygon points="300,160 280,180 260,160" fill="gold" />
      <polygon points="160,300 140,280 160,260" fill="gold" />
      <polygon points="20,160 40,140 60,160" fill="gold" />
      <!-- Segments with text labels -->
      <text x="115" y="100" font-size="18" font-family="Arial, sans-serif" fill="black">Physical</text>
      <text x="195" y="100" font-size="18" font-family="Arial, sans-serif" fill="black">Mental</text>
      <text x="220" y="185" font-size="18" font-family="Arial, sans-serif" fill="black">Financial</text>
      <text x="115" y="230" font-size="18" font-family="Arial, sans-serif" fill="black">Societal</text>
      <text x="60" y="185" font-size="18" font-family="Arial, sans-serif" fill="black">Professional</text>
      <!-- Note: images not included as per instruction -->
    </svg>
  </div>
</main>
<footer>
  | <strong>Harnessing growth in workforce benefits:</strong> the next horizon | 2025 Workforce Benefits Study
</footer>
</body>
</html>
