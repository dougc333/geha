<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Employers See A Need for Total Wellbeing</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 1em;
  }
  figure {
    max-width: 45em;
    margin: 0;
  }
  figcaption p:first-child {
    margin: 0 0 0.25em 0;
    font-weight: normal;
    font-size: 0.9em;
  }
  figcaption h1 {
    font-weight: bold;
    font-size: 1.4em;
    margin: 0.3em 0 0.8em 0;
  }
  figcaption p:last-child {
    margin: 0.3em 0 2em 0;
    font-weight: normal;
  }
  .chart {
    display: flex;
    flex-direction: column;
    gap: 0.6em;
    font-size: 0.9em;
  }
  .bar-group {
    display: flex;
    align-items: center;
    gap: 0.8em;
  }
  .label {
    width: 11.5em;
    flex-shrink: 0;
    text-align: right;
    padding-right: 0.8em;
    line-height: 1.3em;
    white-space: nowrap;
  }
  .bars-container {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.3em;
    flex-grow: 1;
    min-width: 12em;
  }
  .bar {
    display: inline-block;
    height: 1.3em;
    border-radius: 0.15em;
  }
  .bar.value {
    background-color: #b0b0b0; /* base bar in grey */
  }
  .bar.change {
    width: 1em;
    height: 1.3em;
  }
  .bar.green {
    background-color: #27ae60;
  }
  .bar.red {
    background-color: #e74c3c;
  }
  .percentage {
    width: 3em;
    text-align: left;
    font-weight: 600;
    flex-shrink: 0;
  }
  .legend {
    margin-top: 1.8em;
    display: flex;
    gap: 1.8em;
    font-size: 0.9em;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.4em;
  }
  .legend-square {
    width: 1em;
    height: 1em;
    border-radius: 0.2em;
  }
  .legend-green {
    background-color: #27ae60;
  }
  .legend-red {
    background-color: #e74c3c;
  }
  .note {
    margin-top: 1.0em;
    font-size: 0.85em;
    font-style: italic;
  }
</style>
</head>
<body>
<figure aria-label="Employers see a need for total wellbeing">
  <figcaption>
    <p><strong>Figure 4</strong></p>
    <h1>Employers see a need for total wellbeing.</h1>
    <p><strong>QUESTION:</strong> Five years from now, how interested do you think your employees will be in the following types of benefits?</p>
  </figcaption>

  <section aria-label="Bar chart of employer interest in benefits in five years, with change compared to 2023 study" class="chart">
    <div class="bar-group"><div class="label">Medical insurance</div><div class="bars-container"><div class="bar change green" aria-hidden="true" style="width:1.8em;"></div><div class="bar value" aria-hidden="true" style="width:14.25em;"></div></div><div class="percentage" aria-label="89 percent">89%</div></div>
    <div class="bar-group"><div class="label">Dental insurance</div><div class="bars-container"><div class="bar change green" aria-hidden="true" style="width:1.6em;"></div><div class="bar value" aria-hidden="true" style="width:12.65em;"></div></div><div class="percentage" aria-label="79 percent">79%</div></div>
    <div class="bar-group"><div class="label">Vision insurance</div><div class="bars-container"><div class="bar change green" aria-hidden="true" style="width:1.4em;"></div><div class="bar value" aria-hidden="true" style="width:11.75em;"></div></div><div class="percentage" aria-label="74 percent">74%</div></div>
    <div class="bar-group"><div class="label">Paid family or medical leave</div><div class="bars-container"><div class="bar change" aria-hidden="true" style="width:0;"></div><div class="bar value" aria-hidden="true" style="width:11.25em;"></div></div><div class="percentage" aria-label="71 percent">71%</div></div>
    <div class="bar-group"><div class="label">Life insurance</div><div class="bars-container"><div class="bar change" aria-hidden="true" style="width:0;"></div><div class="bar value" aria-hidden="true" style="width:10.6em;"></div></div><div class="percentage" aria-label="67 percent">67%</div></div>
    <div class="bar-group"><div class="label">Short-term disability insurance</div><div class="bars-container"><div class="bar change" aria-hidden="true" style="width:0;"></div><div class="bar value" aria-hidden="true" style="width:10.0em;"></div></div><div class="percentage" aria-label="63 percent">63%</div></div>
    <div class="bar-group"><div class="label">Mental health/substance abuse treatment benefits</div><div class="bars-container"><div class="bar change green" aria-hidden="true" style="width:1.1em;"></div><div class="bar value" aria-hidden="true" style="width:9.55em;"></div></div><div class="percentage" aria-label="60 percent">60%</div></div>
    <div class="bar-group"><div class="label">Career development</div><div class="bars-container"><div class="bar change" aria-hidden="true" style="width:0;"></div><div class="bar value" aria-hidden="true" style="width:9.35em;"></div></div><div class="percentage" aria-label="59 percent">59%</div></div>
    <div class="bar-group"><div class="label">Physical health wellness programs</div><div class="bars-container"><div class="bar change" aria-hidden="true" style="width:0;"></div><div class="bar value" aria-hidden="true" style="width:9.2em;"></div></div><div class="percentage" aria-label="58 percent">58%</div></div>
    <div class="bar-group"><div class="label">Long-term disability insurance</div><div class="bars-container"><div class="bar change" aria-hidden="true" style="width:0;"></div><div class="bar value" aria-hidden="true" style="width:9.2em;"></div></div><div class="percentage" aria-label="58 percent">58%</div></div>
    <div class="bar-group"><div class="label">Accident insurance</div><div class="bars-container"><div class="bar change" aria-hidden="true" style="width:0;"></div><div class="bar value" aria-hidden="true" style="width:9.2em;"></div></div><div class="percentage" aria-label="58 percent">58%</div></div>
    <div class="bar-group"><div class="label">Telemedicine benefits</div><div class="bars-container"><div class="bar change" aria-hidden="true" style="width:0;"></div><div class="bar value" aria-hidden="true" style="width:9.05em;"></div></div><div class="percentage" aria-label="57 percent">57%</div></div>
    <div class="bar-group"><div class="label">Long-term care insurance</div><div class="bars-container"><div class="bar change red" aria-hidden="true" style="width:1.2em;"></div><div class="bar value" aria-hidden="true" style="width:8.55em;"></div></div><div class="percentage" aria-label="54 percent">54%</div></div>
    <div class="bar-group"><div class="label">Critical illness insurance</div><div class="bars-container"><div class="bar change" aria-hidden="true" style="width:0;"></div><div class="bar value" aria-hidden="true" style="width:8.55em;"></div></div><div class="percentage" aria-label="54 percent">54%</div></div>
    <div class="bar-group"><div class="label">Employee assistance programs</div><div class="bars-container"><div class="bar change" aria-hidden="true" style="width:0;"></div><div class="bar value" aria-hidden="true" style="width:8.55em;"></div></div><div class="percentage" aria-label="54 percent">54%</div></div>
    <div class="bar-group"><div class="label">Financial wellness programs</div><div class="bars-container"><div class="bar change red" aria-hidden="true" style="width:1.2em;"></div><div class="bar value" aria-hidden="true" style="width:8.55em;"></div></div><div class="percentage" aria-label="54 percent">54%</div></div>
    <div class="bar-group"><div class="label">Emergency savings benefit</div><div class="bars-container"><div class="bar change" aria-hidden="true" style="width:0;"></div><div class="bar value" aria-hidden="true" style="width:8.25em;"></div></div><div class="percentage" aria-label="52 percent">52%</div></div>
    <div class="bar-group"><div class="label">Hospital indemnity insurance</div><div class="bars-container"><div class="bar change red" aria-hidden="true" style="width:2.55em;"></div><div class="bar value" aria-hidden="true" style="width:7.15em;"></div></div><div class="percentage" aria-label="45 percent">45%</div></div>
    <div class="bar-group"><div class="label">Caregiving benefits</div><div class="bars-container"><div class="bar change" aria-hidden="true" style="width:0;"></div><div class="bar value" aria-hidden="true" style="width:7.15em;"></div></div><div class="percentage" aria-label="45 percent">45%</div></div>
    <div class="bar-group"><div class="label">Identity theft protection</div><div class="bars-container"><div class="bar change red" aria-hidden="true" style="width:1.6em;"></div><div class="bar value" aria-hidden="true" style="width:6.9em;"></div></div><div class="percentage" aria-label="44 percent">44%</div></div>
    <div class="bar-group"><div class="label">Tuition assistance</div><div class="bars-container"><div class="bar change red" aria-hidden="true" style="width:3.25em;"></div><div class="bar value" aria-hidden="true" style="width:6.25em;"></div></div><div class="percentage" aria-label="40 percent">40%</div></div>
    <div class="bar-group"><div class="label">Debt management counseling</div><div class="bars-container"><div class="bar change red" aria-hidden="true" style="width:4.25em;"></div><div class="bar value" aria-hidden="true" style="width:5.9em;"></div></div><div class="percentage" aria-label="38 percent">38%</div></div>
    <div class="bar-group"><div class="label">Student loan assistance/repayment</div><div class="bars-container"><div class="bar change red" aria-hidden="true" style="width:5.15em;"></div><div class="bar value" aria-hidden="true" style="width:5.5em;"></div></div><div class="percentage" aria-label="36 percent">36%</div></div>
    <div class="bar-group"><div class="label">Legal services plan</div><div class="bars-container"><div class="bar change red" aria-hidden="true" style="width:5.65em;"></div><div class="bar value" aria-hidden="true" style="width:5.4em;"></div></div><div class="percentage" aria-label="35 percent">35%</div></div>
    <div class="bar-group"><div class="label">Societal benefits</div><div class="bars-container"><div class="bar change red" aria-hidden="true" style="width:6.0em;"></div><div class="bar value" aria-hidden="true" style="width:5.1em;"></div></div><div class="percentage" aria-label="34 percent">34%</div></div>
    <div class="bar-group"><div class="label">Pet insurance</div><div class="bars-container"><div class="bar change red" aria-hidden="true" style="width:9.0em;"></div><div class="bar value" aria-hidden="true" style="width:3.3em;"></div></div><div class="percentage" aria-label="22 percent">22%</div></div>
  </section>

  <section class="legend" aria-label="Legend explaining colors of percentage changes">
    <div class="legend-item">
      <span class="legend-square legend-green"></span>
      <span>Up 5 percentage points or more vs. 2023 study</span>
    </div>
    <div class="legend-item">
      <span class="legend-square legend-red"></span>
      <span>Down 5 percentage points or more vs. 2023 study</span>
    </div>
  </section>

  <p class="note">
    Note: Percent of employers that believe their company’s employees will be “very” or “extremely” interested in the benefit in the future.
  </p>
</figure>
</body>
</html>
