<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Worker Participation in the Gig Economy</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
    color: #222;
  }
  figure {
    max-width: 600px;
    margin: 0;
  }
  figcaption h2 {
    font-weight: bold;
    margin-bottom: 0.3em;
  }
  figcaption strong {
    font-weight: bold;
  }
  .chart {
    display: flex;
    gap: 0.5em;
    margin: 1em 0 1.5em 0;
    height: 200px;
    align-items: flex-end;
  }
  .bar {
    width: 18%;
    background-color: #999;
    text-align: center;
    color: #fff;
    font-weight: bold;
    border-radius: 4px 4px 0 0;
    position: relative;
  }
  .bar span {
    display: block;
    padding: 4px 2px 6px;
    font-size: 0.9em;
  }
  .bar-label {
    margin-top: 6px;
    font-size: 0.9em;
    text-align: center;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    max-width: 600px;
    font-size: 0.9em;
  }
  th, td {
    border: 1px solid #999;
    padding: 6px 8px;
    text-align: left;
  }
  th {
    background-color: #eee;
    font-weight: bold;
  }
</style>
</head>
<body>
<section>
  <figure>
    <figcaption>
      <strong>Figure 2</strong><br />
      <h2>Worker participation in the gig economy is trending downward.</h2>
      <p><strong>QUESTION:</strong> Instead of (or in addition to) working for a traditional employer (also known as being a W-2 employee), some workers pursue freelance or “gig” work. Which of the following best describes your current work arrangement?</p>
    </figcaption>
    <!-- Simulated bar chart for worker participation in gig economy -->
    <div class="chart" aria-label="Chart showing trends in worker participation in gig economy over years, bars sized to percentages">
      <div class="bar" style="height: 25%;" title="2019: 25%">
        <span>25%</span>
      </div>
      <div class="bar" style="height: 20%;" title="2020: 20%">
        <span>20%</span>
      </div>
      <div class="bar" style="height: 18%;" title="2021: 18%">
        <span>18%</span>
      </div>
      <div class="bar" style="height: 15%;" title="2022: 15%">
        <span>15%</span>
      </div>
      <div class="bar" style="height: 13%;" title="2023: 13%">
        <span>13%</span>
      </div>
    </div>
    <div style="display:flex; justify-content: space-between; max-width: 600px; font-size: 0.85em;">
      <div>2019</div>
      <div>2020</div>
      <div>2021</div>
      <div>2022</div>
      <div>2023</div>
    </div>
    <!-- Corresponding data table -->
    <table summary="Table showing percentage of workers participating in gig economy over recent years">
      <thead>
        <tr>
          <th>Year</th>
          <th>Percentage of Workers Participating</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>2019</td>
          <td>25%</td>
        </tr>
        <tr>
          <td>2020</td>
          <td>20%</td>
        </tr>
        <tr>
          <td>2021</td>
          <td>18%</td>
        </tr>
        <tr>
          <td>2022</td>
          <td>15%</td>
        </tr>
        <tr>
          <td>2023</td>
          <td>13%</td>
        </tr>
      </tbody>
    </table>
  </figure>
</section>
</body>
</html>
