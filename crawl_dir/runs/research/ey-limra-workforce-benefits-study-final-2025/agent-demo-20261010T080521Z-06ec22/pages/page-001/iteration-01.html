  .highlight-box {
    position: relative;
    max-width: 400px;
    font-weight: 700;
    font-size: 1.8rem;
    line-height: 1.3;
    margin-bottom: 0.8em;
    padding: 1.5em 1.5em 1.5em 1.8em;
    color: white;
    background: transparent;
  }
  /* Distinct angled border with yellow-left border and aqua-top and right border as polygon shape */
  .highlight-box:before {
    content: "";
    pointer-events: none;
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border-style: solid;
    border-width: 5px 5px 0 5px;
    border-color: #69D4DA #69D4DA transparent #DDD600;
    clip-path: polygon(0 0, calc(100% - 5px) 0, 100% 5px, 100% 100%, 5px 100%, 0 calc(100% - 5px));
    box-sizing: border-box;
    z-index: -1;
  }
  .highlight-box h1 {
    margin: 0 0 0.33em 0;
    font-weight: 700;
    font-family: Arial, sans-serif;
    line-height: 1.2;
  }
  .subtitle {
    font-weight: 600;
    font-size: 1.2rem;
    margin: 0;
  }

  .footer-text {
    font-size: 0.8rem;
    font-weight: 600;
    max-width: 400px;
    margin: 0;
    /* place near bottom left visually as in source: bottom aligned margin with fixed bottom padding */
    padding-bottom: 1em;
  }

  /* Container at bottom for footer text and branding aligned horizontally on left and right */
  footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 4em 2.7em 4em;
    max-width: 100vw;
    box-sizing: border-box;
  }
  .footer-text p {
    margin: 0;
    color: white;
  }
  .branding {
    display: flex;
    gap: 3em;
    align-items: flex-end;
  }
  .limra, .ey {
    font-family: Arial, sans-serif;
    text-align: left;
    color: white;
  }
  .limra p, .ey p {
    margin: 0 0 0.15em 0;
    font-weight: 700;
    font-size: 1.55rem;
    line-height: 1;
    letter-spacing: 0.05em;
    /* mimic LIMRA's white text with a subtle shading for impact */
    text-shadow: 0 0 0.2em black;
  }
  .limra span {
    font-style: italic;
    font-weight: 400;
    font-size: 0.95rem;
    line-height: 1;
    display: block;
    letter-spacing: 0.03em;
    color: white;
    text-shadow: 0 0 0.15em black;
  }
  .ey {
    text-align: right;
    font-weight: 700;
  }
  .ey span {
    display: block;
    font-weight: 600;
    font-size: 1rem;
    color: white;
    text-transform: none;
    letter-spacing: 0.02em;
    text-shadow: 0 0 0.15em black;
  }

  </section>
</main>
<footer>

  </section>
  <section class="branding" aria-label="Branding and logos">
    <div class="limra" aria-label="LIMRA logo and slogan">
      <p>LIMRA</p>
      <span>Navigate With Confidence</span>
    </div>
    <div class="ey" aria-label="EY logo and slogan">
      <p>EY</p>
