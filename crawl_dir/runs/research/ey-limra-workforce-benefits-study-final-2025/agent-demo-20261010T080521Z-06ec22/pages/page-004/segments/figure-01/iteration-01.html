<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Companies plan to offer more benefits in five years</title>
<style>
  .bar {
    width: 50px;
    display: inline-block;
    margin-right: 40px;
    vertical-align: bottom;
  }
  .yellow { background-color: #ffe600; }
  .gray { background-color: #66666b; }
  .lightgray { background-color: #c4c4c8; }
  .bar-segment {
    text-align: center;
    color: black;
    font-size: 13px;
    font-weight: 600;
  }
  .change {
    font-weight: 700;
    font-size: 14px;
    margin: 5px 0 0 0;
  }
</style>
</head>
<body>
<figure>
  <figcaption>
    <p><strong>Figure 1</strong></p>
    <h1>Companies plan to offer more benefits in five years.</h1>
    <p><strong>QUESTION:</strong> In five years, do you think your company will be offering fewer, the same or more benefits than it does now?</p>
  </figcaption>
  <div style="display: flex; gap: 40px; align-items: flex-end;">
    <div class="bar" aria-label="Bar representing 2021 data">
      <div class="yellow bar-segment" style="height: 114px;">57%</div>
      <div class="gray bar-segment" style="height: 80px; color: white;">40%</div>
      <div class="lightgray bar-segment" style="height: 6px;">3%</div>
      <p class="change">+7%<br />change<br />from 2023</p>
    </div>
    <div class="bar" aria-label="Bar representing 2023 data">
      <div class="yellow bar-segment" style="height: 128px;">64%</div>
      <div class="gray bar-segment" style="height: 70px; color: white;">35%</div>
      <div class="lightgray bar-segment" style="height: 2px;">1%</div>
      <p class="change">+6%<br />change<br />from 2023</p>
    </div>
    <div class="bar" aria-label="Bar representing 2028 forecast data">
      <div class="yellow bar-segment" style="height: 134px;">67%</div>
      <div class="gray bar-segment" style="height: 60px; color: white;">30%</div>
      <div class="lightgray bar-segment" style="height: 6px;">3%</div>
      <p class="change">+5%<br />change<br />from 2023</p>
    </div>
  </div>
  <table role="table" border="1" cellspacing="0" cellpadding="5" style="margin-top: 20px; border-collapse: collapse;">
    <caption>Benefits Offering Data by Year</caption>
    <thead>
      <tr>
        <th scope="col">Year</th>
        <th scope="col">Yellow (Percent)</th>
        <th scope="col">Gray (Percent)</th>
        <th scope="col">Light Gray (Percent)</th>
        <th scope="col">Change from 2023</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>2021</td>
        <td>57%</td>
        <td>40%</td>
        <td>3%</td>
        <td>+7%</td>
      </tr>
      <tr>
        <td>2023</td>
        <td>64%</td>
        <td>35%</td>
        <td>1%</td>
        <td>+6%</td>
      </tr>
      <tr>
        <td>2028 (Forecast)</td>
        <td>67%</td>
        <td>30%</td>
        <td>3%</td>
        <td>+5%</td>
      </tr>
    </tbody>
  </table>
</figure>
</body>
</html>
