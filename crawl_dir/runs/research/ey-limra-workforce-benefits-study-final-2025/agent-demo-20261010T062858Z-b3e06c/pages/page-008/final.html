<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Employers see a need for total wellbeing</title>
<style>
  body {
    font-family: Arial, sans-serif;
    line-height: 1.4;
    margin: 1rem;
  }
  figure figcaption {
    font-size: 0.875rem;
    font-weight: normal;
    margin-bottom: 0.4rem;
  }
  figure figcaption p.figure-label {
    margin: 0;
    font-style: normal;
    font-weight: bold;
    font-size: 0.75rem;
  }
  figure figcaption p.question {
    margin: 0.35rem 0 0 0;
    font-weight: bold;
    font-size: 0.9rem;
  }
  figure figcaption p.question span {
    font-weight: normal;
  }
  figure figcaption p.heading-bold {
    margin: 0.25rem 0 0 0;
    font-weight: bold;
    font-size: 1.25rem;
  }

  /* Bars container */
  .bars-container {
    margin: 1rem 0 0 0;
    max-width: 600px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    margin: 0.15rem 0;
  }
  .bar-label {
    width: 11.5rem;
    font-size: 0.9rem;
  }
  .bar-graph {
    height: 1rem;
    margin-left: 0.25rem;
    border-radius: 0.25rem;
    position: relative;
    flex-grow: 1;
    background-color: #d3d3d3;
    overflow: visible;
  }
  .bar-fill {
    height: 100%;
    border-radius: 0.25rem 0 0 0.25rem;
  }
  .bar-percent {
    min-width: 2.5rem;
    margin-left: 0.4rem;
    font-size: 0.9rem;
    text-align: right;
    white-space: nowrap;
  }
  /* Color codings */
  .up {
    background-color: #2a9d8f;
  }
  .neutral {
    background-color: #999999;
  }
  .down {
    background-color: #e76f51;
  }

  .legend {
    margin: 1rem 0 0 0;
    font-size: 0.85rem;
    max-width: 18rem;
    border: 1px solid #ccc;
    padding: 0.4rem 0.5rem 0.4rem 0.5rem;
    font-family: Arial, sans-serif;
  }
  .legend div {
    display: flex;
    align-items: center;
    margin-bottom: 0.3rem;
  }
  .legend-color-box {
    width: 1rem;
    height: 1rem;
    margin-right: 0.5rem;
    flex-shrink: 0;
    border-radius: 0.15rem;
  }
  .legend-green {
    background-color: #2a9d8f;
  }
  .legend-red {
    background-color: #e76f51;
  }

  .legend-last {
    margin-bottom: 0;
  }

  p.note {
    font-style: italic;
    font-size: 0.85rem;
    margin-top: 0.5rem;
    text-align: right;
  }

</style>
</head>
<body>

<figure aria-label="Employers see a need for total wellbeing chart">
  <figcaption>
    <p class="figure-label">Figure 4</p>
    <p class="heading-bold"><strong>Employers see a need for total wellbeing.</strong></p>
    <p class="question"><strong>QUESTION:</strong> <span>Five years from now, how interested do you think your employees will be in the following types of benefits?</span></p>
  </figcaption>

  <div class="bars-container" aria-label="Employer projected employee interest in benefits in five years">
    <div class="bar-row">
      <div class="bar-label">Medical insurance</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill up" style="width:89%;"></div></div>
      <div class="bar-percent">89%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Dental insurance</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill up" style="width:79%;"></div></div>
      <div class="bar-percent">79%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Vision insurance</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill up" style="width:74%;"></div></div>
      <div class="bar-percent">74%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Paid family or medical leave</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill neutral" style="width:71%;"></div></div>
      <div class="bar-percent">71%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Life insurance</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill neutral" style="width:67%;"></div></div>
      <div class="bar-percent">67%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Short-term disability insurance</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill neutral" style="width:63%;"></div></div>
      <div class="bar-percent">63%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Mental health/substance abuse treatment benefits</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill up" style="width:60%;"></div></div>
      <div class="bar-percent">60%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Career development</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill neutral" style="width:59%;"></div></div>
      <div class="bar-percent">59%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Physical health wellness programs</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill neutral" style="width:58%;"></div></div>
      <div class="bar-percent">58%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Long-term disability insurance</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill neutral" style="width:58%;"></div></div>
      <div class="bar-percent">58%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Accident insurance</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill neutral" style="width:58%;"></div></div>
      <div class="bar-percent">58%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Telemedicine benefits</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill neutral" style="width:57%;"></div></div>
      <div class="bar-percent">57%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Long-term care insurance</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill down" style="width:54%;"></div></div>
      <div class="bar-percent">54%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Critical illness insurance</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill neutral" style="width:54%;"></div></div>
      <div class="bar-percent">54%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Employee assistance programs</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill neutral" style="width:54%;"></div></div>
      <div class="bar-percent">54%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Financial wellness programs</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill down" style="width:54%;"></div></div>
      <div class="bar-percent">54%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Emergency savings benefit</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill neutral" style="width:52%;"></div></div>
      <div class="bar-percent">52%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Hospital indemnity insurance</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill down" style="width:45%;"></div></div>
      <div class="bar-percent">45%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Caregiving benefits</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill neutral" style="width:45%;"></div></div>
      <div class="bar-percent">45%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Identity theft protection</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill down" style="width:44%;"></div></div>
      <div class="bar-percent">44%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Tuition assistance</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill down" style="width:40%;"></div></div>
      <div class="bar-percent">40%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Debt management counseling</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill down" style="width:38%;"></div></div>
      <div class="bar-percent">38%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Student loan assistance/repayment</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill down" style="width:36%;"></div></div>
      <div class="bar-percent">36%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Legal services plan</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill down" style="width:35%;"></div></div>
      <div class="bar-percent">35%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Societal benefits</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill down" style="width:34%;"></div></div>
      <div class="bar-percent">34%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Pet insurance</div>
      <div class="bar-graph" aria-hidden="true"><div class="bar-fill down" style="width:22%;"></div></div>
      <div class="bar-percent">22%</div>
    </div>
  </div>

  <aside class="legend" aria-label="Legend for benefit interest change colors">
    <div><div class="legend-color-box legend-green" aria-hidden="true"></div>Up 5 percentage points or more vs. 2023 study</div>
    <div class="legend-last"><div class="legend-color-box legend-red" aria-hidden="true"></div>Down 5 percentage points or more vs. 2023 study</div>
  </aside>

  <p class="note">Note: Percent of employers that believe their company’s employees will be “very” or “extremely” interested in the benefit in the future.</p>
</figure>

</body>
</html>
