<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Dental enrollment state machine</title>
  <desc>Each member message goes to understand, which fills slots, then a router picks the first missing step: answer benefit questions from the page 5 table, look up the rate code from the page 10 table, ask for the state if the ZIP prefix is ambiguous, ask for ZIP, employment status, enrollment type or plan, and finally quote premiums from the page 11 table.</desc>
  <style>
    .bg { fill: #ffffff; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .teal text { fill: #085041; }
    .coral rect { fill: #FAECE7; stroke: #993C1D; }
    .coral text { fill: #712B13; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .gray text { fill: #444441; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .purple text { fill: #3C3489; }
    .purple .ts2 { font-size: 12px; fill: #534AB7; }
    .amber rect { fill: #FAEEDA; stroke: #854F0B; }
    .amber text { fill: #633806; }
    .blue rect { fill: #E6F1FB; stroke: #185FA5; }
    .blue text { fill: #0C447C; }
    .it { font-size: 12px; font-style: italic; }
    .tq { font-size: 13px; font-weight: 500; }
    .sn { font-size: 12px; }
    .blue polygon { fill: #E6F1FB; stroke: #185FA5; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .arr, .fig { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    .fig { stroke: #2C2C2A; stroke-linecap: round; }
    .group { stroke: #888780; stroke-width: 0.75; fill: none; stroke-dasharray: 4 3; }
    .label { font-size: 24px; font-weight: 700; fill: #2C2C2A; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1e1c; }
      .teal rect { fill: #085041; stroke: #5DCAA5; }
      .teal text { fill: #E1F5EE; }
      .coral rect { fill: #712B13; stroke: #F0997B; }
      .coral text { fill: #FAECE7; }
      .gray rect { fill: #444441; stroke: #B4B2A9; }
      .gray text { fill: #F1EFE8; }
      .purple rect { fill: #3C3489; stroke: #AFA9EC; }
      .purple text { fill: #EEEDFE; }
      .purple .ts2 { fill: #CECBF6; }
      .amber rect { fill: #633806; stroke: #EF9F27; }
      .amber text { fill: #FAEEDA; }
      .blue rect { fill: #0C447C; stroke: #85B7EB; }
      .blue text { fill: #E6F1FB; }
      .blue polygon { fill: #0C447C; stroke: #85B7EB; }
      .ts { fill: #B4B2A9; }
      .arr { stroke: #B4B2A9; }
      .fig { stroke: #F1EFE8; }
      .label { fill: #F1EFE8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="470"/>
  <g class="gray"><rect x="20" y="190" width="110" height="44" rx="8" stroke-width="0.5"/><text class="th" x="75" y="212" text-anchor="middle" dominant-baseline="central">Message</text></g>
  <g class="purple"><rect x="160" y="184" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="235" y="203" text-anchor="middle" dominant-baseline="central">understand</text><text class="ts" x="235" y="222" text-anchor="middle" dominant-baseline="central">fill slots: rules or --llm</text></g>
  <g class="blue"><polygon points="334,212 380,172 426,212 380,252" stroke-width="0.5"/><text class="th" x="380" y="203" text-anchor="middle" dominant-baseline="central">first</text><text class="th" x="380" y="221" text-anchor="middle" dominant-baseline="central">missing?</text></g>
  <path d="M132 212 L156 212" class="arr" marker-end="url(#arrow)"/>
  <path d="M312 212 L330 212" class="arr" marker-end="url(#arrow)"/>
  <g class="teal"><rect x="470" y="30" width="240" height="40" rx="8" stroke-width="0.5"/><text class="th" x="590" y="50" text-anchor="middle" dominant-baseline="central">answer_benefits (page 5 table)</text></g>
  <path d="M428 212 L466 50" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="722" y="50" text-anchor="start" dominant-baseline="central">↻ then route again</text>
  <g class="teal"><rect x="470" y="82" width="240" height="40" rx="8" stroke-width="0.5"/><text class="th" x="590" y="102" text-anchor="middle" dominant-baseline="central">find_rate_code (page 10 table)</text></g>
  <path d="M428 212 L466 102" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="722" y="102" text-anchor="start" dominant-baseline="central">↻ then route again</text>
  <g class="gray"><rect x="470" y="134" width="240" height="40" rx="8" stroke-width="0.5"/><text class="th" x="590" y="154" text-anchor="middle" dominant-baseline="central">ask_state</text></g>
  <path d="M428 212 L466 154" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="722" y="154" text-anchor="start" dominant-baseline="central">reply, wait for member</text>
  <g class="gray"><rect x="470" y="186" width="240" height="40" rx="8" stroke-width="0.5"/><text class="th" x="590" y="206" text-anchor="middle" dominant-baseline="central">ask_zip</text></g>
  <path d="M428 212 L466 206" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="722" y="206" text-anchor="start" dominant-baseline="central">reply, wait for member</text>
  <g class="gray"><rect x="470" y="238" width="240" height="40" rx="8" stroke-width="0.5"/><text class="th" x="590" y="258" text-anchor="middle" dominant-baseline="central">ask_status (employed / retired)</text></g>
  <path d="M428 212 L466 258" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="722" y="258" text-anchor="start" dominant-baseline="central">reply, wait for member</text>
  <g class="gray"><rect x="470" y="290" width="240" height="40" rx="8" stroke-width="0.5"/><text class="th" x="590" y="310" text-anchor="middle" dominant-baseline="central">ask_enrollment</text></g>
  <path d="M428 212 L466 310" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="722" y="310" text-anchor="start" dominant-baseline="central">reply, wait for member</text>
  <g class="gray"><rect x="470" y="342" width="240" height="40" rx="8" stroke-width="0.5"/><text class="th" x="590" y="362" text-anchor="middle" dominant-baseline="central">ask_plan (High / Standard / both)</text></g>
  <path d="M428 212 L466 362" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="722" y="362" text-anchor="start" dominant-baseline="central">reply, wait for member</text>
  <g class="teal"><rect x="470" y="394" width="240" height="40" rx="8" stroke-width="0.5"/><text class="th" x="590" y="414" text-anchor="middle" dominant-baseline="central">quote (page 11 table)</text></g>
  <path d="M428 212 L466 414" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="722" y="414" text-anchor="start" dominant-baseline="central">reply with premiums</text>
  <g class="teal"><rect x="20" y="300" width="28" height="16" rx="8" stroke-width="0.5"/><text class="th" x="34" y="308" text-anchor="middle" dominant-baseline="central"></text></g>
  <text class="ts" x="56" y="308" text-anchor="start" dominant-baseline="central">structured table lookup</text>
  <g class="gray"><rect x="20" y="326" width="28" height="16" rx="8" stroke-width="0.5"/><text class="th" x="34" y="334" text-anchor="middle" dominant-baseline="central"></text></g>
  <text class="ts" x="56" y="334" text-anchor="start" dominant-baseline="central">ask the member one question</text>
  <text class="label" x="20" y="452">Dental enrollment state machine</text>
</svg>
