<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 790" width="1280" height="790" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4f57"/>
    </marker>
    <style>
      .t  { font-size: 13.5px; font-weight: 600; fill: #1f2328; }
      .b  { font-size: 11.5px; fill: #3d434b; }
      .m  { font-size: 11px; fill: #5b6169; font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
      .band { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #6b6f76; }
      .ln { stroke: #4a4f57; stroke-width: 1.5; fill: none; }
      .py { fill: #eaf1fb; stroke: #3b6fb6; stroke-width: 1.4; }
      .ai { fill: #f1ecfa; stroke: #7353ba; stroke-width: 1.4; }
      .db { fill: #e6f4f1; stroke: #2c8a7a; stroke-width: 1.4; }
      .ui { fill: #ffffff; stroke: #7a7f86; stroke-width: 1.4; }
      .opt { stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="1280" height="790" fill="#fbfaf7"/>

  <!-- Title -->
  <text x="40" y="38" font-size="21" font-weight="700" fill="#1f2328">Selectable RAG demo — Vercel deployment</text>
  <text x="40" y="58" class="b">Pre-indexed PDFs in Postgres/pgvector; each query compares Vector, BM25 or Hybrid retrieval with optional LLM rerank and grounded answer.</text>

  <!-- ============ Offline ingestion band ============ -->
  <rect x="20" y="72" width="1240" height="122" rx="10" fill="#f3f1ec" stroke="#e2ded5"/>
  <text x="36" y="93" class="band">OFFLINE INGESTION · scripts/ingest.py</text>

  <rect x="40" y="104" width="160" height="72" rx="8" class="ui"/>
  <text x="54" y="126" class="t">PDF files</text>
  <text x="54" y="146" class="b">run locally, one or many</text>
  <text x="54" y="164" class="m">id = sha256(bytes)</text>

  <rect x="240" y="104" width="200" height="72" rx="8" class="py"/>
  <text x="254" y="126" class="t">PyMuPDF extract</text>
  <text x="254" y="146" class="b">text per page,</text>
  <text x="254" y="164" class="b">whitespace normalized</text>

  <rect x="480" y="104" width="200" height="72" rx="8" class="py"/>
  <text x="494" y="126" class="t">chunk_text()</text>
  <text x="494" y="146" class="b">350 words · 50 overlap</text>
  <text x="494" y="164" class="b">page_number kept per chunk</text>

  <rect x="720" y="104" width="220" height="72" rx="8" class="ai"/>
  <text x="734" y="126" class="t">OpenAI embeddings</text>
  <text x="734" y="146" class="m">text-embedding-3-small</text>
  <text x="734" y="164" class="b">1536-d, one batched call</text>

  <line x1="200" y1="140" x2="238" y2="140" class="ln" marker-end="url(#arr)"/>
  <line x1="440" y1="140" x2="478" y2="140" class="ln" marker-end="url(#arr)"/>
  <line x1="680" y1="140" x2="718" y2="140" class="ln" marker-end="url(#arr)"/>

  <text x="972" y="126" class="b">Upsert rag_documents, then delete and</text>
  <text x="972" y="144" class="b">re-insert that document's rag_chunks,</text>
  <text x="972" y="162" class="b">so re-ingesting a PDF is idempotent.</text>

  <line x1="830" y1="176" x2="830" y2="223" class="ln" marker-end="url(#arr)"/>
  <text x="840" y="208" class="m">INSERT</text>

  <!-- ============ Shared store ============ -->
  <rect x="40" y="225" width="1200" height="70" rx="8" class="db"/>
  <text x="56" y="251" class="t">PostgreSQL + pgvector</text>
  <text x="222" y="251" class="m">rag_documents(id, title, source)</text>
  <text x="56" y="277" class="m">rag_chunks(document_id, chunk_index, page_number, content, embedding vector(1536))  ·  HNSW index, vector_cosine_ops</text>

  <!-- ============ Online query band ============ -->
  <rect x="20" y="318" width="1240" height="400" rx="10" fill="#f3f1ec" stroke="#e2ded5"/>
  <text x="36" y="339" class="band">ONLINE QUERY · Vercel</text>

  <!-- Browser -->
  <rect x="40" y="356" width="170" height="266" rx="8" class="ui"/>
  <text x="54" y="380" class="t">Browser UI</text>
  <text x="54" y="398" class="m">public/index.html</text>
  <text x="54" y="428" class="b">• document picker</text>
  <text x="54" y="448" class="b">• Vector | BM25 | Hybrid</text>
  <text x="54" y="468" class="b">• LLM reranker toggle</text>
  <text x="54" y="488" class="b">• Generate answer toggle</text>
  <text x="54" y="508" class="b">• top_k slider 1–10</text>
  <text x="54" y="538" class="b">Shows answer, ranked</text>
  <text x="54" y="556" class="b">chunks with page + score,</text>
  <text x="54" y="574" class="b">and per-stage latency</text>

  <!-- API -->
  <rect x="260" y="356" width="170" height="266" rx="8" class="ui"/>
  <text x="274" y="380" class="t">FastAPI</text>
  <text x="274" y="398" class="m">api/index.py</text>
  <text x="274" y="422" class="b">Vercel Python function,</text>
  <text x="274" y="440" class="b">300 s max duration</text>
  <text x="274" y="470" class="m">GET  /api/documents</text>
  <text x="274" y="488" class="m">POST /api/search</text>
  <text x="274" y="518" class="b">Pydantic-validated request;</text>
  <text x="274" y="536" class="b">perf_counter timing</text>
  <text x="274" y="554" class="b">around every stage</text>

  <line x1="210" y1="410" x2="258" y2="410" class="ln" marker-end="url(#arr)"/>
  <text x="214" y="402" class="m">req</text>
  <line x1="258" y1="596" x2="212" y2="596" class="ln" marker-end="url(#arr)"/>
  <text x="214" y="614" class="m">JSON</text>

  <!-- Retrieval container -->
  <rect x="465" y="356" width="470" height="266" rx="8" fill="#ffffff" stroke="#b9bdc3" stroke-width="1.2"/>
  <text x="479" y="378" class="t">Retrieval</text>
  <text x="598" y="378" class="m">retrieval_mode = vector | bm25 | hybrid</text>
  <line x1="430" y1="410" x2="463" y2="410" class="ln" marker-end="url(#arr)"/>

  <!-- BM25 column -->
  <rect x="478" y="392" width="210" height="62" rx="7" class="db"/>
  <text x="490" y="414" class="t">Load document chunks</text>
  <text x="490" y="434" class="m">all rows for document_id</text>
  <line x1="583" y1="295" x2="583" y2="390" class="ln" marker-end="url(#arr)"/>

  <rect x="478" y="474" width="210" height="72" rx="7" class="py"/>
  <text x="490" y="496" class="t">Okapi BM25 (Python)</text>
  <text x="490" y="515" class="m">k1=1.5  b=0.75</text>
  <text x="490" y="534" class="b">score &gt; 0 → top 20 · bm25_ms</text>
  <line x1="583" y1="454" x2="583" y2="472" class="ln" marker-end="url(#arr)"/>

  <!-- Vector column -->
  <rect x="712" y="392" width="176" height="62" rx="7" class="ai"/>
  <text x="724" y="414" class="t">Embed query</text>
  <text x="724" y="434" class="m">text-embedding-3-small</text>
  <line x1="792" y1="454" x2="792" y2="472" class="ln" marker-end="url(#arr)"/>

  <rect x="712" y="474" width="210" height="72" rx="7" class="db"/>
  <text x="724" y="496" class="t">pgvector cosine search</text>
  <text x="724" y="515" class="m">ORDER BY embedding &lt;=&gt; q</text>
  <text x="724" y="534" class="b">top 20 · vector_ms</text>
  <line x1="900" y1="295" x2="900" y2="472" class="ln" marker-end="url(#arr)"/>

  <!-- RRF -->
  <rect x="478" y="564" width="444" height="46" rx="7" class="py"/>
  <text x="490" y="584" class="t">Reciprocal-rank fusion (hybrid, k = 60)</text>
  <text x="490" y="601" class="b">vector or bm25 mode passes its single list through</text>
  <line x1="583" y1="546" x2="583" y2="562" class="ln" marker-end="url(#arr)"/>
  <line x1="817" y1="546" x2="817" y2="562" class="ln" marker-end="url(#arr)"/>

  <!-- Post-retrieval column -->
  <line x1="935" y1="410" x2="968" y2="410" class="ln" marker-end="url(#arr)"/>

  <rect x="970" y="356" width="270" height="92" rx="8" class="ai opt"/>
  <text x="984" y="379" class="t">LLM rerank</text>
  <text x="1068" y="379" class="b">(optional)</text>
  <text x="984" y="399" class="m">gpt-4o-mini · JSON schema</text>
  <text x="984" y="418" class="b">reorders the top 20 candidates;</text>
  <text x="984" y="436" class="b">missing ids appended · rerank_ms</text>

  <rect x="970" y="470" width="270" height="48" rx="8" class="py"/>
  <text x="984" y="492" class="t">Slice to top_k</text>
  <text x="984" y="509" class="b">1–10 chunks returned and used as context</text>

  <rect x="970" y="540" width="270" height="90" rx="8" class="ai opt"/>
  <text x="984" y="563" class="t">Grounded answer</text>
  <text x="1104" y="563" class="b">(optional)</text>
  <text x="984" y="584" class="m">gpt-4o-mini</text>
  <text x="984" y="603" class="b">answers only from chunks, cites</text>
  <text x="984" y="621" class="b">[chunk ID] · generation_ms</text>

  <line x1="1105" y1="448" x2="1105" y2="468" class="ln" marker-end="url(#arr)"/>
  <line x1="1105" y1="518" x2="1105" y2="538" class="ln" marker-end="url(#arr)"/>

  <!-- Response path -->
  <path d="M1105,630 V664 H345 V624" class="ln" marker-end="url(#arr)"/>
  <text x="470" y="686" class="b">Response: configuration · answer · results (chunk, page, score, rerank_position) · timings_ms per stage + total_ms</text>

  <!-- Legend -->
  <g transform="translate(40,745)">
    <rect x="0" y="-12" width="18" height="14" rx="3" class="py"/>
    <text x="26" y="0" class="b">Python compute</text>
    <rect x="150" y="-12" width="18" height="14" rx="3" class="db"/>
    <text x="176" y="0" class="b">Postgres / pgvector</text>
    <rect x="320" y="-12" width="18" height="14" rx="3" class="ai"/>
    <text x="346" y="0" class="b">OpenAI API call</text>
    <rect x="470" y="-12" width="18" height="14" rx="3" class="ui"/>
    <text x="496" y="0" class="b">Client / endpoint</text>
    <rect x="620" y="-12" width="18" height="14" rx="3" fill="#fff" stroke="#4a4f57" stroke-width="1.4" class="opt"/>
    <text x="646" y="0" class="b">Dashed = user-toggled, optional stage</text>
  </g>
  <text x="40" y="772" class="m">Env: DATABASE_URL, OPENAI_API_KEY, OPENAI_EMBEDDING_MODEL, OPENAI_RERANK_MODEL, OPENAI_GENERATION_MODEL, ALLOWED_ORIGINS</text>
</svg>
