<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Three AWS RAG ingestion paths using two ingestion Lambda functions</title>
  <desc id="desc">Side-by-side flowchart of native PDF ingestion, validated GEHA sidecar ingestion, and rich local Docling ingestion. The first two use the shared Chunker Lambda. All three use the shared Embedder Lambda and write to Postgres with pgvector and BM25.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="1" stop-color="#243b53"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f6fed"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16866a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c4dff"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, Arial, sans-serif; fill: #fff; }
      .subtitle { font: 400 20px Inter, Arial, sans-serif; fill: #d9e2ec; }
      .path-title { font: 700 25px Inter, Arial, sans-serif; fill: #102a43; }
      .path-note { font: 500 16px Inter, Arial, sans-serif; fill: #486581; }
      .box-title { font: 700 18px Inter, Arial, sans-serif; fill: #102a43; }
      .box-note { font: 400 14px Inter, Arial, sans-serif; fill: #486581; }
      .pill { font: 700 13px Inter, Arial, sans-serif; letter-spacing: .8px; }
      .footer-title { font: 700 18px Inter, Arial, sans-serif; fill: #102a43; }
      .footer-note { font: 400 15px Inter, Arial, sans-serif; fill: #486581; }
      .arrow { fill: none; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f5f7fa"/>
  <rect width="1600" height="118" fill="url(#header)"/>
  <text x="64" y="58" class="title">AWS RAG: three ingestion paths, two ingestion Lambdas</text>
  <text x="64" y="91" class="subtitle">Chunker Lambda prepares text chunks · Embedder Lambda creates vectors and writes the search indexes</text>

  <!-- Column backgrounds -->
  <rect x="46" y="148" width="482" height="635" rx="24" fill="#ffffff" stroke="#bfd3ff" stroke-width="2" filter="url(#shadow)"/>
  <rect x="559" y="148" width="482" height="635" rx="24" fill="#ffffff" stroke="#9fd8ca" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1072" y="148" width="482" height="635" rx="24" fill="#ffffff" stroke="#cab8ff" stroke-width="2" filter="url(#shadow)"/>

  <!-- Path 1 header -->
  <rect x="70" y="170" width="94" height="28" rx="14" fill="#e8f0ff"/>
  <text x="117" y="189" text-anchor="middle" class="pill" fill="#2f6fed">PATH 1</text>
  <text x="70" y="231" class="path-title">Native PDF extraction</text>
  <text x="70" y="258" class="path-note">Legacy research papers · sidecar not required</text>

  <!-- Path 1 boxes -->
  <g filter="url(#shadow)">
    <rect x="126" y="286" width="322" height="62" rx="12" fill="#eef4ff" stroke="#7aa2f7"/>
    <rect x="126" y="377" width="322" height="68" rx="12" fill="#fff8e6" stroke="#d69e2e"/>
    <rect x="126" y="474" width="322" height="78" rx="12" fill="#e8f0ff" stroke="#2f6fed" stroke-width="2"/>
    <rect x="126" y="581" width="322" height="68" rx="12" fill="#eefaf6" stroke="#49a88d"/>
    <rect x="126" y="678" width="322" height="68" rx="12" fill="#e8f7f2" stroke="#16866a" stroke-width="2"/>
  </g>
  <text x="287" y="314" text-anchor="middle" class="box-title">PDF → Raw S3 bucket</text>
  <text x="287" y="335" text-anchor="middle" class="box-note">S3 event enters ChunkQueue</text>
  <text x="287" y="406" text-anchor="middle" class="box-title">SQS ChunkQueue</text>
  <text x="287" y="429" text-anchor="middle" class="box-note">Retries → chunking DLQ</text>
  <text x="287" y="504" text-anchor="middle" class="box-title">λ Chunker Lambda</text>
  <text x="287" y="528" text-anchor="middle" class="box-note">PyMuPDF page text · 350/50 chunks</text>
  <text x="287" y="609" text-anchor="middle" class="box-title">JSONL → Chunks S3</text>
  <text x="287" y="632" text-anchor="middle" class="box-note">S3 event enters EmbedQueue</text>
  <text x="287" y="706" text-anchor="middle" class="box-title">λ Embedder Lambda</text>
  <text x="287" y="729" text-anchor="middle" class="box-note">Titan embeddings → Postgres</text>
  <path d="M287 348 V372" class="arrow" stroke="#2f6fed" marker-end="url(#arrow-blue)"/>
  <path d="M287 445 V469" class="arrow" stroke="#2f6fed" marker-end="url(#arrow-blue)"/>
  <path d="M287 552 V576" class="arrow" stroke="#2f6fed" marker-end="url(#arrow-blue)"/>
  <path d="M287 649 V673" class="arrow" stroke="#2f6fed" marker-end="url(#arrow-blue)"/>

  <!-- Path 2 header -->
  <rect x="583" y="170" width="94" height="28" rx="14" fill="#e6f7f2"/>
  <text x="630" y="189" text-anchor="middle" class="pill" fill="#16866a">PATH 2</text>
  <text x="583" y="231" class="path-title">Validated GEHA sidecar</text>
  <text x="583" y="258" class="path-note">Visually matched text · required-sidecar mode</text>

  <!-- Path 2 boxes -->
  <g filter="url(#shadow)">
    <rect x="639" y="286" width="322" height="62" rx="12" fill="#eefaf6" stroke="#49a88d"/>
    <rect x="639" y="377" width="322" height="68" rx="12" fill="#fff8e6" stroke="#d69e2e"/>
    <rect x="639" y="474" width="322" height="78" rx="12" fill="#e8f7f2" stroke="#16866a" stroke-width="2"/>
    <rect x="639" y="581" width="322" height="68" rx="12" fill="#eefaf6" stroke="#49a88d"/>
    <rect x="639" y="678" width="322" height="68" rx="12" fill="#e8f7f2" stroke="#16866a" stroke-width="2"/>
  </g>
  <text x="800" y="310" text-anchor="middle" class="box-title">PDF + validated JSON sidecar</text>
  <text x="800" y="334" text-anchor="middle" class="box-note">Local visual validation → Raw S3</text>
  <text x="800" y="406" text-anchor="middle" class="box-title">SQS ChunkQueue</text>
  <text x="800" y="429" text-anchor="middle" class="box-note">Retries → chunking DLQ</text>
  <text x="800" y="501" text-anchor="middle" class="box-title">λ Chunker Lambda</text>
  <text x="800" y="524" text-anchor="middle" class="box-note">Verify PDF/page hashes + statuses</text>
  <text x="800" y="543" text-anchor="middle" class="box-note">Chunk the validated sidecar text</text>
  <text x="800" y="609" text-anchor="middle" class="box-title">JSONL → Chunks S3</text>
  <text x="800" y="632" text-anchor="middle" class="box-note">S3 event enters EmbedQueue</text>
  <text x="800" y="706" text-anchor="middle" class="box-title">λ Embedder Lambda</text>
  <text x="800" y="729" text-anchor="middle" class="box-note">Titan embeddings → Postgres</text>
  <path d="M800 348 V372" class="arrow" stroke="#16866a" marker-end="url(#arrow-green)"/>
  <path d="M800 445 V469" class="arrow" stroke="#16866a" marker-end="url(#arrow-green)"/>
  <path d="M800 552 V576" class="arrow" stroke="#16866a" marker-end="url(#arrow-green)"/>
  <path d="M800 649 V673" class="arrow" stroke="#16866a" marker-end="url(#arrow-green)"/>

  <!-- Path 3 header -->
  <rect x="1096" y="170" width="94" height="28" rx="14" fill="#f0ebff"/>
  <text x="1143" y="189" text-anchor="middle" class="pill" fill="#6b3fd4">PATH 3</text>
  <text x="1096" y="231" class="path-title">Rich local Docling</text>
  <text x="1096" y="258" class="path-note">Tables + figures · bypasses Chunker Lambda</text>

  <!-- Path 3 boxes -->
  <g filter="url(#shadow)">
    <rect x="1152" y="286" width="322" height="62" rx="12" fill="#f4f0ff" stroke="#9b7ae8"/>
    <rect x="1152" y="377" width="322" height="78" rx="12" fill="#f0ebff" stroke="#7c4dff" stroke-width="2"/>
    <rect x="1152" y="484" width="322" height="68" rx="12" fill="#f4f0ff" stroke="#9b7ae8"/>
    <rect x="1152" y="581" width="322" height="68" rx="12" fill="#eefaf6" stroke="#49a88d"/>
    <rect x="1152" y="678" width="322" height="68" rx="12" fill="#e8f7f2" stroke="#16866a" stroke-width="2"/>
  </g>
  <text x="1313" y="314" text-anchor="middle" class="box-title">PDF → local Docling workflow</text>
  <text x="1313" y="335" text-anchor="middle" class="box-note">Runs outside Lambda</text>
  <text x="1313" y="405" text-anchor="middle" class="box-title">Structure-aware preparation</text>
  <text x="1313" y="428" text-anchor="middle" class="box-note">Markdown tables + figure images</text>
  <text x="1313" y="447" text-anchor="middle" class="box-note">Nova Lite figure descriptions</text>
  <text x="1313" y="512" text-anchor="middle" class="box-title">Prepared JSONL</text>
  <text x="1313" y="535" text-anchor="middle" class="box-note">No ChunkQueue or Chunker Lambda</text>
  <text x="1313" y="609" text-anchor="middle" class="box-title">Upload → Chunks S3</text>
  <text x="1313" y="632" text-anchor="middle" class="box-note">S3 event enters EmbedQueue</text>
  <text x="1313" y="706" text-anchor="middle" class="box-title">λ Embedder Lambda</text>
  <text x="1313" y="729" text-anchor="middle" class="box-note">Titan embeddings → Postgres</text>
  <path d="M1313 348 V372" class="arrow" stroke="#7c4dff" marker-end="url(#arrow-purple)"/>
  <path d="M1313 455 V479" class="arrow" stroke="#7c4dff" marker-end="url(#arrow-purple)"/>
  <path d="M1313 552 V576" class="arrow" stroke="#7c4dff" marker-end="url(#arrow-purple)"/>
  <path d="M1313 649 V673" class="arrow" stroke="#7c4dff" marker-end="url(#arrow-purple)"/>

  <!-- Footer -->
  <rect x="46" y="810" width="1508" height="58" rx="18" fill="#e9eef5" stroke="#cbd5e1"/>
  <text x="74" y="836" class="footer-title">Shared destination:</text>
  <text x="255" y="836" class="footer-note">Postgres document/chunk records + pgvector embeddings + BM25 term index</text>
  <text x="74" y="858" class="footer-title">Key distinction:</text>
  <text x="232" y="858" class="footer-note">Paths 1–2 share the Chunker Lambda; all three share the Embedder Lambda. Query Lambda is serving, not ingestion.</text>
</svg>
