<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1090" width="1400" height="1090" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4f57"/>
    </marker>
    <style>
      .t  { font-size: 14px; font-weight: 600; fill: #1f2328; }
      .b  { font-size: 12px; fill: #3d434b; }
      .m  { font-size: 11px; fill: #5b6169; font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
      .lbl { font-size: 11px; fill: #5b6169; font-style: italic; }
      .band { font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em; fill: #6b6f76; }
      .ln { stroke: #4a4f57; stroke-width: 1.5; fill: none; }
      .dash { stroke: #8a8f97; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
      .py { fill: #eaf1fb; stroke: #3b6fb6; stroke-width: 1.4; }
      .ai { fill: #f1ecfa; stroke: #7353ba; stroke-width: 1.4; }
      .db { fill: #e6f4f1; stroke: #2c8a7a; stroke-width: 1.4; }
      .aws { fill: #fff5e8; stroke: #c77d1a; stroke-width: 1.4; }
      .ui { fill: #ffffff; stroke: #7a7f86; stroke-width: 1.4; }
      .ext { fill: #fdf0f2; stroke: #b0485a; stroke-width: 1.4; }
      .frame { fill: none; stroke: #c77d1a; stroke-width: 1.4; stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1400" height="1090" fill="#fbfaf7"/>

  <text x="36" y="40" font-size="22" font-weight="700" fill="#1f2328">aws_rag: current architecture</text>
  <text x="36" y="62" class="b">RAG over 203 arXiv papers on AWS (sam-app, us-west-2): text, table and figure chunks · Amazon Bedrock models · Neon Postgres + pgvector · Weaviate copy · Langfuse tracing.</text>

  <!-- ============ INGESTION ============ -->
  <text x="36" y="100" class="band">INGESTION</text>

  <!-- Row A: laptop Docling path -->
  <rect x="36" y="112" width="300" height="104" rx="8" class="py"/>
  <text x="50" y="134" class="t">Laptop · docling_chunks.py --figures</text>
  <text x="50" y="154" class="b">Docling, OCR off, table structure on</text>
  <text x="50" y="171" class="b">text chunks (350 words, 50 overlap)</text>
  <text x="50" y="188" class="b">table chunks: caption + compact Markdown</text>
  <text x="50" y="205" class="b">figure PNGs + caption + PDF text in box</text>

  <path d="M336,164 L378,164" class="ln" marker-end="url(#arr)"/>

  <rect x="380" y="112" width="270" height="104" rx="8" class="py"/>
  <text x="394" y="134" class="t">describe_figures.py</text>
  <text x="394" y="154" class="b">Nova Lite reads each figure image</text>
  <text x="394" y="171" class="b">description first, then text by panel</text>
  <text x="394" y="188" class="b">PDF text only as a spelling hint</text>
  <text x="394" y="205" class="b">cached in figures.json · ~$0.00012/figure</text>

  <path d="M650,164 L700,164" class="ln" marker-end="url(#arr)"/>
  <text x="656" y="156" class="lbl">upload</text>

  <!-- Row B: cloud path for new papers -->
  <rect x="36" y="240" width="300" height="84" rx="8" class="py"/>
  <text x="50" y="262" class="t">New papers</text>
  <text x="50" y="281" class="m">download_top_cited.py · upload_papers.py</text>
  <text x="50" y="298" class="m">POST /api/arxiv (chat "Add paper")</text>
  <text x="50" y="315" class="b">PDF + metadata sidecar (.json)</text>

  <path d="M336,282 L378,282" class="ln" marker-end="url(#arr)"/>

  <rect x="380" y="240" width="130" height="84" rx="8" class="aws"/>
  <text x="394" y="262" class="t">S3 raw bucket</text>
  <text x="394" y="281" class="m">papers/*.pdf</text>
  <text x="394" y="298" class="m">arxiv/*.pdf</text>
  <text x="394" y="315" class="m">+ .json</text>

  <path d="M510,282 L530,282" class="ln" marker-end="url(#arr)"/>

  <rect x="532" y="240" width="140" height="84" rx="8" class="aws"/>
  <text x="546" y="262" class="t">Chunker λ</text>
  <text x="546" y="281" class="b">PyMuPDF flat text</text>
  <text x="546" y="298" class="b">(no tables/figures)</text>
  <text x="546" y="315" class="b">SQS + DLQ in front</text>

  <path d="M672,282 L700,282" class="ln" marker-end="url(#arr)"/>

  <!-- S3 chunks bucket -->
  <rect x="702" y="112" width="250" height="212" rx="8" class="aws"/>
  <text x="716" y="134" class="t">S3 chunks bucket</text>
  <text x="716" y="156" class="m">chunks/&lt;sha256&gt;.jsonl</text>
  <text x="716" y="173" class="b">text · table · figure chunks,</text>
  <text x="716" y="190" class="b">one line per chunk</text>
  <text x="716" y="214" class="m">figures/&lt;doc&gt;/p003_f01.png</text>
  <text x="716" y="231" class="b">figure images (not a trigger)</text>
  <text x="716" y="255" class="m">backups/rag_neon_*.dump</text>
  <text x="716" y="272" class="b">pg_dump of Neon (backup_db.sh)</text>
  <text x="716" y="298" class="b">only chunks/*.jsonl triggers</text>
  <text x="716" y="314" class="b">the embedder</text>

  <path d="M952,164 L998,164" class="ln" marker-end="url(#arr)"/>
  <text x="956" y="156" class="lbl">.jsonl</text>

  <!-- Embedder -->
  <rect x="1000" y="112" width="180" height="120" rx="8" class="aws"/>
  <text x="1014" y="134" class="t">Embedder λ</text>
  <text x="1014" y="154" class="b">Titan v2, 1024-d</text>
  <text x="1014" y="171" class="b">8 calls in parallel,</text>
  <text x="1014" y="188" class="b">retries model errors</text>
  <text x="1014" y="205" class="b">one transaction per paper</text>
  <text x="1014" y="222" class="b">SQS + DLQ in front</text>

  <!-- Bedrock -->
  <rect x="1210" y="112" width="160" height="212" rx="8" class="ai"/>
  <text x="1224" y="134" class="t">Amazon Bedrock</text>
  <text x="1224" y="158" class="b">Titan Text</text>
  <text x="1224" y="174" class="b">Embeddings v2</text>
  <text x="1224" y="198" class="b">Nova Lite</text>
  <text x="1224" y="214" class="b">(route, answer,</text>
  <text x="1224" y="230" class="b">describe figures)</text>
  <text x="1224" y="254" class="b">Amazon Rerank 1.0</text>
  <text x="1224" y="278" class="b">pay per call,</text>
  <text x="1224" y="294" class="b">nothing hosted</text>
  <path d="M1180,172 L1208,172" class="dash"/>

  <!-- embedder down to Neon -->
  <path d="M1090,232 L1090,352 L800,352 L800,386" class="ln" marker-end="url(#arr)"/>
  <text x="960" y="346" class="lbl">replace the paper's rows</text>

  <!-- ============ STORES ============ -->
  <text x="36" y="372" class="band">STORES</text>

  <rect x="36" y="388" width="800" height="150" rx="8" class="db"/>
  <text x="50" y="410" class="t">Neon Postgres 18 + pgvector (source of truth)</text>
  <text x="50" y="434" class="m">rag_documents</text>
  <text x="170" y="434" class="b">203 papers: title, arXiv id, authors, dates, abstract, categories</text>
  <text x="50" y="456" class="m">rag_chunks</text>
  <text x="170" y="456" class="b">13,142 chunks (incl. 2,112 figures): content, page, vector(1024) HNSW,</text>
  <text x="170" y="473" class="b">tsv GIN, image (S3 key of a figure's PNG)</text>
  <text x="50" y="495" class="m">rag_terms</text>
  <text x="170" y="495" class="b">BM25 inverted index, filled by a trigger</text>
  <text x="50" y="524" class="b">Connection string in SSM · one reused connection per Lambda · backups to S3 (scripts/backup_db.sh)</text>

  <path d="M836,462 L900,462" class="ln" marker-end="url(#arr)"/>
  <text x="840" y="452" class="lbl">copy, no</text>
  <text x="840" y="478" class="lbl">re-embed</text>

  <rect x="902" y="388" width="468" height="150" rx="8" class="ext"/>
  <text x="916" y="410" class="t">Weaviate Cloud sandbox (comparison copy)</text>
  <text x="916" y="434" class="b">Chunk collection: same text + vectors (pg_id = rag_chunks.id)</text>
  <text x="916" y="454" class="b">native BM25 + hybrid (alpha, fusion), us-east-1</text>
  <text x="916" y="474" class="b">filled from Neon by scripts/load_weaviate.py (~3 min)</text>
  <text x="916" y="500" class="b">optional: the chat's default engine is Postgres</text>
  <text x="916" y="520" class="b">sandbox expires ~14 days after creation</text>

  <!-- ============ QUERY ============ -->
  <text x="36" y="578" class="band">QUERY · public Lambda Function URL</text>

  <rect x="36" y="594" width="230" height="392" rx="8" class="ui"/>
  <text x="50" y="616" class="t">Browser pages</text>
  <text x="50" y="642" class="m">/chat</text>
  <text x="50" y="658" class="b">chatbot over all papers,</text>
  <text x="50" y="674" class="b">figure thumbnails, tables</text>
  <text x="50" y="690" class="b">rendered as HTML</text>
  <text x="50" y="716" class="m">/</text>
  <text x="50" y="732" class="b">retrieval lab (one paper)</text>
  <text x="50" y="758" class="m">/backends</text>
  <text x="50" y="774" class="b">Postgres vs Weaviate</text>
  <text x="50" y="800" class="m">/docs</text>
  <text x="50" y="816" class="b">Swagger UI (REST)</text>
  <text x="50" y="850" class="b">X-API-Key on /api/*</text>
  <text x="50" y="866" class="b">(in-page key dialog)</text>
  <text x="50" y="890" class="b">pages sent no-cache</text>
  <text x="50" y="914" class="b">session id,</text>
  <text x="50" y="930" class="b">thumbs up/down</text>

  <path d="M266,700 L300,700" class="ln" marker-end="url(#arr)"/>

  <rect x="302" y="594" width="1068" height="392" rx="10" class="frame"/>
  <text x="318" y="616" class="t">QueryApi λ · FastAPI + Mangum (query/)</text>

  <!-- router -->
  <rect x="318" y="640" width="200" height="92" rx="8" class="ai"/>
  <text x="332" y="662" class="t">Router</text>
  <text x="332" y="682" class="b">Nova Lite → JSON</text>
  <text x="332" y="699" class="b">list | find | content</text>
  <text x="332" y="716" class="b">+ filters, search query</text>

  <path d="M418,732 L418,776" class="ln" marker-end="url(#arr)"/>
  <text x="424" y="758" class="lbl">list / find</text>

  <rect x="318" y="778" width="200" height="92" rx="8" class="py"/>
  <text x="332" y="800" class="t">Library answer (SQL)</text>
  <text x="332" y="820" class="b">by author, year, category,</text>
  <text x="332" y="837" class="b">title, topic; exact list,</text>
  <text x="332" y="854" class="b">no LLM, ~0.75 s</text>

  <path d="M518,686 L570,686" class="ln" marker-end="url(#arr)"/>
  <text x="523" y="678" class="lbl">content</text>

  <!-- retrieve -->
  <rect x="572" y="640" width="226" height="92" rx="8" class="py"/>
  <text x="586" y="662" class="t">Retrieve (top 50)</text>
  <text x="586" y="682" class="b">BM25 in SQL + pgvector,</text>
  <text x="586" y="699" class="b">reciprocal-rank fusion;</text>
  <text x="586" y="716" class="b">or Weaviate hybrid</text>
  <path d="M640,640 L640,540" class="dash" marker-end="url(#arr)"/>
  <path d="M760,640 L760,600 L1100,600 L1100,540" class="dash" marker-end="url(#arr)"/>

  <path d="M798,686 L834,686" class="ln" marker-end="url(#arr)"/>

  <rect x="836" y="640" width="160" height="92" rx="8" class="ai"/>
  <text x="850" y="662" class="t">Amazon Rerank</text>
  <text x="850" y="682" class="b">50 candidates</text>
  <text x="850" y="699" class="b">→ top 6 sources</text>

  <path d="M996,686 L1032,686" class="ln" marker-end="url(#arr)"/>

  <rect x="1034" y="640" width="320" height="92" rx="8" class="ai"/>
  <text x="1048" y="662" class="t">Answer · Nova Lite</text>
  <text x="1048" y="682" class="b">only from the numbered sources, cited [1][2]</text>
  <text x="1048" y="699" class="b">earlier turns as history (1,500 chars each)</text>
  <text x="1048" y="716" class="b">~2.4–3.9 s per content answer</text>

  <path d="M1194,732 L1194,776" class="ln" marker-end="url(#arr)"/>

  <rect x="1034" y="778" width="320" height="92" rx="8" class="aws"/>
  <text x="1048" y="800" class="t">Figure sources → thumbnails</text>
  <text x="1048" y="820" class="b">rag_chunks.image for the chosen sources</text>
  <text x="1048" y="837" class="b">→ presigned S3 URL (1 hour), shown under</text>
  <text x="1048" y="854" class="b">the answer; click for the full-size PNG</text>

  <!-- side services -->
  <rect x="558" y="778" width="240" height="92" rx="8" class="ext"/>
  <text x="572" y="800" class="t">Langfuse (EU)</text>
  <text x="572" y="820" class="b">traces per turn: route, retrieve,</text>
  <text x="572" y="837" class="b">rerank, answer; token costs;</text>
  <text x="572" y="854" class="b">thumbs up/down feedback</text>

  <rect x="836" y="778" width="160" height="92" rx="8" class="aws"/>
  <text x="850" y="800" class="t">SSM Parameters</text>
  <text x="850" y="820" class="b">database URL, API key,</text>
  <text x="850" y="837" class="b">Langfuse, Weaviate</text>
  <text x="850" y="854" class="b">(read at cold start)</text>

  <text x="318" y="906" class="t">Quality checks</text>
  <text x="318" y="928" class="b">evals/: 62 questions (fact, paraphrase, table, figure) against the live stack. Chatbot setup: hit@1 0.77 · hit@5 0.95 · MRR 0.85;</text>
  <text x="318" y="946" class="b">answer checks for table values and figure-only details. tests/: 43 unit tests, no AWS needed, run in CI (aws-rag job).</text>
  <text x="318" y="970" class="b">Details and numbers: README "Retrieval eval", "Tables: Docling pilot", "Figures: descriptions with Nova Lite".</text>

  <!-- legend -->
  <g transform="translate(36,1012)">
    <rect x="0" y="0" width="14" height="14" rx="3" class="py"/><text x="20" y="11" class="b">our Python (laptop or Lambda code)</text>
    <rect x="250" y="0" width="14" height="14" rx="3" class="aws"/><text x="270" y="11" class="b">AWS service</text>
    <rect x="380" y="0" width="14" height="14" rx="3" class="ai"/><text x="400" y="11" class="b">model call (Bedrock)</text>
    <rect x="550" y="0" width="14" height="14" rx="3" class="db"/><text x="570" y="11" class="b">database</text>
    <rect x="660" y="0" width="14" height="14" rx="3" class="ext"/><text x="680" y="11" class="b">external service</text>
    <path d="M820,7 L860,7" class="dash"/><text x="868" y="11" class="b">reads / optional</text>
    <path d="M990,7 L1030,7" class="ln" marker-end="url(#arr)"/><text x="1038" y="11" class="b">data flow</text>
  </g>
  <text x="36" y="1062" class="b">Updated 2026-09-29.</text>
</svg>
