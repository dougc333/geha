AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: RAG on AWS - PDF chunker and embedder (S3 -> SQS -> Lambda -> Postgres/pgvector) plus query API and UI (Lambda Function URL), models on Amazon Bedrock

Parameters:
  DatabaseUrlParameter:
    Type: String
    Default: /rag-demo/database-url
    AllowedPattern: "^/.*"
    Description: SSM Parameter Store SecureString holding the Postgres connection string (name starts with /)
  EmbeddingModel:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: Bedrock Titan text embedding model; used by both the embedder and the query API
  EmbeddingDimensions:
    Type: Number
    Default: 1024
    AllowedValues: [256, 512, 1024]
    Description: Titan v2 output size; must match vector(N) in schema.sql
  RerankModel:
    Type: String
    Default: amazon.rerank-v1:0
    Description: Bedrock reranking model ID
  GenerationModel:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Any Bedrock Converse model ID, e.g. us.amazon.nova-2-lite-v1:0, openai.gpt-oss-120b-1:0

Resources:
  # Names are fixed (not generated) so the queue policy can reference the raw
  # bucket's ARN without a circular dependency on the bucket's notification.
  RawBucket:
    Type: AWS::S3::Bucket
    DependsOn: ChunkQueuePolicy
    Properties:
      BucketName: !Sub "${AWS::StackName}-raw-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt ChunkQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - { Name: suffix, Value: .pdf }

  ChunkBucket:
    Type: AWS::S3::Bucket
    DependsOn: EmbedQueuePolicy
    Properties:
      BucketName: !Sub "${AWS::StackName}-chunks-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt EmbedQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: chunks/ }
                  - { Name: suffix, Value: .jsonl }

  ChunkQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 960            # longer than the Lambda timeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ChunkDLQ.Arn
        maxReceiveCount: 3

  ChunkDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600   # 14 days

  ChunkQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref ChunkQueue]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt ChunkQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:aws:s3:::${AWS::StackName}-raw-${AWS::AccountId}"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  Chunker:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: handler.handler
      CodeUri: chunker/                 # handler.py, rag_core.py, requirements.txt (pymupdf)
      MemorySize: 2048
      Timeout: 900
      EphemeralStorage: { Size: 2048 }
      Environment:
        Variables:
          OUT_BUCKET: !Ref ChunkBucket
      Policies:
        - S3ReadPolicy: { BucketName: !Sub "${AWS::StackName}-raw-${AWS::AccountId}" }
        - S3CrudPolicy: { BucketName: !Ref ChunkBucket }
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt ChunkQueue.Arn
            BatchSize: 5
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig: { MaximumConcurrency: 10 }

  EmbedQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 1800           # 6x the Lambda timeout, per AWS guidance for SQS sources
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EmbedDLQ.Arn
        maxReceiveCount: 3

  EmbedDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600   # 14 days

  EmbedQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref EmbedQueue]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt EmbedQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:aws:s3:::${AWS::StackName}-chunks-${AWS::AccountId}"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  Embedder:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: handler.handler
      CodeUri: embedder/                # handler.py, requirements.txt (psycopg, pgvector)
      MemorySize: 512
      Timeout: 300
      Environment:
        Variables:
          DATABASE_URL_PARAMETER: !Ref DatabaseUrlParameter
          EMBEDDING_MODEL: !Ref EmbeddingModel
          EMBEDDING_DIMENSIONS: !Ref EmbeddingDimensions
      Policies:
        - S3ReadPolicy: { BucketName: !Sub "${AWS::StackName}-chunks-${AWS::AccountId}" }
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter   # SecureString under the AWS-managed aws/ssm key
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlParameter}"
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:   # a "us." inference profile routes to the model in any US region
                - "arn:aws:bedrock:*::foundation-model/*"
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt EmbedQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig: { MaximumConcurrency: 2 }   # protects DB connections and Bedrock quotas

  # Query API + UI: FastAPI behind a public Function URL.
  QueryApi:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: lambda_function.handler
      CodeUri: query/                   # lambda_function.py, app.py, rag_core.py, index.html
      MemorySize: 1024
      Timeout: 120                      # embed + rerank + answer are three Bedrock calls
      Environment:
        Variables:
          DATABASE_URL_PARAMETER: !Ref DatabaseUrlParameter
          EMBEDDING_MODEL: !Ref EmbeddingModel
          EMBEDDING_DIMENSIONS: !Ref EmbeddingDimensions
          RERANK_MODEL: !Ref RerankModel
          GENERATION_MODEL: !Ref GenerationModel
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter   # SecureString under the AWS-managed aws/ssm key
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlParameter}"
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - "arn:aws:bedrock:*::foundation-model/*"
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
            - Effect: Allow
              Action: bedrock:Rerank    # does not support resource-level permissions
              Resource: "*"
      FunctionUrlConfig:
        AuthType: NONE                  # public

Outputs:
  RawBucketName:
    Value: !Ref RawBucket
  ChunkBucketName:
    Value: !Ref ChunkBucket
  ChunkQueueUrl:
    Value: !Ref ChunkQueue
  DeadLetterQueueUrl:
    Value: !Ref ChunkDLQ
  ChunkerFunctionName:
    Value: !Ref Chunker
  EmbedQueueUrl:
    Value: !Ref EmbedQueue
  EmbedDeadLetterQueueUrl:
    Value: !Ref EmbedDLQ
  EmbedderFunctionName:
    Value: !Ref Embedder
  QueryUrl:
    Description: Open in a browser for the RAG UI
    Value: !GetAtt QueryApiUrl.FunctionUrl
  QueryFunctionName:
    Value: !Ref QueryApi
