AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: RAG on AWS - PDF chunker and embedder (S3 -> SQS -> Lambda -> Postgres/pgvector) plus query API and UI (Lambda Function URL), models on Amazon Bedrock

Parameters:
  DatabaseUrlParameter:
    Type: String
    Default: /rag-demo/database-url
    AllowedPattern: "^/.*"
    Description: SSM Parameter Store SecureString holding the Postgres connection string (name starts with /)
  EmbeddingModel:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: Bedrock Titan text embedding model; used by both the embedder and the query API
  EmbeddingDimensions:
    Type: Number
    Default: 1024
    AllowedValues: [256, 512, 1024]
    Description: Titan v2 output size; must match vector(N) in schema.sql
  RerankModel:
    Type: String
    Default: amazon.rerank-v1:0
    Description: Bedrock reranking model ID
  GenerationModel:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Any Bedrock Converse model ID, e.g. us.amazon.nova-2-lite-v1:0, openai.gpt-oss-120b-1:0

  LangfuseBaseUrl:
    Type: String
    Default: https://cloud.langfuse.com
    Description: Langfuse region (EU https://cloud.langfuse.com, US https://us.cloud.langfuse.com) or self-hosted URL
  LangfusePublicKeyParameter:
    Type: String
    Default: /rag-demo/langfuse-public-key
    Description: SSM parameter with the Langfuse public key (tracing is off if it doesn't exist)
  LangfuseSecretKeyParameter:
    Type: String
    Default: /rag-demo/langfuse-secret-key
    Description: SSM SecureString with the Langfuse secret key
  WeaviateUrlParameter:
    Type: String
    Default: /rag-demo/weaviate-url
    Description: SSM parameter with the Weaviate REST URL (comparison backend; optional)
  ApiKeyParameter:
    Type: String
    Default: /rag-demo/api-key
    Description: SSM SecureString with the shared access key required on /api/* (X-API-Key)
  SignupHashKeyParameter:
    Type: String
    Default: /rag-demo/signup-hash-key
    Description: SSM SecureString used only to pseudonymize member subjects in Langfuse
  SignupDocumentIds:
    Type: String
    Default: ""
    Description: Comma-separated fallback RAG document IDs for signup benefits questions
  RequireValidatedSidecar:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Reject newly uploaded PDFs unless a SHA-bound, visually matched text sidecar exists
  SignupAuthRequired:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Require JWT claims from an upstream API Gateway authorizer for signup APIs
  GuardMode:
    Type: String
    Default: "monitor"
    AllowedValues: ["enforce", "monitor", "off"]
    Description: /api/chat safety guard (query/guard.py). monitor records verdicts in Langfuse without blocking
  WeaviateApiKeyParameter:
    Type: String
    Default: /rag-demo/weaviate-api-key
    Description: SSM SecureString with the Weaviate API key
  AlertEmailParameter:
    Type: String
    Default: /rag-demo/alert-email
    Description: SSM String with the email for alarm and budget alerts (kept out of this public repo)
  MonthlyBudgetUsd:
    Type: Number
    Default: 10
    Description: Monthly AWS cost budget; email at 80% of actual and 100% of forecast spend
  QueryConcurrency:
    Type: Number
    Default: 10
    Description: Reserved (maximum) concurrent QueryApi executions; caps Bedrock spend if the API key leaks
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]
    Description: CloudWatch Logs retention for the three functions

Resources:
  # Names are fixed (not generated) so the queue policy can reference the raw
  # bucket's ARN without a circular dependency on the bucket's notification.
  RawBucket:
    Type: AWS::S3::Bucket
    DependsOn: ChunkQueuePolicy
    Properties:
      BucketName: !Sub "${AWS::StackName}-raw-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt ChunkQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - { Name: suffix, Value: .pdf }

  ChunkBucket:
    Type: AWS::S3::Bucket
    DependsOn: EmbedQueuePolicy
    Properties:
      BucketName: !Sub "${AWS::StackName}-chunks-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt EmbedQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: chunks/ }
                  - { Name: suffix, Value: .jsonl }

  ChunkQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 960            # longer than the Lambda timeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ChunkDLQ.Arn
        maxReceiveCount: 3

  ChunkDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600   # 14 days

  ChunkQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref ChunkQueue]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt ChunkQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:aws:s3:::${AWS::StackName}-raw-${AWS::AccountId}"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  Chunker:
    Type: AWS::Serverless::Function
    Properties:
      LoggingConfig:
        LogGroup: !Ref ChunkerLogs
      Runtime: python3.12
      Handler: handler.handler
      CodeUri: chunker/                 # handler.py, rag_core.py, requirements.txt (pymupdf)
      MemorySize: 2048
      Timeout: 900
      EphemeralStorage: { Size: 2048 }
      Environment:
        Variables:
          OUT_BUCKET: !Ref ChunkBucket
          REQUIRE_VALIDATED_SIDECAR: !Ref RequireValidatedSidecar
      Policies:
        - S3ReadPolicy: { BucketName: !Sub "${AWS::StackName}-raw-${AWS::AccountId}" }
        - S3CrudPolicy: { BucketName: !Ref ChunkBucket }
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt ChunkQueue.Arn
            BatchSize: 5
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig: { MaximumConcurrency: 10 }

  EmbedQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 1800           # 6x the Lambda timeout, per AWS guidance for SQS sources
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EmbedDLQ.Arn
        maxReceiveCount: 3

  EmbedDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600   # 14 days

  EmbedQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref EmbedQueue]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt EmbedQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:aws:s3:::${AWS::StackName}-chunks-${AWS::AccountId}"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  Embedder:
    Type: AWS::Serverless::Function
    Properties:
      LoggingConfig:
        LogGroup: !Ref EmbedderLogs
      Runtime: python3.12
      Handler: handler.handler
      CodeUri: embedder/                # handler.py, requirements.txt (psycopg, pgvector)
      MemorySize: 512
      Timeout: 300
      Environment:
        Variables:
          DATABASE_URL_PARAMETER: !Ref DatabaseUrlParameter
          EMBEDDING_MODEL: !Ref EmbeddingModel
          EMBEDDING_DIMENSIONS: !Ref EmbeddingDimensions
      Policies:
        - S3ReadPolicy: { BucketName: !Sub "${AWS::StackName}-chunks-${AWS::AccountId}" }
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter   # SecureString under the AWS-managed aws/ssm key
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlParameter}"
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:   # a "us." inference profile routes to the model in any US region
                - "arn:aws:bedrock:*::foundation-model/*"
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt EmbedQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig: { MaximumConcurrency: 2 }   # protects DB connections and Bedrock quotas

  # Query API + UI: FastAPI behind a public Function URL.
  QueryApi:
    Type: AWS::Serverless::Function
    Properties:
      LoggingConfig:
        LogGroup: !Ref QueryApiLogs
      Runtime: python3.12
      Handler: lambda_function.handler
      CodeUri: query/                   # lambda_function.py, app.py, rag_core.py, index.html
      MemorySize: 1024
      Timeout: 120                      # embed + rerank + answer are three Bedrock calls
      ReservedConcurrentExecutions: !Ref QueryConcurrency  # hard cap on parallel requests
      Environment:
        Variables:
          DATABASE_URL_PARAMETER: !Ref DatabaseUrlParameter
          EMBEDDING_MODEL: !Ref EmbeddingModel
          EMBEDDING_DIMENSIONS: !Ref EmbeddingDimensions
          RERANK_MODEL: !Ref RerankModel
          GENERATION_MODEL: !Ref GenerationModel
          RAW_BUCKET: !Ref RawBucket    # /api/arxiv drops PDFs here for the chunker
          CHUNK_BUCKET: !Ref ChunkBucket  # figure thumbnails (figures/*), via presigned URLs
          LANGFUSE_BASE_URL: !Ref LangfuseBaseUrl
          LANGFUSE_PUBLIC_KEY_PARAMETER: !Ref LangfusePublicKeyParameter
          LANGFUSE_SECRET_KEY_PARAMETER: !Ref LangfuseSecretKeyParameter
          SIGNUP_HASH_KEY_PARAMETER: !Ref SignupHashKeyParameter
          SIGNUP_DOCUMENT_IDS: !Ref SignupDocumentIds
          SIGNUP_AUTH_REQUIRED: !Ref SignupAuthRequired
          WEAVIATE_URL_PARAMETER: !Ref WeaviateUrlParameter
          WEAVIATE_API_KEY_PARAMETER: !Ref WeaviateApiKeyParameter
          API_KEY_PARAMETER: !Ref ApiKeyParameter
          GUARD_MODE: !Ref GuardMode
          ARXIV_MAX_MB: "25"
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameters   # SecureStrings under the AWS-managed aws/ssm key
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlParameter}"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${LangfusePublicKeyParameter}"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${LangfuseSecretKeyParameter}"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${WeaviateUrlParameter}"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${WeaviateApiKeyParameter}"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiKeyParameter}"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SignupHashKeyParameter}"
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - "arn:aws:bedrock:*::foundation-model/*"
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
            - Effect: Allow
              Action: bedrock:Rerank    # does not support resource-level permissions
              Resource: "*"
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject]   # GetObject also covers HeadObject
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-raw-${AWS::AccountId}/arxiv/*"
            - Effect: Allow
              Action: s3:ListBucket   # makes HeadObject return 404, not 403, for new papers
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-raw-${AWS::AccountId}"
            - Effect: Allow
              Action: s3:GetObject    # figure images, served to the browser by presigned URL
              Resource: !Sub "arn:aws:s3:::${ChunkBucket}/figures/*"
      FunctionUrlConfig:
        AuthType: NONE                  # public

  # ---- Monitoring and cost controls ----
  ChunkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}/chunker"
      RetentionInDays: !Ref LogRetentionDays
  EmbedderLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}/embedder"
      RetentionInDays: !Ref LogRetentionDays
  QueryApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}/query-api"
      RetentionInDays: !Ref LogRetentionDays

  AlertTopic:
    Type: AWS::SNS::Topic
  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email                   # AWS emails a confirmation link; alarms deliver once it is clicked
      Endpoint: !Sub "{{resolve:ssm:${AlertEmailParameter}}}"

  QueryApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: QueryApi returned unhandled errors (5xx) in the last 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref QueryApi }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  QueryApiThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: QueryApi hit its reserved concurrency (QueryConcurrency) and rejected requests
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{ Name: FunctionName, Value: !Ref QueryApi }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  QueryApiSlowAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: QueryApi p95 duration above 60 s (timeout is 120 s) for 10 minutes
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions: [{ Name: FunctionName, Value: !Ref QueryApi }]
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 60000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  ChunkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Chunker invocations failed (messages are retried, then go to ChunkDLQ)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref Chunker }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  EmbedderErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Embedder invocations failed (messages are retried, then go to EmbedDLQ)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref Embedder }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  ChunkDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A PDF failed chunking 3 times and is in ChunkDLQ (see README "Failures")
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt ChunkDLQ.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  EmbedDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A chunk file failed embedding 3 times and is in EmbedDLQ (see README "Failures")
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt EmbedDLQ.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  CostBudget:
    Type: AWS::Budgets::Budget      # account-wide: covers all AWS spend, not only this stack
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Sub "{{resolve:ssm:${AlertEmailParameter}}}" }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Sub "{{resolve:ssm:${AlertEmailParameter}}}" }]

Outputs:
  RawBucketName:
    Value: !Ref RawBucket
  ChunkBucketName:
    Value: !Ref ChunkBucket
  ChunkQueueUrl:
    Value: !Ref ChunkQueue
  DeadLetterQueueUrl:
    Value: !Ref ChunkDLQ
  ChunkerFunctionName:
    Value: !Ref Chunker
  EmbedQueueUrl:
    Value: !Ref EmbedQueue
  EmbedDeadLetterQueueUrl:
    Value: !Ref EmbedDLQ
  EmbedderFunctionName:
    Value: !Ref Embedder
  ChatUrl:
    Description: Open in a browser for the paper chatbot
    Value: !Sub "${QueryApiUrl.FunctionUrl}chat"
  SignupUrl:
    Description: Open in a browser for the guided dental signup chatbot
    Value: !Sub "${QueryApiUrl.FunctionUrl}signup"
  QueryUrl:
    Description: Open in a browser for the RAG UI
    Value: !GetAtt QueryApiUrl.FunctionUrl
  AlertTopicArn:
    Value: !Ref AlertTopic
  QueryFunctionName:
    Value: !Ref QueryApi
