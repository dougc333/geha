<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Paper Chat</title>
  <style>
    :root{--ink:#10233e;--muted:#607086;--line:#dce4ec;--paper:#fff;--bg:#eef3f7;--navy:#062f4f;--cyan:#13a8a8;--user:#e3f1f4}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
    header{padding:22px clamp(20px,5vw,72px);background:linear-gradient(125deg,#052c4d,#0b5270);color:white;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
    header h1{margin:0;font-size:clamp(26px,3.5vw,40px);letter-spacing:-.04em} header p{margin:6px 0 0;color:#d8ecf2;max-width:720px} header a{color:#bfe9ee;font-weight:600}
    main{display:grid;grid-template-columns:minmax(260px,320px) 1fr;gap:22px;max-width:1300px;margin:22px auto;padding:0 20px 24px}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 25px rgba(24,49,75,.06)}
    aside{padding:20px;height:max-content;position:sticky;top:18px} h2{font-size:16px;margin:0 0 10px}
    .papers{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:44vh;overflow:auto}
    .papers li{font-size:13px;padding:8px 10px;border:1px solid #edf1f4;border-radius:9px}.papers .meta{color:var(--muted);font-size:12px}
    .add{margin-top:18px;padding-top:16px;border-top:1px solid #edf1f4}.add .row{display:flex;gap:6px}
    input,textarea{border:1px solid #bcc9d5;border-radius:9px;padding:10px;background:white;color:var(--ink);font:inherit}input{flex:1;min-width:0}
    button{border:0;border-radius:9px;background:var(--cyan);color:white;font-weight:800;padding:10px 14px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
    .status{font-size:12px;color:var(--muted);margin-top:8px;min-height:18px}.status.err{color:#9b2424}
    .chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:480px}
    .log{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
    .msg{max-width:88%;padding:12px 16px;border-radius:14px;white-space:pre-wrap}
    .msg.user{align-self:flex-end;background:var(--user)}.msg.bot{align-self:flex-start;border:1px solid var(--line);background:#fbfdfe}
    .figs{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;white-space:normal}
    .figcard{margin:0;flex:0 1 260px;min-width:0;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px}
    .figcard img{display:block;width:100%;max-height:220px;object-fit:contain}
    .figcard figcaption{font-size:12px;color:#475569;margin-top:6px}
    .fig{display:block;max-width:100%;max-height:260px;margin:8px 0;border:1px solid var(--line);border-radius:8px;background:#fff}
    .tbl{overflow-x:auto;margin:8px 0 12px;white-space:normal}
    .tbl table{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
    .tbl th,.tbl td{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
    .tbl th{background:#eef3f7;font-weight:600}.tbl tbody tr:nth-child(even){background:#f7fafc}
    .msg.bot.err{border-color:#efcaca;background:#fff1f1;color:#9b2424}
    .cite{color:var(--cyan);font-weight:700;text-decoration:none;font-size:12px;vertical-align:super}
    details{margin-top:10px;font-size:13px;white-space:normal}summary{cursor:pointer;color:var(--muted)}
    .src{margin-top:8px;padding:8px 10px;border-left:3px solid var(--cyan);background:#f4f9fa;border-radius:6px}.src:target{background:#fff6e2}
    .src b{display:block}.src .meta{color:var(--muted);font-size:12px}.src .snip{margin-top:4px;color:#33475e}
    .timing{font-size:11px;color:var(--muted);margin-top:6px;white-space:normal}
    .composer{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line)}.composer textarea{flex:1;resize:none;height:52px}
    .empty{color:var(--muted);margin:auto;text-align:center;max-width:420px}.empty em{color:var(--ink)}
    ol.lib{margin:8px 0 0;padding-left:22px;white-space:normal}ol.lib li{margin:2px 0}ol.lib a{color:var(--ink)}
    .fb{margin-top:8px;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);white-space:normal}.fb button{background:none;border:1px solid var(--line);color:var(--ink);padding:3px 9px;font-weight:400;border-radius:999px}.fb button:hover{background:#eef5f7}
    @media(max-width:820px){main{grid-template-columns:1fr}aside{position:static}.chat{height:70vh}}
  </style>
</head>
<body>
  <header>
    <div><h1>Paper Chat</h1><p>Ask questions across every indexed arXiv paper. Answers cite the passages they came from.</p></div>
    <a href="/">Retrieval lab →</a>
  </header>
  <main>
    <aside class="card">
      <h2>Papers</h2>
      <ul class="papers" id="papers"><li class="meta">Loading…</li></ul>
      <div class="add">
        <h2>Search engine</h2>
        <select id="backend" style="width:100%;border:1px solid #bcc9d5;border-radius:9px;padding:9px;font:inherit"><option value="postgres">Postgres (full-text + pgvector + RRF)</option><option value="weaviate">Weaviate (hybrid)</option></select>
        <div class="status"><a href="/backends">Compare the two side by side →</a></div>
      </div>
      <div class="add">
        <h2>Add an arXiv paper</h2>
        <div class="row"><input id="arxiv" placeholder="2305.14314 or arxiv.org link" aria-label="arXiv ID or link"><button id="addBtn">Add</button></div>
        <div class="status" id="addStatus"></div>
      </div>
    </aside>
    <section class="card chat">
      <div class="log" id="log"><div class="empty" id="empty">Try <em>what is orca?</em> then a follow-up like <em>how was it evaluated?</em></div></div>
      <form class="composer" id="composer">
        <textarea id="input" placeholder="Ask about the papers…  (Enter to send, Shift+Enter for a new line)" aria-label="Message" maxlength="4000"></textarea>
        <button id="send">Send</button>
      </form>
    </section>
  </main>
  <script>
    // Access key: add X-API-Key to /api/ calls; ask once on 401 (in-page dialog) and remember it.
    (()=>{const send=window.fetch.bind(window),K='ragApiKey';
      let mem='',asking=null;
      const load=()=>{try{return localStorage.getItem(K)||mem}catch{return mem}};
      const save=v=>{mem=v;try{localStorage.setItem(K,v)}catch{}};
      // In-page dialog: some browsers (embedded panes) block window.prompt().
      const ask=()=>asking||(asking=new Promise(done=>{
        const d=document.createElement('div');
        d.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.55)';
        d.innerHTML='<form style="background:#fff;color:#0f172a;padding:24px;border-radius:12px;width:min(360px,calc(100% - 32px));font:15px system-ui,sans-serif">'
          +'<label style="display:block;font-weight:600;margin-bottom:10px">This demo needs an access key</label>'
          +'<input type="password" autocomplete="off" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit">'
          +'<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button type="button" style="padding:8px 14px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#0f172a;font:inherit;font-weight:600;cursor:pointer">Cancel</button>'
          +'<button type="submit" style="padding:8px 14px;border:0;border-radius:8px;background:#4fa6a6;color:#fff;font:inherit;font-weight:600;cursor:pointer">Save</button></div></form>';
        const input=d.querySelector('input'),finish=v=>{d.remove();asking=null;done(v)};
        d.querySelector('form').onsubmit=e=>{e.preventDefault();finish(input.value.trim())};
        d.querySelector('button[type=button]').onclick=()=>finish('');
        document.body.appendChild(d);input.focus();
      }));
      window.fetch=async(url,opts={})=>{
        if(!String(url).startsWith('/api/'))return send(url,opts);
        for(let tries=0;;tries++){
          const headers=new Headers(opts.headers||{});const key=load();if(key)headers.set('X-API-Key',key);
          const r=await send(url,{...opts,headers});
          if(r.status!==401||tries)return r;
          const entered=await ask();if(!entered)return r;save(entered);
        }};})();
    const $=id=>document.getElementById(id);
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const history=[]; let turn=0;
    const sessionId=crypto.randomUUID(); // one Langfuse session per page load

    async function loadPapers(){
      try{
        const r=await fetch('/api/documents'); const d=await r.json(); if(!r.ok)throw new Error(d.detail||r.statusText);
        const byline=p=>{const a=p.authors||[];return [a.length?a[0]+(a.length>1?' et al.':''):null,p.published?.slice(0,4)].filter(Boolean).join(' · ')};
        $('papers').innerHTML=d.documents.map(p=>`<li>${esc(p.title)}<div class="meta">${esc(byline(p))}${byline(p)?' · ':''}${p.chunks} chunks</div></li>`).join('')||'<li class="meta">No papers yet. Add one below.</li>';
        return d.documents;
      }catch(e){$('papers').innerHTML=`<li class="meta">Couldn't load papers: ${esc(e.message)}</li>`;return []}
    }

    function addMessage(cls,html){
      $('empty')?.remove();
      const div=document.createElement('div'); div.className='msg '+cls; div.innerHTML=html;
      $('log').appendChild(div); $('log').scrollTop=$('log').scrollHeight; return div;
    }

    // Minimal Markdown for answers (input already escaped): pipe tables and **bold**.
    function md(text){
      const lines=text.split('\n'),out=[];
      const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      for(let i=0;i<lines.length;){
        if(!/^\s*\|.*\|\s*$/.test(lines[i])){out.push(lines[i++]);continue}
        const rows=[];while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i]))rows.push(cells(lines[i++]));
        const sep=rows.findIndex(r=>r.every(c=>/^:?-{2,}:?$/.test(c)));
        const head=sep===1?rows[0]:null,body=rows.filter((_,k)=>k!==sep&&!(head&&k===0));
        const tr=(r,tag)=>'<tr>'+r.map(c=>`<${tag}>${c}</${tag}>`).join('')+'</tr>';
        out.push('<div class="tbl"><table>'+(head?'<thead>'+tr(head,'th')+'</thead>':'')+'<tbody>'+body.map(r=>tr(r,'td')).join('')+'</tbody></table></div>');
      }
      // Join with newlines except around tables (the bubble uses pre-wrap).
      return out.reduce((a,l,k)=>a+(k&&!l.startsWith('<div class="tbl">')&&!out[k-1].startsWith('<div class="tbl">')?'\n':'')+l,'')
        .replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
    }

    function renderAnswer(d,id){
      if(d.route&&d.route!=='content')return renderLibrary(d);
      const body=md(esc(d.answer)).replace(/\[(\d+)\]/g,(m,n)=>d.sources.some(s=>s.n==n)?`<a class="cite" href="#${id}-s${n}">[${n}]</a>`:m);
      const sources=d.sources.map(s=>`<div class="src" id="${id}-s${s.n}"><b>[${s.n}] ${esc(s.title)}</b><span class="meta">page ${esc(s.page??'?')} · chunk ${s.chunk_id}${s.rerank_score!=null?` · rerank ${Number(s.rerank_score).toFixed(3)}`:''}</span>${s.image_url?`<a href="${esc(s.image_url)}" target="_blank" rel="noopener"><img class="fig" src="${esc(s.image_url)}" alt="Figure from ${esc(s.title)}, page ${esc(s.page??'?')}" loading="lazy"></a>`:''}<div class="snip">${esc(s.snippet)}…</div></div>`).join('');
      const t=d.timings, ms=k=>t[k]!=null?`${k.replace('_ms','')} ${Math.round(t[k])}ms`:null;
      const timing=['route_ms','library_ms','keyword_ms','vector_ms','embed_ms','weaviate_ms','rerank_ms','generation_ms','total_ms'].map(ms).filter(Boolean).join(' · ');
      const searched=d.standalone_question!==history.at(-1)?.content?`<div class="timing">Searched for: “${esc(d.standalone_question)}”</div>`:'';
      const fb=d.trace_id?`<div class="fb" data-trace="${esc(d.trace_id)}">Helpful? <button data-helpful="true" aria-label="Helpful">👍</button><button data-helpful="false" aria-label="Not helpful">👎</button></div>`:'';
      const figs=d.sources.filter(s=>s.image_url).map(s=>`<figure class="figcard"><a href="${esc(s.image_url)}" target="_blank" rel="noopener"><img src="${esc(s.image_url)}" alt="Figure from ${esc(s.title)}, page ${esc(s.page??'?')}" loading="lazy"></a><figcaption><a class="cite" href="#${id}-s${s.n}">[${s.n}]</a> ${esc(s.title)}, p. ${esc(s.page??'?')}</figcaption></figure>`).join('');
      return body+(figs?`<div class="figs">${figs}</div>`:'')+(sources?`<details><summary>${d.sources.length} sources</summary>${sources}</details>`:'')+searched+`<div class="timing">${timing}</div>`+fb;
    }

    // Library answers come from SQL: a header line plus one linked item per paper.
    function renderLibrary(d){
      const [header,...rest]=d.answer.split('\n');
      const items=(d.papers||[]).map((p,i)=>{const line=(rest[i]||'').replace(/^\d+\.\s*/,'');
        return `<li>${p.arxiv_id?`<a href="https://arxiv.org/abs/${esc(p.arxiv_id)}" target="_blank" rel="noopener">${esc(line)}</a>`:esc(line)}</li>`}).join('');
      const t=d.timings;
      return `${esc(header)}${items?`<ol class="lib">${items}</ol>`:''}<div class="timing">From the library database (${d.route==='find'?'searched titles and abstracts':'metadata filter'}) · route ${Math.round(t.route_ms)}ms · query ${Math.round(t.library_ms)}ms · total ${Math.round(t.total_ms)}ms</div>`;
    }

    async function send(){
      const text=$('input').value.trim(); if(!text||$('send').disabled)return;
      $('input').value=''; addMessage('user',esc(text));
      history.push({role:'user',content:text});
      const pending=addMessage('bot','Searching the papers…'); $('send').disabled=true;
      try{
        const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history.slice(-20),session_id:sessionId,backend:$('backend').value})});
        const d=await r.json(); if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));
        pending.innerHTML=renderAnswer(d,'m'+(++turn)); history.push({role:'assistant',content:d.answer});
      }catch(e){pending.classList.add('err');pending.textContent='Something went wrong: '+e.message}
      finally{$('send').disabled=false;$('input').focus();$('log').scrollTop=$('log').scrollHeight}
    }

    async function addPaper(){
      const paper=$('arxiv').value.trim(); if(!paper)return;
      const status=$('addStatus'); status.className='status'; status.textContent='Downloading from arXiv…'; $('addBtn').disabled=true;
      try{
        const r=await fetch('/api/arxiv',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paper})});
        const d=await r.json(); if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:'Invalid input');
        $('arxiv').value='';
        if(d.status==='exists'){status.textContent=`Already added: ${d.title}`;return}
        status.textContent=`Indexing “${d.title}”…`;
        for(let i=0;i<30;i++){ // the S3 → chunker → embedder pipeline usually takes ~10 s
          await new Promise(res=>setTimeout(res,3000));
          const docs=await loadPapers();
          if(docs.some(p=>p.title===d.title&&p.chunks>0)){status.textContent=`Ready: ${d.title}`;return}
        }
        status.textContent=`Still indexing “${d.title}”. It will appear in the list when done.`;
      }catch(e){status.className='status err';status.textContent=e.message}
      finally{$('addBtn').disabled=false}
    }

    $('log').addEventListener('click',async e=>{
      const b=e.target.closest('.fb button'); if(!b)return;
      const box=b.parentElement; box.querySelectorAll('button').forEach(x=>x.disabled=true);
      try{
        const r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({trace_id:box.dataset.trace,helpful:b.dataset.helpful==='true'})});
        if(!r.ok)throw new Error();
        box.textContent=b.dataset.helpful==='true'?'Thanks! 👍 recorded':'Thanks! 👎 recorded';
      }catch{box.textContent='Could not record feedback'}
    });
    $('composer').addEventListener('submit',e=>{e.preventDefault();send()});
    $('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
    $('addBtn').addEventListener('click',addPaper);
    $('arxiv').addEventListener('keydown',e=>{if(e.key==='Enter')addPaper()});
    loadPapers();
  </script>
</body>
</html>
