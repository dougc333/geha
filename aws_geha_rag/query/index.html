<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEHA Validated Document Search</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui;background:#f4f7f5;color:#14251c}body{margin:0}.shell{max-width:920px;margin:0 auto;padding:48px 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.mark{font-weight:800;letter-spacing:.08em;color:#157347}.badge{background:#e3f3e8;color:#176b3a;padding:7px 11px;border-radius:999px;font-size:12px}.card{background:white;border:1px solid #dce7df;border-radius:18px;padding:24px;box-shadow:0 12px 40px #17392312}h1{font-size:32px;margin:0 0 8px}p{color:#51645a}textarea,input,select{box-sizing:border-box;width:100%;border:1px solid #c8d7cd;border-radius:10px;padding:12px;background:#fbfdfb;font:inherit}textarea{min-height:110px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}button{border:0;border-radius:10px;padding:12px 20px;background:#157347;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.answer{margin-top:22px;white-space:pre-wrap;line-height:1.55}.citations{font-size:14px;border-top:1px solid #e4ece7;margin-top:18px;padding-top:14px}.error{color:#a42b2b}
</style></head><body><main class="shell"><header><div class="mark">GEHA · DOCUMENT INTELLIGENCE</div><div class="badge">Validated · BM25 + vector</div></header><section class="card"><h1>Coverage and benefits search</h1><p>Grounded answers from locally verified GEHA policy, medical, and dental documents.</p><input id="key" type="password" placeholder="API key"><div class="row"><select id="category"><option value="">All categories</option><option value="coverage-policy">Coverage policies</option><option value="medical">Medical</option><option value="dental">Dental</option></select><select id="program"><option value="">All programs</option><option>FEHB</option><option>PSHB</option><option>FEDVIP</option><option>all</option></select></div><textarea id="question" placeholder="Ask about a benefit or coverage policy…"></textarea><button id="ask">Search validated documents</button><div id="answer" class="answer"></div><div id="citations" class="citations"></div></section></main><script>
const q=id=>document.getElementById(id);q('ask').onclick=async()=>{q('ask').disabled=true;q('answer').textContent='Searching…';q('citations').textContent='';try{const body={query:q('question').value,category:q('category').value||null,program:q('program').value||null};const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json','x-api-key':q('key').value},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');q('answer').textContent=j.answer;q('citations').innerHTML=j.citations.map(c=>`<div>[${c.number}] ${c.title} · page ${c.page} · ${c.relative_path}</div>`).join('')}catch(e){q('answer').innerHTML=`<span class="error">${e.message}</span>`}finally{q('ask').disabled=false}};
</script></body></html>
