AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: GEHA RAG for locally validated PDF sidecars

Parameters:
  DatabaseUrlParameter:
    Type: String
    Default: /geha-rag/database-url
  ApiKeyParameter:
    Type: String
    Default: /geha-rag/api-key
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
  GenerationModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
  EmbeddingDimensions:
    Type: Number
    Default: 1024
    AllowedValues: [256, 512, 1024]

Resources:
  DocumentBucket:
    Type: AWS::S3::Bucket
    DependsOn: ChunkQueuePolicy
    Properties:
      BucketName: !Sub "${AWS::StackName}-documents-${AWS::AccountId}"
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        EventBridgeConfiguration: { EventBridgeEnabled: true }
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt ChunkQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: validated/ }
                  - { Name: suffix, Value: .pdf }
      LifecycleConfiguration:
        Rules:
          - Id: expire-processing-evidence
            Status: Enabled
            Prefix: runs/
            ExpirationInDays: 90
          - Id: expire-quarantine
            Status: Enabled
            Prefix: quarantine/
            ExpirationInDays: 180

  ChunkBucket:
    Type: AWS::S3::Bucket
    DependsOn: EmbedQueuePolicy
    Properties:
      BucketName: !Sub "${AWS::StackName}-chunks-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt EmbedQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: chunks/ }
                  - { Name: suffix, Value: .jsonl }

  ChunkQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 960
      RedrivePolicy: { deadLetterTargetArn: !GetAtt ChunkDLQ.Arn, maxReceiveCount: 3 }
  ChunkDLQ:
    Type: AWS::SQS::Queue
    Properties: { MessageRetentionPeriod: 1209600 }
  ChunkQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref ChunkQueue]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt ChunkQueue.Arn
            Condition:
              ArnEquals: { aws:SourceArn: !Sub "arn:aws:s3:::${AWS::StackName}-documents-${AWS::AccountId}" }

  Chunker:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: handler.handler
      CodeUri: chunker/
      MemorySize: 512
      Timeout: 120
      Environment: { Variables: { OUT_BUCKET: !Ref ChunkBucket } }
      Policies:
        - S3ReadPolicy: { BucketName: !Ref DocumentBucket }
        - S3WritePolicy: { BucketName: !Ref ChunkBucket }
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt ChunkQueue.Arn
            BatchSize: 5
            FunctionResponseTypes: [ReportBatchItemFailures]

  EmbedQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 1800
      RedrivePolicy: { deadLetterTargetArn: !GetAtt EmbedDLQ.Arn, maxReceiveCount: 3 }
  EmbedDLQ:
    Type: AWS::SQS::Queue
    Properties: { MessageRetentionPeriod: 1209600 }
  EmbedQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref EmbedQueue]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt EmbedQueue.Arn
            Condition:
              ArnEquals: { aws:SourceArn: !Sub "arn:aws:s3:::${AWS::StackName}-chunks-${AWS::AccountId}" }

  Embedder:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: handler.handler
      CodeUri: embedder/
      MemorySize: 1024
      Timeout: 300
      Environment:
        Variables:
          DATABASE_URL_PARAMETER: !Ref DatabaseUrlParameter
          EMBEDDING_MODEL: !Ref EmbeddingModelId
          EMBEDDING_DIMENSIONS: !Ref EmbeddingDimensions
      Policies:
        - S3ReadPolicy: { BucketName: !Ref ChunkBucket }
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlParameter}"
        - Statement: [{ Effect: Allow, Action: bedrock:InvokeModel, Resource: "*" }]
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt EmbedQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]

  QueryApi:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: app.handler
      CodeUri: query/
      MemorySize: 1024
      Timeout: 60
      Environment:
        Variables:
          DATABASE_URL_PARAMETER: !Ref DatabaseUrlParameter
          API_KEY_PARAMETER: !Ref ApiKeyParameter
          EMBEDDING_MODEL: !Ref EmbeddingModelId
          EMBEDDING_DIMENSIONS: !Ref EmbeddingDimensions
          GENERATION_MODEL: !Ref GenerationModelId
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlParameter}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiKeyParameter}"
        - Statement: [{ Effect: Allow, Action: bedrock:InvokeModel, Resource: "*" }]
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowHeaders: [content-type, x-api-key]
          AllowMethods: [GET, POST]

  ChunkDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Validated PDFs failed chunking
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt ChunkDLQ.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold

  EmbedDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Validated chunks failed embedding
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt EmbedDLQ.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold

Outputs:
  DocumentBucketName: { Value: !Ref DocumentBucket }
  ChunkBucketName: { Value: !Ref ChunkBucket }
  QueryUrl: { Value: !GetAtt QueryApiUrl.FunctionUrl }
  ChunkDeadLetterQueueUrl: { Value: !Ref ChunkDLQ }
  EmbedDeadLetterQueueUrl: { Value: !Ref EmbedDLQ }
