services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: geha-pgvector
    environment:
      POSTGRES_DB: geha_rag
      POSTGRES_USER: geha
      POSTGRES_PASSWORD: geha-local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - geha_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geha -d geha_rag"]
      interval: 2s
      timeout: 3s
      retries: 30

  showcase-api:
    build:
      context: ..
      dockerfile: integrated_showcase/Dockerfile
    environment:
      GEHA_RAG_DATABASE_URL: postgresql://geha:geha-local@pgvector:5432/geha_rag
      GEHA_SHOWCASE_DB: /data/checkpoints.sqlite
      GEHA_SHOWCASE_AUDIT: /data/audit.jsonl
      HF_HOME: /data/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - geha_showcase_data:/data
    depends_on:
      pgvector:
        condition: service_healthy
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  geha_pgvector_data:
  geha_showcase_data:
