<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Agentic RAG</title>
  <desc>The question is retrieved with the parent-document retriever and reranker, each passage is graded for relevance, and if none is relevant the query is rewritten and retrieved again, up to two times, before giving up. Otherwise the answer is generated from the original question and checked for grounding; an ungrounded answer is regenerated, up to two tries.</desc>
  <style>
    .bg { fill: #ffffff; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .teal text { fill: #085041; }
    .coral rect { fill: #FAECE7; stroke: #993C1D; }
    .coral text { fill: #712B13; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .gray text { fill: #444441; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .purple text { fill: #3C3489; }
    .purple .ts2 { font-size: 12px; fill: #534AB7; }
    .amber rect { fill: #FAEEDA; stroke: #854F0B; }
    .amber text { fill: #633806; }
    .blue rect { fill: #E6F1FB; stroke: #185FA5; }
    .blue text { fill: #0C447C; }
    .it { font-size: 12px; font-style: italic; }
    .tq { font-size: 13px; font-weight: 500; }
    .sn { font-size: 12px; }
    .blue polygon { fill: #E6F1FB; stroke: #185FA5; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .arr, .fig { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    .fig { stroke: #2C2C2A; stroke-linecap: round; }
    .group { stroke: #888780; stroke-width: 0.75; fill: none; stroke-dasharray: 4 3; }
    .label { font-size: 24px; font-weight: 700; fill: #2C2C2A; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1e1c; }
      .teal rect { fill: #085041; stroke: #5DCAA5; }
      .teal text { fill: #E1F5EE; }
      .coral rect { fill: #712B13; stroke: #F0997B; }
      .coral text { fill: #FAECE7; }
      .gray rect { fill: #444441; stroke: #B4B2A9; }
      .gray text { fill: #F1EFE8; }
      .purple rect { fill: #3C3489; stroke: #AFA9EC; }
      .purple text { fill: #EEEDFE; }
      .purple .ts2 { fill: #CECBF6; }
      .amber rect { fill: #633806; stroke: #EF9F27; }
      .amber text { fill: #FAEEDA; }
      .blue rect { fill: #0C447C; stroke: #85B7EB; }
      .blue text { fill: #E6F1FB; }
      .blue polygon { fill: #0C447C; stroke: #85B7EB; }
      .ts { fill: #B4B2A9; }
      .arr { stroke: #B4B2A9; }
      .fig { stroke: #F1EFE8; }
      .label { fill: #F1EFE8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="420"/>
  <g class="gray"><rect x="20" y="98" width="90" height="44" rx="8" stroke-width="0.5"/><text class="th" x="65" y="120" text-anchor="middle" dominant-baseline="central">Question</text></g>
  <g class="teal"><rect x="140" y="92" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="210" y="111" text-anchor="middle" dominant-baseline="central">Retrieve</text><text class="ts" x="210" y="130" text-anchor="middle" dominant-baseline="central">parent docs + rerank</text></g>
  <g class="purple"><rect x="310" y="92" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="380" y="111" text-anchor="middle" dominant-baseline="central">Grade passages</text><text class="ts" x="380" y="130" text-anchor="middle" dominant-baseline="central">one LLM call each</text></g>
  <g class="blue"><polygon points="470,120 530,76 590,120 530,164" stroke-width="0.5"/><text class="th" x="530" y="111" text-anchor="middle" dominant-baseline="central">any</text><text class="th" x="530" y="129" text-anchor="middle" dominant-baseline="central">relevant?</text></g>
  <g class="coral"><rect x="630" y="92" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="690" y="111" text-anchor="middle" dominant-baseline="central">Generate</text><text class="ts" x="690" y="130" text-anchor="middle" dominant-baseline="central">original question</text></g>
  <g class="blue"><polygon points="768,120 820,80 872,120 820,160" stroke-width="0.5"/><text class="th" x="820" y="120" text-anchor="middle" dominant-baseline="central">grounded?</text></g>
  <g class="teal"><rect x="770" y="230" width="100" height="56" rx="8" stroke-width="0.5"/><text class="th" x="820" y="249" text-anchor="middle" dominant-baseline="central">Answer</text><text class="ts" x="820" y="268" text-anchor="middle" dominant-baseline="central">+ trace</text></g>
  <g class="gray"><rect x="455" y="230" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="530" y="249" text-anchor="middle" dominant-baseline="central">Rewrite query</text><text class="ts" x="530" y="268" text-anchor="middle" dominant-baseline="central">max 2 rewrites</text></g>
  <g class="gray"><rect x="455" y="330" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="530" y="349" text-anchor="middle" dominant-baseline="central">Give up</text><text class="ts" x="530" y="368" text-anchor="middle" dominant-baseline="central">“not in the documents”</text></g>
  <path d="M112 120 L136 120" class="arr" marker-end="url(#arrow)"/>
  <path d="M282 120 L306 120" class="arr" marker-end="url(#arrow)"/>
  <path d="M452 120 L466 120" class="arr" marker-end="url(#arrow)"/>
  <path d="M592 120 L626 120" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="609" y="108" text-anchor="middle" dominant-baseline="central">yes</text>
  <path d="M752 120 L766 120" class="arr" marker-end="url(#arrow)"/>
  <path d="M820 162 L820 226" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="830" y="194" text-anchor="start" dominant-baseline="central">yes</text>
  <path d="M820 78 L820 40 L690 40 L690 88" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="ts" x="755" y="28" text-anchor="middle" dominant-baseline="central">no: regenerate (max 2 tries)</text>
  <path d="M530 166 L530 226" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="540" y="196" text-anchor="start" dominant-baseline="central">none</text>
  <path d="M453 258 L210 258 L210 152" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="ts" x="340" y="246" text-anchor="middle" dominant-baseline="central">retry with the new query</text>
  <path d="M530 288 L530 326" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="540" y="307" text-anchor="start" dominant-baseline="central">after 2 rewrites</text>
  <text class="label" x="20" y="400">Agentic RAG</text>
</svg>
