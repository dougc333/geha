<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>DSPy dental assistant system architecture</title>
  <desc>A member question is checked by a Jev input guard while query understanding routes exact benefit questions to SQLite and supporting evidence questions to BM25 or BGE vector retrieval. A context compiler combines verified structured rows and retrieved pages for DSPy answer generation. A release gate and DSPy output guard protect the final cited answer.</desc>
  <style>
    .bg { fill: #ffffff; }
    rect { stroke-width: 1.6; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray text { fill: #2C2C2A; }
    .blue rect { fill: #E6F1FB; stroke: #185FA5; } .blue text { fill: #0C447C; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; } .teal text { fill: #085041; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; } .purple text { fill: #3C3489; }
    .amber rect { fill: #FAEEDA; stroke: #854F0B; } .amber text { fill: #633806; }
    .coral rect { fill: #FAECE7; stroke: #993C1D; } .coral text { fill: #712B13; }
    .title { font-size: 22px; font-weight: 700; fill: #222222; }
    .subtitle { font-size: 13px; fill: #5F5E5A; }
    .tq { font-size: 14px; font-weight: 650; }
    .sn { font-size: 11.5px; }
    .edge { fill: none; stroke: #5F5E5A; stroke-width: 1.6; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #888780; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .lbl { font-size: 11px; fill: #444441; }
    .good { fill: #0F6E56; font-weight: 600; }
    .bad { fill: #993C1D; font-weight: 600; }
    .foot { font-size: 12px; font-style: italic; fill: #5F5E5A; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5F5E5A"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="28" y="35">DSPy dental assistant · grounded hybrid architecture</text>
  <text class="subtitle" x="28" y="58">Structured facts come from SQLite; BM25/BGE supply supporting document evidence; models interpret and explain but do not invent benefit values.</text>

  <rect class="dash" x="190" y="78" width="790" height="500" rx="14"/>
  <text class="lbl" x="205" y="72">input safety and answer preparation run concurrently</text>

  <g class="gray">
    <rect x="25" y="286" width="125" height="72" rx="10"/>
    <text class="tq" x="87" y="313" text-anchor="middle">Member</text>
    <text class="sn" x="87" y="334" text-anchor="middle">question</text>
  </g>

  <g class="purple">
    <rect x="220" y="105" width="205" height="82" rx="10"/>
    <text class="tq" x="322" y="130" text-anchor="middle">Input safety guard</text>
    <text class="sn" x="322" y="151" text-anchor="middle">TypeSafe Jev Choice</text>
    <text class="sn" x="322" y="170" text-anchor="middle">injection · PHI · self-harm</text>
  </g>

  <g class="blue">
    <rect x="220" y="274" width="205" height="96" rx="10"/>
    <text class="tq" x="322" y="299" text-anchor="middle">Retrieval + lookup routing</text>
    <text class="sn" x="322" y="320" text-anchor="middle">exact CDT-code detection</text>
    <text class="sn" x="322" y="339" text-anchor="middle">SQLite service-alias matching</text>
    <text class="sn" x="322" y="358" text-anchor="middle">member vocabulary expansion</text>
  </g>

  <g class="teal">
    <rect x="475" y="195" width="205" height="105" rx="10"/>
    <text class="tq" x="577" y="221" text-anchor="middle">Document retrieval</text>
    <text class="sn" x="577" y="242" text-anchor="middle">BM25 exact terms / CDT codes</text>
    <text class="sn" x="577" y="261" text-anchor="middle">BGE vector semantic search</text>
    <text class="sn" x="577" y="280" text-anchor="middle">Docling page evidence</text>
  </g>

  <g class="amber">
    <rect x="475" y="364" width="205" height="116" rx="10"/>
    <text class="tq" x="577" y="390" text-anchor="middle">Structured lookup</text>
    <text class="sn" x="577" y="411" text-anchor="middle">SQLite · dental_benefits.sqlite</text>
    <text class="sn" x="577" y="430" text-anchor="middle">typed cost / limit / eligibility row</text>
    <text class="sn" x="577" y="449" text-anchor="middle">plan year + source page</text>
    <text class="sn" x="577" y="468" text-anchor="middle">no LLM-generated values</text>
  </g>

  <g class="blue">
    <rect x="730" y="274" width="205" height="112" rx="10"/>
    <text class="tq" x="832" y="300" text-anchor="middle">Context compiler</text>
    <text class="sn" x="832" y="321" text-anchor="middle">question + exact SQLite row</text>
    <text class="sn" x="832" y="340" text-anchor="middle">supporting pages + metadata</text>
    <text class="sn" x="832" y="359" text-anchor="middle">allowed citation pages</text>
    <text class="sn" x="832" y="378" text-anchor="middle">replace dense table with selected row</text>
  </g>

  <g class="teal">
    <rect x="730" y="442" width="205" height="83" rx="10"/>
    <text class="tq" x="832" y="469" text-anchor="middle">Draft answer</text>
    <text class="sn" x="832" y="490" text-anchor="middle">DSPy ChainOfThought</text>
    <text class="sn" x="832" y="509" text-anchor="middle">verified [p. N] citations</text>
  </g>

  <g class="amber">
    <rect x="1010" y="232" width="160" height="82" rx="10"/>
    <text class="tq" x="1090" y="258" text-anchor="middle">Release gate</text>
    <text class="sn" x="1090" y="279" text-anchor="middle">input safe</text>
    <text class="sn" x="1090" y="298" text-anchor="middle">and draft complete</text>
  </g>

  <g class="purple">
    <rect x="1010" y="398" width="160" height="90" rx="10"/>
    <text class="tq" x="1090" y="424" text-anchor="middle">Output guard</text>
    <text class="sn" x="1090" y="445" text-anchor="middle">DSPy reads evidence</text>
    <text class="sn" x="1090" y="464" text-anchor="middle">support · PHI · guarantees</text>
  </g>

  <g class="coral">
    <rect x="1010" y="82" width="160" height="78" rx="10"/>
    <text class="tq" x="1090" y="109" text-anchor="middle">Refusal</text>
    <text class="sn" x="1090" y="130" text-anchor="middle">unsafe · error · timeout</text>
    <text class="sn" x="1090" y="148" text-anchor="middle">fail closed</text>
  </g>

  <g class="teal">
    <rect x="1010" y="578" width="160" height="88" rx="10"/>
    <text class="tq" x="1090" y="606" text-anchor="middle">Answer + sources</text>
    <text class="sn" x="1090" y="627" text-anchor="middle">guard verdicts</text>
    <text class="sn" x="1090" y="646" text-anchor="middle">retrieved evidence</text>
  </g>

  <path class="edge" d="M150 322 H190 V146 H218"/>
  <path class="edge" d="M150 322 H218"/>
  <path class="edge" d="M425 303 H450 V247 H473"/>
  <path class="edge" d="M425 341 H450 V422 H473"/>
  <text class="lbl" x="438" y="234">prose</text>
  <text class="lbl" x="434" y="414">exact facts</text>
  <path class="edge" d="M680 247 H705 V305 H728"/>
  <path class="edge" d="M680 422 H705 V355 H728"/>
  <path class="edge" d="M832 386 V440"/>
  <path class="edge" d="M425 146 H975 V252 H1008"/>
  <text class="lbl" x="690" y="138">input verdict</text>
  <path class="edge" d="M935 483 H970 V292 H1008"/>
  <text class="lbl" x="946" y="474">draft</text>
  <path class="edge" d="M1090 232 V162"/>
  <text class="lbl bad" x="1098" y="197">unsafe</text>
  <path class="edge" d="M1090 314 V396"/>
  <text class="lbl good" x="1098" y="359">safe</text>
  <path class="edge" d="M1170 443 H1183 V121 H1172"/>
  <text class="lbl bad" x="1175" y="370" transform="rotate(-90 1175 370)">blocked</text>
  <path class="edge" d="M1090 488 V576"/>
  <text class="lbl good" x="1098" y="538">safe</text>

  <text class="foot" x="28" y="718">Authoritative values are extracted once into SQLite, retain document/page provenance, and are passed unchanged into the generation context.</text>
  <text class="foot" x="28" y="739">Unsupported structured intents fall back to document retrieval; guard errors, timeouts, unsupported claims, and unsafe requests fail closed.</text>
</svg>
