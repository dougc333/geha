<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Comparison diagram: the same query and the same source table run through two retrieval strategies. Row-level chunking shreds the table into disconnected row fragments, so the model receives a bare number with no header context. Table-aware retrieval keeps the table whole, so the model receives region, quarter, and value together."><style>
svg text{ font-family:Arial, Helvetica, sans-serif; fill:#1b2422; }
svg .mono{ font-family:Menlo, monospace; }
svg .label{ font-size:14px; font-weight:600; }
svg .sublabel{ font-size:10.5px; fill:#57645e; }
svg .flowlabel{ font-size:10.5px; fill:#57645e; }
svg .flowlabel.accent{ fill:#b8791f; font-weight:600; }
svg .flowlabel.good{ fill:#2f7d5f; font-weight:600; }
svg .flowlabel.bad{ fill:#b23b3b; font-weight:600; }
svg .celltext{ font-size:10px; }
svg .cellnum{ font-size:10px; font-variant-numeric:tabular-nums; }

</style><rect width="1200" height="560" fill="white"/>
        <defs>
          <marker id="a-bad2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
            <path d="M0,0 L8,4 L0,8 Z" fill="#b23b3b"></path>
          </marker>
          <marker id="a-good2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
            <path d="M0,0 L8,4 L0,8 Z" fill="#2f7d5f"></path>
          </marker>
        </defs>

        <!-- center divider -->
        <line x1="600" y1="100" x2="600" y2="498" stroke="#57645e" stroke-width="1" stroke-dasharray="2,6" opacity="0.5"></line>
        <text x="600" y="300" text-anchor="middle" class="mono sublabel" transform="rotate(-90 600 300)" opacity="0.7">same query · two retrieval strategies</text>

        <!-- shared query -->
        <rect x="410" y="20" width="380" height="64" rx="3" fill="#ffffff" stroke="#33413c" stroke-width="1.25"></rect>
        <text x="600" y="42" text-anchor="middle" class="mono sublabel" style="letter-spacing:.08em">QUERY</text>
        <text x="600" y="63" text-anchor="middle" font-size="13" font-style="italic">“What was the West region’s Q3 revenue?”</text>

        <!-- split arrows -->
        <path d="M540,84 L270,140" fill="none" stroke="#b23b3b" stroke-width="1.5" marker-end="url(#a-bad2)"></path>
        <text x="330" y="112" class="flowlabel bad">naive — row-level chunking</text>
        <path d="M660,84 L930,140" fill="none" stroke="#2f7d5f" stroke-width="1.5" marker-end="url(#a-good2)"></path>
        <text x="870" y="112" text-anchor="end" class="flowlabel good">table-aware — whole table</text>

        <!-- LEFT: shredded fragments -->
        <g transform="rotate(-4 245 183)">
          <rect x="170" y="160" width="150" height="46" rx="2" fill="#f3dbd8" stroke="#b23b3b" stroke-width="1.25" stroke-dasharray="4,3"></rect>
          <text x="245" y="188" text-anchor="middle" class="mono cellnum">14.2&#160;&#160;&#160;9.1</text>
        </g>
        <g transform="rotate(3 265 237)">
          <rect x="190" y="214" width="150" height="46" rx="2" fill="#f3dbd8" stroke="#b23b3b" stroke-width="1.25" stroke-dasharray="4,3"></rect>
          <text x="265" y="242" text-anchor="middle" class="mono cellnum">11.1&#160;&#160;&#160;8.4</text>
        </g>
        <g transform="rotate(-2 235 291)">
          <rect x="160" y="268" width="150" height="46" rx="2" fill="#f3dbd8" stroke="#b23b3b" stroke-width="1.25" stroke-dasharray="4,3"></rect>
          <text x="235" y="296" text-anchor="middle" class="mono cellnum">9.6&#160;&#160;&#160;7.2</text>
        </g>
        <text x="245" y="145" text-anchor="middle" class="sublabel">table shredded into row chunks</text>

        <path d="M245,330 L255,368" fill="none" stroke="#b23b3b" stroke-width="1.5" marker-end="url(#a-bad2)"></path>

        <rect x="120" y="368" width="270" height="120" rx="3" fill="#ffffff" stroke="#b23b3b" stroke-width="1.75"></rect>
        <text x="255" y="392" text-anchor="middle" class="mono sublabel" style="letter-spacing:.08em">MODEL SEES</text>
        <text x="255" y="435" text-anchor="middle" class="mono" font-size="30" fill="#b23b3b" font-weight="500">14.2</text>
        <text x="255" y="454" text-anchor="middle" font-size="12" fill="#b23b3b">✕ no region, no quarter</text>
        <text x="255" y="472" text-anchor="middle" font-size="11" fill="#57645e">header was in a different chunk</text>

        <!-- RIGHT: intact table -->
        <text x="945" y="145" text-anchor="middle" class="sublabel">table kept whole</text>
        <g transform="translate(830,155)" class="mono">
          <rect x="0" y="0" width="230" height="150" fill="#d7ebe1" stroke="#2f7d5f" stroke-width="1.5"></rect>
          <line x1="0" y1="30" x2="230" y2="30" stroke="#2f7d5f" stroke-width="1"></line>
          <line x1="76" y1="0" x2="76" y2="150" stroke="#2f7d5f" stroke-width="0.75"></line>
          <line x1="153" y1="0" x2="153" y2="150" stroke="#2f7d5f" stroke-width="0.75"></line>
          <line x1="0" y1="70" x2="230" y2="70" stroke="#2f7d5f" stroke-width="0.6" opacity="0.6"></line>
          <line x1="0" y1="110" x2="230" y2="110" stroke="#2f7d5f" stroke-width="0.6" opacity="0.6"></line>
          <text x="10" y="20" class="celltext" font-weight="600">Region</text>
          <text x="86" y="20" class="celltext" font-weight="600">Q2</text>
          <text x="163" y="20" class="celltext" font-weight="600">Q3</text>
          <text x="10" y="56" class="cellnum">West</text>
          <text x="86" y="56" class="cellnum">12.4</text>
          <text x="163" y="56" class="cellnum">14.2</text>
          <text x="10" y="96" class="cellnum">East</text>
          <text x="86" y="96" class="cellnum">9.8</text>
          <text x="163" y="96" class="cellnum">11.1</text>
          <text x="10" y="136" class="cellnum">APAC</text>
          <text x="86" y="136" class="cellnum">7.2</text>
          <text x="163" y="136" class="cellnum">9.6</text>
        </g>

        <path d="M945,305 L945,368" fill="none" stroke="#2f7d5f" stroke-width="1.5" marker-end="url(#a-good2)"></path>

        <rect x="805" y="368" width="280" height="120" rx="3" fill="#ffffff" stroke="#2f7d5f" stroke-width="1.75"></rect>
        <text x="945" y="392" text-anchor="middle" class="mono sublabel" style="letter-spacing:.08em">MODEL SEES</text>
        <g transform="translate(845,402)" class="mono">
          <rect x="0" y="0" width="200" height="60" fill="#d7ebe1" stroke="#2f7d5f" stroke-width="1"></rect>
          <line x1="0" y1="15" x2="200" y2="15" stroke="#2f7d5f" stroke-width="0.75"></line>
          <line x1="66" y1="0" x2="66" y2="60" stroke="#2f7d5f" stroke-width="0.6"></line>
          <line x1="133" y1="0" x2="133" y2="60" stroke="#2f7d5f" stroke-width="0.6"></line>
          <text x="6" y="10" font-size="8" font-weight="600">Region</text>
          <text x="72" y="10" font-size="8" font-weight="600">Q2</text>
          <text x="139" y="10" font-size="8" font-weight="600">Q3</text>
          <text x="6" y="27" font-size="8">West</text>
          <text x="72" y="27" font-size="8">12.4</text>
          <text x="139" y="27" font-size="8">14.2</text>
          <text x="6" y="42" font-size="8">East</text>
          <text x="72" y="42" font-size="8">9.8</text>
          <text x="139" y="42" font-size="8">11.1</text>
        </g>
        <text x="945" y="480" text-anchor="middle" font-size="12" fill="#2f7d5f">✓ region, quarter, value — together</text>

      </svg>