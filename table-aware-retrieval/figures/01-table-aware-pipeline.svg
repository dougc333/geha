<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="660" viewBox="0 0 1300 660" role="img" aria-label="Pipeline diagram: a document is parsed into text chunks and intact tables; text chunks are embedded into a vector index while tables are stored whole in a table store and represented in the index only by a summary vector. At query time the index is searched, and a table match is resolved by fetching the full table from the table store before it reaches the model."><style>
svg text{ font-family:Arial, Helvetica, sans-serif; fill:#1b2422; }
svg .mono{ font-family:Menlo, monospace; }
svg .label{ font-size:14px; font-weight:600; }
svg .sublabel{ font-size:10.5px; fill:#57645e; }
svg .flowlabel{ font-size:10.5px; fill:#57645e; }
svg .flowlabel.accent{ fill:#b8791f; font-weight:600; }
svg .flowlabel.good{ fill:#2f7d5f; font-weight:600; }
svg .flowlabel.bad{ fill:#b23b3b; font-weight:600; }
svg .celltext{ font-size:10px; }
svg .cellnum{ font-size:10px; font-variant-numeric:tabular-nums; }

</style><rect width="1300" height="660" fill="white"/>
        <defs>
          <marker id="a-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L8,4 L0,8 Z" fill="#57645e"></path>
          </marker>
          <marker id="a-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
            <path d="M0,0 L8,4 L0,8 Z" fill="#b8791f"></path>
          </marker>
          <marker id="a-good" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L8,4 L0,8 Z" fill="#2f7d5f"></path>
          </marker>
        </defs>

        <!-- ===== lane labels ===== -->
        <text x="40" y="30" class="mono sublabel" style="letter-spacing:.08em">INGESTION</text>
        <text x="40" y="270" class="mono sublabel" style="letter-spacing:.08em">INDEX &amp; STORE</text>
        <text x="40" y="450" class="mono sublabel" style="letter-spacing:.08em">RETRIEVAL</text>

        <!-- ===== connectors (drawn first, under boxes) ===== -->
        <!-- doc -> parser -->
        <path d="M190,140 L250,145" fill="none" stroke="#57645e" stroke-width="1.5" marker-end="url(#a-ink)"></path>
        <!-- parser -> textchunks -->
        <path d="M390,120 L470,95" fill="none" stroke="#57645e" stroke-width="1.5" marker-end="url(#a-ink)"></path>
        <text x="410" y="103" class="flowlabel">prose</text>
        <!-- parser -> table (routed below textchunks) -->
        <path d="M390,155 L700,170 L760,125" fill="none" stroke="#57645e" stroke-width="1.5" marker-end="url(#a-ink)"></path>
        <text x="470" y="184" class="flowlabel">table region</text>

        <!-- textchunks -> vindex -->
        <path d="M565,140 L565,290" fill="none" stroke="#57645e" stroke-width="1.5" marker-end="url(#a-ink)"></path>
        <text x="573" y="220" class="flowlabel">embed chunks</text>

        <!-- table -> vindex (summary embedding) -->
        <path d="M780,200 L720,290" fill="none" stroke="#b8791f" stroke-width="1.5" marker-end="url(#a-accent)"></path>
        <text x="700" y="245" class="flowlabel accent" text-anchor="end">embed summary</text>

        <!-- table -> tstore -->
        <path d="M880,200 L905,290" fill="none" stroke="#57645e" stroke-width="1.5" marker-end="url(#a-ink)"></path>
        <text x="915" y="245" class="flowlabel">store whole, id=T7</text>

        <!-- vindex <-> tstore (query-time lookup) -->
        <path d="M730,335 L798,335" fill="none" stroke="#b8791f" stroke-width="1.75" stroke-dasharray="1,5" stroke-linecap="round" marker-end="url(#a-accent)"></path>
        <text x="764" y="322" text-anchor="middle" class="flowlabel accent">fetch by id</text>

        <!-- query -> embed -->
        <path d="M190,500 L230,500" fill="none" stroke="#57645e" stroke-width="1.5" marker-end="url(#a-ink)"></path>
        <!-- embed -> vindex (search) -->
        <path d="M305,470 L520,392" fill="none" stroke="#57645e" stroke-width="1.5" marker-end="url(#a-ink)"></path>
        <text x="360" y="450" class="flowlabel">search</text>

        <!-- vindex -> context (chunk match, secondary path) -->
        <path d="M600,392 L825,500" fill="none" stroke="#57645e" stroke-width="1.25" stroke-dasharray="4,4" marker-end="url(#a-ink)"></path>
        <text x="640" y="440" class="flowlabel">chunk match</text>

        <!-- tstore -> context (whole table, primary payoff path) -->
        <path d="M910,392 L905,500" fill="none" stroke="#2f7d5f" stroke-width="2.25" marker-end="url(#a-good)"></path>
        <text x="920" y="450" class="flowlabel good">whole table, intact</text>

        <!-- context -> llm -->
        <path d="M1030,555 L1090,558" fill="none" stroke="#57645e" stroke-width="1.5" marker-end="url(#a-ink)"></path>

        <!-- ===== boxes ===== -->

        <!-- Source Document -->
        <rect x="40" y="60" width="150" height="160" rx="3" fill="#e2e7e2" stroke="#33413c" stroke-width="1.25"></rect>
        <line x1="62" y1="86" x2="168" y2="86" stroke="#57645e" stroke-width="2"></line>
        <line x1="62" y1="98" x2="150" y2="98" stroke="#57645e" stroke-width="2"></line>
        <line x1="62" y1="110" x2="160" y2="110" stroke="#57645e" stroke-width="2"></line>
        <g transform="translate(62,126)">
          <rect x="0" y="0" width="106" height="42" fill="none" stroke="#b8791f" stroke-width="1.5"></rect>
          <line x1="0" y1="14" x2="106" y2="14" stroke="#b8791f" stroke-width="1"></line>
          <line x1="0" y1="28" x2="106" y2="28" stroke="#b8791f" stroke-width="1"></line>
          <line x1="35" y1="0" x2="35" y2="42" stroke="#b8791f" stroke-width="1"></line>
          <line x1="70" y1="0" x2="70" y2="42" stroke="#b8791f" stroke-width="1"></line>
        </g>
        <text x="62" y="188" class="label">Source Document</text>
        <text x="62" y="203" class="sublabel">quarterly filing, p.14</text>

        <!-- Parser -->
        <rect x="250" y="110" width="140" height="70" rx="3" fill="#ffffff" stroke="#33413c" stroke-width="1.25"></rect>
        <text x="264" y="140" class="label">Layout-Aware</text>
        <text x="264" y="156" class="label">Parser</text>
        <text x="264" y="172" class="sublabel">splits prose from tables</text>

        <!-- Text Chunks -->
        <rect x="470" y="50" width="190" height="90" rx="3" fill="#ffffff" stroke="#33413c" stroke-width="1.25"></rect>
        <text x="484" y="72" class="label">Text Chunks</text>
        <rect x="484" y="82" width="140" height="14" fill="#e2e7e2" stroke="#57645e" stroke-width="0.75"></rect>
        <rect x="484" y="99" width="140" height="14" fill="#e2e7e2" stroke="#57645e" stroke-width="0.75"></rect>
        <rect x="484" y="116" width="100" height="14" fill="#e2e7e2" stroke="#57645e" stroke-width="0.75"></rect>

        <!-- Table (kept intact) -->
        <rect x="760" y="50" width="210" height="150" rx="3" fill="#ffffff" stroke="#b8791f" stroke-width="1.75"></rect>
        <text x="774" y="72" class="label">Table — kept intact</text>
        <text x="774" y="86" class="sublabel">not split into rows or cells</text>
        <g transform="translate(774,96)" class="mono">
          <rect x="0" y="0" width="182" height="88" fill="#f1dcb0" stroke="#b8791f" stroke-width="1"></rect>
          <line x1="0" y1="22" x2="182" y2="22" stroke="#b8791f" stroke-width="1"></line>
          <line x1="60" y1="0" x2="60" y2="88" stroke="#b8791f" stroke-width="0.75"></line>
          <line x1="121" y1="0" x2="121" y2="88" stroke="#b8791f" stroke-width="0.75"></line>
          <line x1="0" y1="44" x2="182" y2="44" stroke="#b8791f" stroke-width="0.6" opacity="0.6"></line>
          <line x1="0" y1="66" x2="182" y2="66" stroke="#b8791f" stroke-width="0.6" opacity="0.6"></line>
          <text x="8" y="15" class="celltext" font-weight="600">Region</text>
          <text x="68" y="15" class="celltext" font-weight="600">Q2</text>
          <text x="129" y="15" class="celltext" font-weight="600">Q3</text>
          <text x="8" y="37" class="cellnum">West</text>
          <text x="68" y="37" class="cellnum">12.4</text>
          <text x="129" y="37" class="cellnum">14.2</text>
          <text x="8" y="59" class="cellnum">East</text>
          <text x="68" y="59" class="cellnum">9.8</text>
          <text x="129" y="59" class="cellnum">11.1</text>
          <text x="8" y="81" class="cellnum">APAC</text>
          <text x="68" y="81" class="cellnum">7.2</text>
          <text x="129" y="81" class="cellnum">9.6</text>
        </g>

        <!-- Vector Index -->
        <rect x="470" y="290" width="260" height="100" rx="3" fill="#ffffff" stroke="#33413c" stroke-width="1.25"></rect>
        <text x="484" y="315" class="label">Vector Index</text>
        <text x="484" y="333" class="sublabel">chunk vectors +</text>
        <text x="484" y="346" class="sublabel">table-summary vectors (→ id)</text>
        <rect x="484" y="356" width="14" height="14" fill="#e2e7e2" stroke="#57645e" stroke-width="0.75"></rect>
        <text x="503" y="367" class="sublabel" font-family="Arial, Helvetica, sans-serif">chunk</text>
        <rect x="560" y="356" width="14" height="14" fill="#f1dcb0" stroke="#b8791f" stroke-width="0.75"></rect>
        <text x="579" y="367" class="sublabel" font-family="Arial, Helvetica, sans-serif" fill="#b8791f">table → id</text>

        <!-- Table Store -->
        <rect x="800" y="290" width="220" height="100" rx="3" fill="#ffffff" stroke="#b8791f" stroke-width="1.5"></rect>
        <text x="814" y="315" class="label">Table Store</text>
        <text x="814" y="333" class="sublabel">full tables, keyed by id</text>
        <g transform="translate(814,344)" class="mono" font-size="9.5">
          <text x="0" y="10" fill="#57645e">T7</text>
          <text x="28" y="10" fill="#57645e">Region / Q2 / Q3 …</text>
          <text x="0" y="24" fill="#57645e">T8</text>
          <text x="28" y="24" fill="#57645e">Headcount by site …</text>
        </g>

        <!-- User Query -->
        <rect x="40" y="470" width="150" height="60" rx="3" fill="#ffffff" stroke="#33413c" stroke-width="1.25"></rect>
        <text x="54" y="494" class="label">User Query</text>
        <text x="54" y="510" class="sublabel">“West Q3 revenue?”</text>

        <!-- Embed Query -->
        <rect x="230" y="470" width="150" height="60" rx="3" fill="#ffffff" stroke="#33413c" stroke-width="1.25"></rect>
        <text x="244" y="505" class="label">Embed Query</text>

        <!-- Context -->
        <rect x="800" y="500" width="230" height="110" rx="3" fill="#ffffff" stroke="#2f7d5f" stroke-width="1.75"></rect>
        <text x="814" y="524" class="label">Context → LLM</text>
        <line x1="814" y1="534" x2="954" y2="534" stroke="#57645e" stroke-width="1.5"></line>
        <g transform="translate(814,544)" class="mono">
          <rect x="0" y="0" width="120" height="56" fill="#d7ebe1" stroke="#2f7d5f" stroke-width="1"></rect>
          <line x1="0" y1="14" x2="120" y2="14" stroke="#2f7d5f" stroke-width="0.75"></line>
          <line x1="40" y1="0" x2="40" y2="56" stroke="#2f7d5f" stroke-width="0.6"></line>
          <line x1="80" y1="0" x2="80" y2="56" stroke="#2f7d5f" stroke-width="0.6"></line>
          <line x1="0" y1="28" x2="120" y2="28" stroke="#2f7d5f" stroke-width="0.5" opacity="0.6"></line>
          <line x1="0" y1="42" x2="120" y2="42" stroke="#2f7d5f" stroke-width="0.5" opacity="0.6"></line>
          <text x="4" y="10" font-size="7.5" font-weight="600">Region</text>
          <text x="44" y="10" font-size="7.5" font-weight="600">Q2</text>
          <text x="84" y="10" font-size="7.5" font-weight="600">Q3</text>
          <text x="4" y="24" font-size="7.5">West</text>
          <text x="44" y="24" font-size="7.5">12.4</text>
          <text x="84" y="24" font-size="7.5">14.2</text>
        </g>

        <!-- LLM -->
        <rect x="1090" y="515" width="160" height="90" rx="3" fill="#e2e7e2" stroke="#33413c" stroke-width="1.25"></rect>
        <text x="1170" y="565" text-anchor="middle" class="label">LLM</text>

      </svg>